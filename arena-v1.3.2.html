      else if (wallSide === 'left') direction = -Math.sign(Math.sin(h.ang));
      else if (wallSide === 'top') direction = Math.sign(Math.cos(h.ang));
      else if (wallSide === 'bottom') direction = -Math.sign(Math.cos(h.ang));
      h.omega = (direction || -Math.sign(h.omega)) * Math.abs(h.omega);
      hitWall = true;
    }
    h.ax = anchorX;
    h.ay = anchorY;
    var justReleased = false;
    if (h.hooked && h.target != null && hp[h.target] > 0) {
      var target2 = balls[h.target];
      target2.x = anchorX;
      target2.y = anchorY;
      target2.vx = 0;
      target2.vy = 0;
      h.t += dt;
      if (hitWall) {
        var wallDmg = rollHookDamage(ROLES[selected[h.owner]]);
        var wallHpBefore = hp[h.target];
        dealDamage(h.target, wallDmg, owner2.color, anchorX, anchorY, h.owner);
        applyHookLifesteal(h.owner, wallHpBefore - hp[h.target]);
        spawnParticles(anchorX, anchorY, '#ffffff', 18);
        floatTexts.push({
          x: anchorX, y: anchorY - 30,
          text: '撞墙 -' + wallDmg, life: 0.9, color: '#ffffff'
        });
        h.hits++;
        if (finished) return;
      }
      if (h.hits >= ROLE_HOOK_HITS || h.t >= ROLE_HOOK_SPIN) {
        var releasedTarget = target2;
        h.released = true;
        h.cd = ROLE_HOOK_COOLDOWN;
        h.target = null;
        h.hooked = false;
        h.t = 0;
        justReleased = true;
        var releaseAng = Math.atan2(releasedTarget.y - owner2.y, releasedTarget.x - owner2.x);
        releasedTarget.vx = Math.cos(releaseAng) * BALL_SPEED * 0.8;
        releasedTarget.vy = Math.sin(releaseAng) * BALL_SPEED * 0.8;
        clampSpeed(releasedTarget);
        floatTexts.push({
          x: owner2.x, y: owner2.y - 30,
          text: (h.hits >= ROLE_HOOK_HITS ? '挣脱！' : '释放！') +
            '冷却 ' + ROLE_HOOK_COOLDOWN + 's',
          life: 1.2, color: owner2.color
        });
      }
    } else if (h.hooked) {
      h.target = null;
      h.hooked = false;
      h.t = 0;
    }
    if (!h.released && !h.hooked && !justReleased) {
      var enemyIndex = findEnemy(h.owner);
      if (enemyIndex >= 0) {
        var enemy = balls[enemyIndex];
        var dx = enemy.x - anchorX;
        var dy = enemy.y - anchorY;
        if (Math.hypot(dx, dy) <= ROLE_HOOK_COLLISION_RADIUS) {
          h.target = enemyIndex;
          h.hooked = true;
          h.t = 0;
          var dmg = rollHookDamage(ROLES[selected[h.owner]]);
          var hookHpBefore = hp[enemyIndex];
          dealDamage(enemyIndex, dmg, owner2.color, anchorX, anchorY, h.owner);
          applyHookLifesteal(h.owner, hookHpBefore - hp[enemyIndex]);
          if (finished) return;
          floatTexts.push({ x: enemy.x, y: enemy.y - 30, text: '钩中！', life: 1.1, color: owner2.color });
        }
      }
    }
    owner2.hookAngle = h.ang;
  }
}

function collideBalls() {
  for (var i = 0; i < balls.length; i++) {
    for (var j = i + 1; j < balls.length; j++) {
      if (hp[i] <= 0 || hp[j] <= 0) continue;
      if (isHookedBall(i) || isHookedBall(j)) continue;
      var a = balls[i], b = balls[j];
      var dx = b.x - a.x, dy = b.y - a.y;
      var d = Math.hypot(dx, dy);
      if (d === 0 || d > BALL_R * 2) continue;
      var overlap = (BALL_R * 2 - d) / 2;
      var nx = dx / d, ny = dy / d;
      a.x -= nx * overlap; a.y -= ny * overlap;
      b.x += nx * overlap; b.y += ny * overlap;
      var dvx = b.vx - a.vx, dvy = b.vy - a.vy;
      var sep = dvx * nx + dvy * ny;
      if (sep > 0) continue;
      a.vx += sep * nx; a.vy += sep * ny;
      b.vx -= sep * nx; b.vy -= sep * ny;
      clampSpeed(a);
      clampSpeed(b);
      spawnParticles(a.x + nx * BALL_R, a.y + ny * BALL_R, a.color, 6);
      spawnParticles(b.x - nx * BALL_R, b.y - ny * BALL_R, b.color, 6);

      if (teamOf(i) === teamOf(j)) continue;
      for (var attackerOffset = 0; attackerOffset < 2; attackerOffset++) {
        var attacker = attackerOffset === 0 ? i : j;
        var target = attackerOffset === 0 ? j : i;
        var attackerRole = ROLES[selected[attacker]].role;
        if (bumpLock[attacker] > 0) continue;
        if (attackerRole === 'shield') {
          dealDamage(target, ROLE_SHIELD_BUMP, balls[attacker].color,
            balls[attacker].x, balls[attacker].y, attacker);
          bumpLock[attacker] = 0.4;
        } else if (attackerRole === 'splitter') {
          // BOSS 分裂体：撞击敌方造成 3 伤，带 0.4 秒伤害锁
          var splitterRole = ROLES[selected[attacker]];
          dealDamage(target, splitterRole.bumpDamage || ROLE_SPLIT_BUMP_DMG,
            balls[attacker].color, balls[attacker].x, balls[attacker].y, attacker);
          bumpLock[attacker] = ROLE_SPLIT_BUMP_LOCK;
        } else if (attackerRole === 'vampire') {
          var damage = ROLE_VAMPIRE_DMG_MIN +
            Math.floor(Math.random() * (ROLE_VAMPIRE_DMG_MAX - ROLE_VAMPIRE_DMG_MIN + 1));
          dealDamage(target, damage, balls[attacker].color,
            balls[attacker].x, balls[attacker].y, attacker);
          hp[attacker] = Math.min(ROLES[selected[attacker]].maxHp, hp[attacker] + damage);
          floatTexts.push({
            x: balls[attacker].x, y: balls[attacker].y - 22,
            text: '+' + damage, life: 1, color: '#ff2d6f'
          });
          spawnParticles(balls[attacker].x, balls[attacker].y, '#ff2d6f', 12);
          bumpLock[attacker] = ROLE_VAMPIRE_LOCK;
          var angle = Math.random() * Math.PI * 2;
          var speed = BALL_SPEED * (0.85 + Math.random() * 0.15);
          balls[attacker].vx = Math.cos(angle) * speed;
          balls[attacker].vy = Math.sin(angle) * speed;
        }
        if (finished) return;
      }
    }
  }
}

/* ============ 绘制 ============ */
function drawBackground() {
  ctx.fillStyle = '#0b1020';
  ctx.fillRect(0, 0, W, H);
  var cx = ARENA.x + ARENA.size / 2;
  var cy = ARENA.y + ARENA.size / 2;
  var g = ctx.createRadialGradient(cx, cy, 50, cx, cy, ARENA.size * 0.7);
  g.addColorStop(0, 'rgba(79,195,255,.06)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(ARENA.x, ARENA.y, ARENA.size, ARENA.size);
  ctx.strokeStyle = 'rgba(255,255,255,.045)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var x = ARENA.x; x <= ARENA.x + ARENA.size; x += 40) {
    ctx.moveTo(x, ARENA.y); ctx.lineTo(x, ARENA.y + ARENA.size);
  }
  for (var y = ARENA.y; y <= ARENA.y + ARENA.size; y += 40) {
    ctx.moveTo(ARENA.x, y); ctx.lineTo(ARENA.x + ARENA.size, y);
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.08)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx, ARENA.y + 10); ctx.lineTo(cx, ARENA.y + ARENA.size - 10);
  ctx.moveTo(ARENA.x + 10, cy); ctx.lineTo(ARENA.x + ARENA.size - 10, cy);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.12)';
  ctx.beginPath();
  ctx.arc(cx, cy, 30, 0, Math.PI * 2);
  ctx.stroke();
}

function drawArena() {
  ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(79,195,255,.5)';
  ctx.shadowBlur = 18;
  ctx.strokeStyle = 'rgba(120,180,255,.9)';
  ctx.lineWidth = ARENA.thickness;
  ctx.strokeRect(ARENA.x, ARENA.y, ARENA.size, ARENA.size);
  ctx.shadowBlur = 0;
}

function drawBall(b, index) {
  // 队徽按“队伍”判定，而不是按球对象身份：
  // 1v1 时 teamOf(0)=0、teamOf(1)=1；2v2 时 0/2 号是蓝方、1/3 号是粉方，
  // 这样两个同队小球外观一致，不会出现“蓝 2 号被当成粉方”的情况。
  var pos = index != null ? index : balls.indexOf(b);
  var isBlue = teamOf(pos) === 0;
  ctx.beginPath();
  ctx.arc(b.x, b.y, BALL_R + 8, 0, Math.PI * 2);
  var g = ctx.createRadialGradient(b.x, b.y, BALL_R, b.x, b.y, BALL_R + 8);
  g.addColorStop(0, b.glow);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
  var lg = ctx.createLinearGradient(b.x - BALL_R, b.y - BALL_R, b.x + BALL_R, b.y + BALL_R);
  if (b.gradient) {
    // 渐变球（吸血舰长）：等效于 CSS linear-gradient，红 → 紫 → 蓝
    var stops = b.gradient;
    for (var gi = 0; gi < stops.length; gi++) {
      lg.addColorStop(stops.length === 1 ? 0 : gi / (stops.length - 1), stops[gi]);
    }
    // 左上角压一点白色高光，保持和其他球的立体感一致
    var shine = ctx.createRadialGradient(
      b.x - BALL_R * 0.4, b.y - BALL_R * 0.4, 1,
      b.x - BALL_R * 0.4, b.y - BALL_R * 0.4, BALL_R * 1.4);
    shine.addColorStop(0, 'rgba(255,255,255,.55)');
    shine.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = lg;
    ctx.fill();
    ctx.fillStyle = shine;
    ctx.fill();
  } else {
    lg.addColorStop(0, '#ffffff');
    lg.addColorStop(0.35, b.color);
    lg.addColorStop(1, shade(b.color, -0.35));
    ctx.fillStyle = lg;
    ctx.fill();
  }
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = isBlue ? 'rgba(255,255,255,.9)' : 'rgba(0,0,0,.35)';
  ctx.stroke();
  // 队徽：蓝方为三角，粉方为菱形，一眼区分
  ctx.beginPath();
  if (isBlue) {
    ctx.moveTo(b.x, b.y - 6);
    ctx.lineTo(b.x - 5.5, b.y + 3.5);
    ctx.lineTo(b.x + 5.5, b.y + 3.5);
  } else {
    ctx.moveTo(b.x, b.y - 6);
    ctx.lineTo(b.x + 6, b.y);
    ctx.lineTo(b.x, b.y + 6);
    ctx.lineTo(b.x - 6, b.y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.fill();
}


function drawDynamites() {
  for (var i = 0; i < dynamites.length; i++) {
    var d = dynamites[i];
    var t = 1 - d.fuse / d.fuseMax;   // 0 → 1，引信越短越亮
    // 爆炸范围预览圈：爆破手系与算式炸药共用，半径取该发炸药的爆炸半径（默认 120px）
    // 引信越短圈越亮；飞行中就能看出这一发会波及到哪
    var rangeRadius = d.radius != null ? d.radius : ROLE_DYN_RADIUS;
    var rangeColor = d.color ||
      (balls[d.owner] && balls[d.owner].color) || '#ff8a3d';
    ctx.beginPath();
    ctx.arc(d.x, d.y, rangeRadius, 0, Math.PI * 2);
    ctx.strokeStyle = rangeColor;
    ctx.globalAlpha = d.math ? (0.22 + 0.18 * t) : (0.13 + 0.17 * t);
    ctx.lineWidth = d.math ? 2 : 1.5;
    ctx.setLineDash([6, 8]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    // 半径由算式决定的版本（爆破数学家V2）：在圈底标出这一发的实际半径
    if (d.radiusFromFormula) {
      var radiusLabelY = Math.min(d.y + rangeRadius + 12, ARENA.y + ARENA.size - 4);
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = rangeColor;
      ctx.globalAlpha = 0.9;
      ctx.fillText(Math.round(rangeRadius) + 'px', d.x, radiusLabelY);
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }
    // 引信火花
    ctx.beginPath();
    ctx.arc(d.x, d.y - d.r - 4, 2.4, 0, Math.PI * 2);
    ctx.fillStyle = '#fff3c4';
    ctx.shadowColor = '#ffb347';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
    // 药体
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    var grd = ctx.createRadialGradient(d.x - 3, d.y - 3, 1, d.x, d.y, d.r);
    if (d.math) {
      grd.addColorStop(0, '#ffd9fb');
      grd.addColorStop(1, '#6b2a86');
    } else {
      grd.addColorStop(0, '#ffd28a');
      grd.addColorStop(1, '#c1440a');
    }
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = d.math ? '#3d1152' : '#7a2c06';
    ctx.stroke();
    // 算式炸药：药体上标出这一发将造成的伤害
    if (d.math) {
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(formatMathNumber(d.dmg || 0), d.x, d.y + 3.5);
      ctx.textAlign = 'left';
    }
    // 倒计时环（引信进度）
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r + 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * t);
    ctx.strokeStyle = t > 0.66 ? '#ff4d2e' : '#ffb347';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function drawTrains() {
  if (!trains.length) return;
  ctx.save();
  ctx.beginPath();
  ctx.rect(ARENA.x, ARENA.y, ARENA.size, ARENA.size);
  ctx.clip();

  for (var i = 0; i < trains.length; i++) {
    var train = trains[i];
    var color = ROLES[selected[train.owner]].color;
    ctx.save();
    ctx.translate(train.x, train.y);
    if (train.axis === 'vertical') ctx.rotate(Math.PI / 2);

    ctx.shadowColor = color;
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#20283b';
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(-train.length / 2, -train.width / 2, train.length, train.width, 7);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = color;
    ctx.fillRect(-train.length / 2 + 8, -train.width / 2 + 6, 20, train.width - 12);
    ctx.fillRect(train.length / 2 - 28, -train.width / 2 + 6, 20, train.width - 12);
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (var windowX = -train.length / 2 + 38;
         windowX < train.length / 2 - 34;
         windowX += 32) {
      ctx.fillRect(windowX, -train.width / 2 + 6, 22, train.width - 12);
    }

    ctx.fillStyle = '#161b29';
    for (var wheel = -2; wheel <= 2; wheel++) {
      ctx.beginPath();
      ctx.arc(wheel * 34, train.width / 2 - 1, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();
}

function drawBullets() {
  for (var i = 0; i < bullets.length; i++) {
    var bl = bullets[i];
    ctx.beginPath();
    ctx.arc(bl.x, bl.y, BULLET_R + 5, 0, Math.PI * 2);
    var g = ctx.createRadialGradient(bl.x, bl.y, 1, bl.x, bl.y, BULLET_R + 5);
    g.addColorStop(0, bl.color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(bl.x, bl.y, BULLET_R, 0, Math.PI * 2);
    ctx.fillStyle = bl.kind === 'heal' ? '#67e8a5' : '#fff';
    ctx.fill();
    if (bl.kind === 'heal') {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(bl.x - 3, bl.y);
      ctx.lineTo(bl.x + 3, bl.y);
      ctx.moveTo(bl.x, bl.y - 3);
      ctx.lineTo(bl.x, bl.y + 3);
      ctx.stroke();
    }
  }
}

function drawParticles() {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5 * p.life + 0.5, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloatTexts() {
  ctx.textAlign = 'center';
  ctx.font = 'bold 18px sans-serif';
  for (var i = 0; i < floatTexts.length; i++) {
    var f = floatTexts[i];
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

// 舰长同款技能可视化：球顶双环
// 外环 = 冷却 / 技能持续时长（灰底 + 主色填充，满环=刚释放）
// 内环 = 当前效果剩余时长（彩色高亮，带脉冲发光）
function drawSkillRing(b) {
  var p = balls.indexOf(b);
  if (p < 0) return;
  var role = ROLES[selected[p]].role;
  var cx = b.x, cy = b.y - BALL_R - 16;
  var coolFrac = 0, coolMax = 0, coolColor = '#4fc3ff', coolLabel = '';
  var actFrac = 0, actMax = 0, actColor = '#ffd54a', actLabel = '', actGlow = false;

  if (role === 'hook') {
    var h = hook[p];
    if (h && h.released && h.cd > 0) {
      coolFrac = h.cd / ROLE_HOOK_COOLDOWN; coolMax = ROLE_HOOK_COOLDOWN;
      coolColor = '#ff8a65'; coolLabel = h.cd.toFixed(1) + 's';
    } else if (h && !h.released && h.hooked) {
      coolFrac = h.t / ROLE_HOOK_SPIN; coolMax = ROLE_HOOK_SPIN;
      coolColor = '#1f9ea8'; coolLabel = h.t.toFixed(1) + 's';
    }
  } else if (role === 'gun') {
    if (cd[p] > 0) {
      coolFrac = cd[p] / ROLE_GUN_CD; coolMax = ROLE_GUN_CD;
      coolColor = '#ffb74d'; coolLabel = cd[p].toFixed(1) + 's';
    }
  } else if (role === 'dispatcher') {
    if (cd[p] > 0) {
      coolFrac = cd[p] / ROLE_DISPATCHER_CD; coolMax = ROLE_DISPATCHER_CD;
      coolColor = '#ffd166'; coolLabel = cd[p].toFixed(1) + 's';
    }
  } else if (role === 'dynamite') {
    if (cd[p] > 0) {
      coolMax = ROLES[selected[p]].cd || 10; coolFrac = cd[p] / coolMax;
      coolColor = '#ff7043'; coolLabel = cd[p].toFixed(1) + 's';
    }
  } else if (role === 'cowboy') {
    if (b.cowboyIdx != null && b.cowboyIdx < ROLE_COWBOY_SHOTS) {
      actMax = ROLE_COWBOY_PAUSE; actFrac = 1 - Math.max(0, b.cowboyNext) / actMax;
      actColor = '#ff7043'; actLabel = (b.cowboyIdx + 1) + '/' + ROLE_COWBOY_SHOTS; actGlow = true;
    }
    if (cd[p] > 0) {
      coolFrac = cd[p] / ROLE_COWBOY_CD; coolMax = ROLE_COWBOY_CD;
      coolColor = '#ff7043'; coolLabel = cd[p].toFixed(1) + 's';
    }
  } else if (role === 'gunner') {
    if (cd[p] > 0) {
      coolFrac = cd[p] / ROLE_GUNNER_CD; coolMax = ROLE_GUNNER_CD;
      coolColor = '#4fc3ff'; coolLabel = cd[p].toFixed(1) + 's';
    }
  } else if (role === 'ghost') {
    var gp = b.ghostPhase || 'cooldown', gt = b.ghostT || 0;
    if (gp === 'warp') {
      actMax = ROLE_GHOST_WARP; actFrac = gt / actMax;
      actColor = '#b388ff'; actLabel = gt.toFixed(1) + 's'; actGlow = true;
    }
    if (gp === 'cooldown') {
      coolMax = ROLE_GHOST_CD; coolFrac = gt / coolMax;
      coolColor = '#b388ff'; coolLabel = gt.toFixed(1) + 's';
    } else if (gp === 'ready') {
      coolMax = ROLE_GHOST_CD; coolFrac = 0;
      coolColor = '#9be7ff'; coolLabel = '受击';
    }
  } else if (role === 'medic') {
    if (b.medicRevivePhase === 'charging') {
      // 复活蓄力优先显示（30 秒环）
      actMax = ROLE_MEDIC_REVIVE_CHARGE;
      actFrac = 1 - Math.max(0, b.medicReviveT) / actMax;
      actColor = '#67e8a5'; actLabel = '复活'; actGlow = true;
    } else if (b.medicPhase === 'cooldown') {
      coolMax = ROLE_MEDIC_CD; coolFrac = b.medicT / coolMax;
      coolColor = '#67e8a5'; coolLabel = b.medicT.toFixed(1) + 's';
    } else if (b.medicPhase === 'ready') {
      coolMax = ROLE_MEDIC_CD; coolColor = '#67e8a5'; coolLabel = '待触发';
    } else if (b.medicPhase === 'charge') {
      actMax = ROLE_MEDIC_CHARGE;
      actFrac = 1 - Math.max(0, b.medicT) / actMax;
      actColor = '#67e8a5'; actLabel = b.medicT.toFixed(1) + 's'; actGlow = true;
    }
  } else if (role === 'mathematician') {
    if (b.mathPhase === 'cooldown') {
      coolMax = ROLE_MATH_CD; coolFrac = b.mathT / coolMax;
      coolColor = '#f0d66d'; coolLabel = b.mathT.toFixed(1) + 's';
    } else if (b.mathPhase === 'charge') {
      actMax = ROLE_MATH_CHARGE;
      actFrac = 1 - Math.max(0, b.mathT) / actMax;
      actColor = '#f0d66d'; actLabel = b.mathT.toFixed(1) + 's'; actGlow = true;
    }
  } else if (role === 'dynmath') {
    if (b.dynmathPhase === 'cooldown') {
      coolMax = ROLE_DYNMATH_CD; coolFrac = b.dynmathT / coolMax;
      coolColor = ROLES[selected[p]].color; coolLabel = b.dynmathT.toFixed(1) + 's';
    } else if (b.dynmathPhase === 'charge') {
      actMax = ROLE_DYNMATH_CHARGE;
      actFrac = 1 - Math.max(0, b.dynmathT) / actMax;
      actColor = ROLES[selected[p]].color; actLabel = b.dynmathT.toFixed(1) + 's'; actGlow = true;
    }
  } else if (role === 'physicist') {
    if (b.physPhase === 'active') {
      actMax = ROLE_PHYS_DURATION;
      actFrac = Math.max(0, b.physT) / actMax;
      actColor = ROLES[selected[p]].color; actLabel = b.physT.toFixed(1) + 's'; actGlow = true;
    } else if (b.physT > 0) {
      coolMax = ROLE_PHYS_CD; coolFrac = b.physT / coolMax;
      coolColor = ROLES[selected[p]].color; coolLabel = b.physT.toFixed(1) + 's';
    }
  } else if (role === 'virus') {
    // 病毒：只显示放罐冷却
    if (cd[p] > 0) {
      coolMax = ROLE_VIRUS_CD; coolFrac = cd[p] / coolMax;
      coolColor = ROLES[selected[p]].color; coolLabel = cd[p].toFixed(1) + 's';
    }
  } else if (role === 'guard') {
    // 保安：无冷却，用内环提示“正在拉线”
    if (b.guardStage === 'first') {
      actMax = 1; actFrac = 1;
      actColor = ROLES[selected[p]].color; actLabel = '拉线'; actGlow = true;
    }
  } else if (role === 'splitter') {
    var spRole = ROLES[selected[p]];
    // 环里显示这颗球当前的血量（向下取整，避免 49.5 显示成 50 造成误判）
    // 环的进度与颜色仍然表达状态：橙=禁疗中、青=回血中/满血
    var hpLabel = String(Math.floor(hp[p]));
    if (b.splitNoRegenT > 0) {
      // 分裂后的禁疗期
      actMax = spRole.noRegenAfterSplit;
      actFrac = 1 - Math.max(0, b.splitNoRegenT) / actMax;
      actColor = '#ff7043'; actLabel = hpLabel; actGlow = true;
    } else if (hp[p] >= spRole.maxHp) {
      // 满血：等待下一次分裂判定
      coolMax = bossSplitInterval();
      coolFrac = Math.max(0, bossSplitT) / coolMax;
      coolColor = '#7cf5c8'; coolLabel = hpLabel;
    } else {
      // 回血中
      coolMax = spRole.regenInterval;
      coolFrac = 1 - Math.max(0, b.splitRegenT) / coolMax;
      coolColor = '#7cf5c8'; coolLabel = hpLabel;
    }
  }
  if (!coolMax && !actMax) return;

  var R1 = 9, R2 = 6, lw1 = 2.6, lw2 = 2.4, start = -Math.PI / 2;

  if (coolMax) {
    ctx.beginPath();
    ctx.arc(cx, cy, R1, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.lineWidth = lw1;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, R1, start, start + Math.PI * 2 * Math.min(1, Math.max(0, coolFrac)));
    ctx.strokeStyle = coolColor;
    ctx.lineWidth = lw1;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.lineCap = 'butt';
  }
  if (actMax) {
    if (actGlow) {
      ctx.beginPath();
      ctx.arc(cx, cy, R2 - 3, 0, Math.PI * 2);
      ctx.fillStyle = actColor;
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(globalTime * 6);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.beginPath();
    ctx.arc(cx, cy, R2, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.lineWidth = lw2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, R2, start, start + Math.PI * 2 * Math.min(1, Math.max(0, actFrac)));
    ctx.strokeStyle = actColor;
    ctx.lineWidth = lw2;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.lineCap = 'butt';
  }
  if (coolLabel || actLabel) {
    ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = actLabel ? actColor : coolColor;
    ctx.fillText(actLabel || coolLabel, cx, cy + 3.2);
    ctx.textAlign = 'left';
  }
}

// 血量条下的技能文字标签：复刻 drawHUD 中 drawBar 的样式
function drawSkillLabel(b, x, y, main, sub) {
  if (main == null || main === '') return;
  ctx.save();
  ctx.font = 'bold 12px sans-serif';
  var w = ctx.measureText(String(main)).width + 12;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(13,16,24,.75)';
  ctx.beginPath();
  ctx.rect(x - w / 2 - 4, y - 12, w + 8, 16);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.2)';
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.fillText(main, x, y - 1);
  if (sub) {
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,.65)';
    ctx.fillText(sub, x + w / 2 + 6, y - 1);
  }
  ctx.restore();
}

// 根据角色与技能状态生成标签文字
function getSkillLabel(b) {
  var p = balls.indexOf(b);
  if (p < 0) return null;
  var role = ROLES[selected[p]].role, main = null, sub = null;
  if (role === 'hook') {
    var h = hook[p];
    if (h && h.released && h.cd > 0) { main = h.cd.toFixed(1) + 's'; sub = '船锚冷却'; }
    else if (h && !h.released && h.hooked) { main = h.t.toFixed(1) + 's'; sub = '被钩住'; }
    else if (h && !h.released) { main = '旋转中'; sub = '船锚'; }
  } else if (role === 'gun') {
    if (cd[p] > 0) { main = cd[p].toFixed(1) + 's'; sub = '点射'; }
    else { main = '就绪'; sub = '点射'; }
  } else if (role === 'gunner') {
    if (cd[p] > 0) { main = cd[p].toFixed(1) + 's'; sub = '点射'; }
    else { main = '就绪'; sub = '点射'; }
  } else if (role === 'dispatcher') {
    if (cd[p] > 0) { main = cd[p].toFixed(1) + 's'; sub = '列车调度'; }
    else { main = '就绪'; sub = '列车调度'; }
  } else if (role === 'dynamite') {
    if (cd[p] > 0) { main = cd[p].toFixed(1) + 's'; sub = '炸弹'; }
    else { main = '就绪'; sub = '炸弹'; }
  } else if (role === 'cowboy') {
    if (cd[p] > 0) { main = cd[p].toFixed(1) + 's'; sub = '齐射'; }
    else { main = '就绪'; sub = '齐射'; }
  } else if (role === 'cannon') {
    if (cd[p] > 0) { main = cd[p].toFixed(1) + 's'; sub = '蓄力'; }
    else { main = '就绪'; sub = '蓄力'; }
  } else if (role === 'ghost') {
    var gp = b.ghostPhase || 'cooldown', gt = b.ghostT || 0;
    if (gp === 'warp') { main = gt.toFixed(1) + 's'; sub = '减伤反击'; }
    else if (gp === 'ready') { main = '受击触发'; sub = '技能就绪'; }
    else { main = gt.toFixed(1) + 's'; sub = '技能冷却'; }
  } else if (role === 'medic') {
    if (b.medicPhase === 'cooldown') { main = b.medicT.toFixed(1) + 's'; sub = '援护冷却'; }
    else if (b.medicPhase === 'ready') { main = '等待队友'; sub = '造成伤害'; }
    else if (b.medicPhase === 'charge') {
      main = b.medicT.toFixed(1) + 's';
      sub = '治疗 ' + formatMathNumber(b.medicDamage * ROLE_MEDIC_HEAL);
    }
  } else if (role === 'mathematician') {
    if (b.mathPhase === 'cooldown') { main = b.mathT.toFixed(1) + 's'; sub = '算式冷却'; }
    else if (b.mathPhase === 'charge') {
      main = mathExpressionText(b.mathExpression);
      sub = '蓄力 ' + b.mathT.toFixed(1) + 's';
    }
  } else if (role === 'dynmath') {
    if (b.dynmathPhase === 'cooldown') { main = b.dynmathT.toFixed(1) + 's'; sub = '算式炸弹冷却'; }
    else if (b.dynmathPhase === 'charge') {
      main = mathExpressionText(b.dynmathExpression);
      sub = '蓄力 ' + b.dynmathT.toFixed(1) + 's';
    }
  } else if (role === 'physicist') {
    if (b.physPhase === 'active') { main = b.physT.toFixed(1) + 's'; sub = physKindName(b.physKind); }
    else { main = Math.max(0, b.physT).toFixed(1) + 's'; sub = '场域冷却'; }
  } else if (role === 'virus') {
    if (cd[p] > 0) { main = cd[p].toFixed(1) + 's'; sub = '放罐冷却'; }
    else { main = '就绪'; sub = '病毒罐'; }
  } else if (role === 'guard') {
    main = b.guardStage === 'first' ? '拉线中' : '待碰墙';
    sub = '警戒线 ×' + guardLines.filter(function (l) { return l.team === teamOf(p); }).length;
  }
  if (main) return { main: main, sub: sub };
  return null;
}

function render() {
  drawBackground();
  drawArena();
  drawTrains();
  drawPhysFields();
  drawVirusJars();
  for (var i = 0; i < balls.length; i++) {
    if (hp[i] > 0) drawBall(balls[i], i);
  }

  drawBullets();
  drawPhysLasers();
  drawGuardLines();

  }

}

/* ============ 病毒罐绘制 ============ */

function drawVirusJars() {
  for (var j = 0; j < virusJars.length; j++) {
    var jar = virusJars[j];
    var pulse = 0.5 + 0.5 * Math.sin(globalTime * 6 + j);
    ctx.save();
    // 底部光晕
    ctx.beginPath();
    ctx.arc(jar.x, jar.y, jar.r + 8, 0, Math.PI * 2);
    var g = ctx.createRadialGradient(jar.x, jar.y, jar.r * 0.4, jar.x, jar.y, jar.r + 8);
    g.addColorStop(0, 'rgba(166,226,46,' + (0.35 + 0.2 * pulse) + ')');
    g.addColorStop(1, 'rgba(166,226,46,0)');
    ctx.fillStyle = g;
    ctx.fill();
    // 罐体
    ctx.beginPath();
    ctx.arc(jar.x, jar.y, jar.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(22,32,14,.92)';
    ctx.fill();
    ctx.strokeStyle = jar.color;
    ctx.lineWidth = 2;
    ctx.stroke();
    // 液面
    ctx.beginPath();
    ctx.arc(jar.x, jar.y + 2, jar.r * 0.62, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(166,226,46,' + (0.55 + 0.3 * pulse) + ')';
    ctx.fill();
    // 生物危害三角
    ctx.beginPath();
    ctx.moveTo(jar.x, jar.y - 7);
    ctx.lineTo(jar.x + 6.5, jar.y + 4);
    ctx.lineTo(jar.x - 6.5, jar.y + 4);
    ctx.closePath();
    ctx.fillStyle = 'rgba(20,26,12,.85)';
    ctx.fill();
    // 剩余可碰次数（只有多段可碰时才显示；一碰即碎时不画数字）
    if (ROLE_VIRUS_JAR_HITS > 1) {
      ctx.font = 'bold 9px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(String(ROLE_VIRUS_JAR_HITS - jar.hits), jar.x, jar.y + 12);
      ctx.textAlign = 'left';
    }
    ctx.restore();
  }
}

/* ============ 保安警戒线绘制 ============ */

function drawGuardLines() {
  // 已完成且永久保留的线
  for (var l = 0; l < guardLines.length; l++) {
    var line = guardLines[l];
    ctx.save();
    ctx.shadowColor = line.color || '#7c8cff';
    ctx.shadowBlur = 8;
    ctx.strokeStyle = line.color || '#7c8cff';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(line.x1, line.y1);
    ctx.lineTo(line.x2, line.y2);
    ctx.stroke();
    ctx.shadowBlur = 0;
    // 双端固定点
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(line.x1, line.y1, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(line.x2, line.y2, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // 正在拉的那根：从墙面端点连到球上
  for (var i = 0; i < balls.length; i++) {
    var b = balls[i];
    if (hp[i] <= 0) continue;
    if (b.guardStage !== 'first' || !b.guardPoint) continue;
    var color = ROLES[selected[i]].color;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.8;
    ctx.lineWidth = 1.8;
    ctx.setLineDash([5, 6]);
    ctx.beginPath();
    ctx.moveTo(b.guardPoint.x, b.guardPoint.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(b.guardPoint.x, b.guardPoint.y, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

/* ============ 物理学家场域绘制 ============ */

function physFade(field) {
  // 最后 0.6 秒淡出，开局 0.25 秒淡入
  var fadeIn = Math.min(1, (ROLE_PHYS_DURATION - field.t) / 0.25);
  var fadeOut = Math.min(1, field.t / 0.6);
  return Math.max(0, Math.min(fadeIn, fadeOut));
}

function drawPhysFields() {
  for (var f = 0; f < physFields.length; f++) {
    var field = physFields[f];
    var fade = physFade(field);
    if (field.kind === 1) drawElectricField(field, fade);
    else if (field.kind === 2) drawGravityField(field, fade);
  }
}

// 技能1：方形电场 + 内部闪电 + 场心电磁铁
function drawElectricField(field, fade) {
  var left = field.x, top = field.y, side = field.side;
  var pulse = 0.5 + 0.5 * Math.sin(globalTime * 5);
  ctx.save();
  ctx.beginPath();
  ctx.rect(left, top, side, side);
  ctx.fillStyle = 'rgba(34,211,238,' + (0.07 + 0.05 * pulse) * fade + ')';
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,240,255,' + 0.8 * fade + ')';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 8]);
  ctx.stroke();
  ctx.setLineDash([]);
  // 内部电流纹路
  ctx.beginPath();
  ctx.strokeStyle = 'rgba(190,250,255,' + 0.45 * fade + ')';
  ctx.lineWidth = 1.2;
  for (var k = 0; k < 3; k++) {
    var yk = top + side * (0.3 + k * 0.2);
    var pts = 7;
    ctx.moveTo(left + 8, yk);
    for (var p = 1; p <= pts; p++) {
      var px = left + 8 + (side - 16) * p / pts;
      var py = yk + Math.sin(globalTime * 7 + p * 1.7 + k * 2.1) * 7;
      ctx.lineTo(px, py);
    }
  }
  ctx.stroke();
  // 电磁铁：红蓝两极的圆形磁体
  var cx = field.cx, cy = field.cy;
  var scale = 1 + 0.06 * Math.sin(globalTime * 9);
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ctx.beginPath();
  ctx.arc(0, 0, 15, Math.PI, Math.PI * 2);
  ctx.closePath();
  ctx.fillStyle = 'rgba(248,113,113,' + 0.92 * fade + ')';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, 0, 15, 0, Math.PI);
  ctx.closePath();
  ctx.fillStyle = 'rgba(96,165,250,' + 0.92 * fade + ')';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, 0, 15, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,' + 0.9 * fade + ')';
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,' + 0.95 * fade + ')';
  ctx.fillText('N', 0, -5);
  ctx.fillText('S', 0, 10);
  ctx.textAlign = 'left';
  ctx.restore();
}

// 技能2：全场箭头指向目标墙
function drawGravityField(field, fade) {
  var cx = ARENA.x + ARENA.size / 2, cy = ARENA.y + ARENA.size / 2;
  var half = ARENA.size / 2;
  ctx.save();
  // 沿方向铺一层渐变，越靠目标墙越亮
  var g = ctx.createLinearGradient(
    cx - field.dx * half, cy - field.dy * half,
    cx + field.dx * half, cy + field.dy * half
  );
  g.addColorStop(0, 'rgba(34,211,238,0)');
  g.addColorStop(1, 'rgba(34,211,238,' + 0.18 * fade + ')');
  ctx.fillStyle = g;
  ctx.fillRect(ARENA.x, ARENA.y, ARENA.size, ARENA.size);
  // 三排箭头
  var flow = (globalTime * 120) % 60;
  for (var i = -1; i <= 1; i++) {
    for (var step = 0; step < 5; step++) {
      var along = -half + ((step * 60 + flow) % (ARENA.size - 20)) + 10;
      var ox = cx + field.dx * along - field.dy * (i * 120);
      var oy = cy + field.dy * along + field.dx * (i * 120);
      var size = 13;
      ctx.beginPath();
      ctx.moveTo(ox - field.dx * size, oy - field.dy * size);
      ctx.lineTo(ox + field.dx * size - field.dy * size * 0.9, oy + field.dy * size + field.dx * size * 0.9);
      ctx.lineTo(ox + field.dx * size + field.dy * size * 0.9, oy + field.dy * size - field.dx * size * 0.9);
      ctx.closePath();
      ctx.fillStyle = 'rgba(165,243,252,' + 0.5 * fade + ')';
      ctx.fill();
    }
  }
  // 目标墙高亮
  var wallX = field.dx > 0 ? ARENA.x + ARENA.size : field.dx < 0 ? ARENA.x : null;
  var wallY = field.dy > 0 ? ARENA.y + ARENA.size : field.dy < 0 ? ARENA.y : null;
  ctx.beginPath();
  if (wallX !== null) { ctx.moveTo(wallX, ARENA.y); ctx.lineTo(wallX, ARENA.y + ARENA.size); }
  else { ctx.moveTo(ARENA.x, wallY); ctx.lineTo(ARENA.x + ARENA.size, wallY); }
  ctx.strokeStyle = 'rgba(34,211,238,' + 0.85 * fade + ')';
  ctx.lineWidth = 5;
  ctx.stroke();
  ctx.restore();
}

// 技能3：镜面 + 激光光路（画在球与子弹之上，看得清）
function drawPhysLasers() {
  for (var f = 0; f < physFields.length; f++) {
    var field = physFields[f];
    if (field.kind !== 3) continue;
    var fade = physFade(field);
    ctx.save();
    // 光线
    ctx.shadowColor = 'rgba(255,70,110,' + 0.9 * fade + ')';
    ctx.shadowBlur = 14;
    ctx.strokeStyle = 'rgba(255,90,120,' + 0.9 * fade + ')';
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    for (var s = 0; s < field.segments.length; s++) {
      var seg = field.segments[s];
      ctx.moveTo(seg.x1, seg.y1);
      ctx.lineTo(seg.x2, seg.y2);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,235,240,' + 0.85 * fade + ')';
    ctx.lineWidth = 1;
    ctx.stroke();
    // 镜面
    ctx.shadowColor = 'rgba(160,240,255,' + 0.85 * fade + ')';
    ctx.shadowBlur = 10;
    ctx.strokeStyle = 'rgba(210,250,255,' + 0.95 * fade + ')';
    ctx.lineWidth = 5;
    for (var m = 0; m < field.mirrors.length; m++) {
      var mi = field.mirrors[m];
      ctx.beginPath();
      ctx.moveTo(mi.x1, mi.y1);
      ctx.lineTo(mi.x2, mi.y2);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    // 四角激光笔
    ctx.fillStyle = 'rgba(255,90,120,' + 0.95 * fade + ')';
    var corners = [
      [ARENA.x, ARENA.y], [ARENA.x + ARENA.size, ARENA.y],
      [ARENA.x + ARENA.size, ARENA.y + ARENA.size], [ARENA.x, ARENA.y + ARENA.size]
    ];
    for (var c = 0; c < corners.length; c++) {
      ctx.beginPath();
      ctx.arc(corners[c][0], corners[c][1], 7, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

// 舰长船锚与钩索
// 船锚锚体：主环+外发光+四根辐条+方向箭头
// 可在舰长常驻轨道与钩中锚体两处共用，color 决定主环颜色
function drawAnchor(color) {
  var R = 13;
  // 外发光
  ctx.beginPath();
  ctx.arc(0, 0, R + 6, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(31,158,168,.35)';
  ctx.lineWidth = 4;
  ctx.stroke();
  // 锚体主环
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.strokeStyle = color || '#1f9ea8';
  ctx.lineWidth = 3.5;
  ctx.stroke();
  // 十字锚臂
  ctx.beginPath();
  ctx.moveTo(-R, 0); ctx.lineTo(R, 0);
  ctx.moveTo(0, -R); ctx.lineTo(0, R);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  // 锚尖小三角（指向旋转方向）
  ctx.beginPath();
  ctx.moveTo(R + 2, -3);
  ctx.lineTo(R + 9, 0);
  ctx.lineTo(R + 2, 3);
  ctx.closePath();
  ctx.fillStyle = '#ffd54a';
  ctx.fill();
}

function drawHooks() {
  // 逐个 owner 处理，保证多锚（BOSS 舰长³）时每个锚都画出来
  for (var hi = 0; hi < hook.length; hi++) {
    var list = hooksOf(hi);
    for (var li = 0; li < list.length; li++) {
      var h = list[li];
      var owner = balls[h.owner];
      if (!owner || hp[h.owner] <= 0) continue;
      if (h.released) {
        // 多锚时冷却文字只由主锚显示，避免叠字
        if (li === 0) {
          ctx.fillStyle = 'rgba(255,255,255,.75)';
          ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('冷却 ' + h.cd.toFixed(1) + 's', owner.x, owner.y - BALL_R - 14);
          ctx.textAlign = 'left';
        }
        continue;
      }
      var anchorX = h.ax != null ? h.ax : owner.x + Math.cos(h.ang) * h.r;
      var anchorY = h.ay != null ? h.ay : owner.y + Math.sin(h.ang) * h.r;
      if (h.hooked && h.target != null && hp[h.target] > 0) {
        ctx.beginPath();
        ctx.moveTo(owner.x, owner.y);
        ctx.lineTo(anchorX, anchorY);
        ctx.strokeStyle = 'rgba(255,255,255,.65)';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.stroke();
        ctx.setLineDash([]);
        if (li === 0) {
          ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillStyle = '#ff5b6e';
          ctx.fillText('被钩住', balls[h.target].x, balls[h.target].y - BALL_R - 14);
          ctx.textAlign = 'left';
        }
      }
      ctx.save();
      ctx.translate(anchorX, anchorY);
      ctx.rotate(h.ang);
      drawAnchor(owner.color);
      ctx.restore();
    }
  }
}

/* ============ 主循环 ============ */
function loop(ts) {
  if (!running) return;
  if (!lastTime) lastTime = ts;
  var dt = Math.min(0.05, (ts - lastTime) / 1000);
  lastTime = ts;
  globalTime += dt;
  update(dt);
  updateHUD();
  render();
  rafId = requestAnimationFrame(loop);
}

/* ============ HUD ============ */
function updateHUD() {
  document.getElementById('topbar').classList.toggle('team-mode', teamMode || bossMode);
  // BOSS 战里分裂体会不断增加，第 3 条血条（ballHpRow3）用来汇总所有分裂体
  var splitterCount = 0, splitterHp = 0, splitterMax = 0;
  if (bossMode) {
    for (var s = 3; s < balls.length; s++) {
      if (hp[s] <= 0) continue;
      splitterCount++;
      splitterHp += hp[s];
      var sr = ROLES[selected[s]];
      splitterMax += sr ? sr.maxHp : 0;
    }
  }
  for (var i = 0; i < 4; i++) {
    var row = document.getElementById('ballHpRow' + i);
    var isActive = i < activeBallCount();
    if (bossMode && i === 3) isActive = splitterCount > 0;   // 有分裂体时才占一行
    row.style.display = isActive ? 'block' : 'none';
    if (!isActive) continue;
    if (bossMode && i === 3) {
      var ratio3 = splitterMax > 0 ? splitterHp / splitterMax : 0;
      document.getElementById('ballHpName3').textContent = '分裂体 ×' + splitterCount;
      var number3 = document.getElementById('ballHpNum3');
      number3.textContent = Math.ceil(splitterHp) + ' / ' + splitterMax;
      number3.style.color = ratio3 <= 0.3 ? '#ff6b6b' : '#c7cee0';
      var fill3 = document.getElementById('ballHp' + 3);
      fill3.style.width = Math.max(0, ratio3 * 100) + '%';
      fill3.style.background = '#7cf5c8';
      continue;
    }
    var role = ROLES[selected[i]];
    var maximum = role.maxHp;
    var current = Math.max(0, hp[i] || 0);
    var ratio = maximum > 0 ? current / maximum : 0;
    document.getElementById('ballHpName' + i).textContent =
      role.name + (teamMode ? ' · ' + (Math.floor(i / 2) + 1) + '号' : '');
    var number = document.getElementById('ballHpNum' + i);
    number.textContent = Math.ceil(current) + ' / ' + maximum;
    number.style.color = ratio <= 0.3 ? '#ff6b6b' : '#c7cee0';
    var fill = document.getElementById('ballHp' + i);
    fill.style.width = Math.max(0, ratio * 100) + '%';
    fill.style.background = role.color;
  }
  for (var team = 0; team < 2; team++) {
    var health = teamHealth(team);
    var ratio = health.maximum > 0 ? health.current / health.maximum : 0;
    document.getElementById('hp' + team).style.width = Math.max(0, ratio * 100) + '%';
    document.getElementById('hpNum' + team).textContent =
      Math.ceil(health.current) + ' / ' + health.maximum;
    document.getElementById('hpNum' + team).style.color =
      ratio <= 0.3 ? '#ff6b6b' : '#c7cee0';
    var skillTexts = [];
    // BOSS 战且队伍里有分裂体时，只显示一条汇总，避免几十个球把文字撑爆
    var isSplitterTeam = false;
    for (var k = 0; k < balls.length; k++) {
      if (teamOf(k) === team && ROLES[selected[k]] && ROLES[selected[k]].role === 'splitter') { isSplitterTeam = true; break; }
    }
    if (isSplitterTeam) {
      var alive = 0, count = 0;
      for (var q = 0; q < balls.length; q++) {
        if (teamOf(q) !== team) continue;
        count++;
        if (hp[q] > 0) alive++;
      }
      skillTexts.push('分裂者 · 存活 ' + alive + ' 体 · 下次分裂 ' +
        Math.max(0, bossSplitT).toFixed(1) + 's');
      document.getElementById('skill' + team).textContent = skillTexts.join(' | ');
      continue;
    }
    for (var i2 = 0; i2 < balls.length; i2++) {
      if (teamOf(i2) !== team) continue;
      var role2 = ROLES[selected[i2]];
      var state = skillStateText(i2, role2);
      skillTexts.push((teamMode ? (Math.floor(i2 / 2) + 1) + '号 ' : '') +
        (hp[i2] <= 0 ? role2.name + ' 已淘汰' :
          role2.skillName + (state ? ' · ' + state : '')));
    }
    document.getElementById('skill' + team).textContent = skillTexts.join(' | ');
  }
}

// HP 进度条下方：各角色技能剩余时间文字
function skillStateText(p, r) {
  var role = r.role;
  if (role === 'hook') {
    if (hook[p] && hook[p].released && hook[p].cd > 0) return '船锚冷却 ' + hook[p].cd.toFixed(1) + 's';
    if (hook[p] && hook[p].hooked) return '钩中 ' + Math.max(0, ROLE_HOOK_SPIN - hook[p].t).toFixed(1) + 's';
    if (hook[p]) return '旋转中';
  } else if (role === 'gun') {
    if (cd[p] > 0) return '冷却 ' + cd[p].toFixed(1) + 's';
  } else if (role === 'gunner') {
    if (cd[p] > 0) return '冷却 ' + cd[p].toFixed(1) + 's';
  } else if (role === 'dispatcher') {
    if (cd[p] > 0) return '列车冷却 ' + cd[p].toFixed(1) + 's';
  } else if (role === 'dynamite') {
    if (cd[p] > 0) return '炸药冷却 ' + cd[p].toFixed(1) + 's';
  } else if (role === 'cowboy') {
    if (balls[p] && balls[p].cowboyIdx != null && balls[p].cowboyIdx < ROLE_COWBOY_SHOTS)
      return '齐射 ' + (balls[p].cowboyIdx + 1) + '/' + ROLE_COWBOY_SHOTS;
    if (cd[p] > 0) return '齐射冷却 ' + cd[p].toFixed(1) + 's';
  } else if (role === 'cannon') {
    if (cd[p] > 0) return '蓄力冷却 ' + cd[p].toFixed(1) + 's';
  } else if (role === 'vampire') {
    return 'HP ' + Math.ceil(hp[p]) + '/' + r.maxHp + ' · 吸血中';
  } else if (role === 'ghost') {
    var gp = balls[p] && balls[p].ghostPhase, gt = balls[p] ? balls[p].ghostT || 0 : 0;
    if (gp === 'warp') return '减伤反击 ' + gt.toFixed(1) + 's';
    if (gp === 'ready') return '受击触发技能';
    if (gp === 'cooldown') return '技能冷却 ' + gt.toFixed(1) + 's';
  } else if (role === 'medic') {
    var medic = balls[p];
    // 复活相关状态优先显示
    if (medic.medicRevivePhase === 'charging') {
      return '复活蓄力 ' + Math.max(0, medic.medicReviveT).toFixed(1) + 's（禁治疗弹）';
    }
    var reviveTag = medic.medicRevivePhase === 'used' ? ' · 复活已用' : ' · 复活就绪';
    if (medic.medicPhase === 'cooldown') return '援护冷却 ' + medic.medicT.toFixed(1) + 's' + reviveTag;
    if (medic.medicPhase === 'ready') return '等待队友造成伤害' + reviveTag;
    if (medic.medicPhase === 'charge')
      return '治疗蓄力 ' + medic.medicT.toFixed(1) + 's · ' +
        formatMathNumber(medic.medicDamage * ROLE_MEDIC_HEAL) + reviveTag;
  } else if (role === 'mathematician') {
    var mathBall = balls[p];
    if (mathBall.mathPhase === 'cooldown') return '算式冷却 ' + mathBall.mathT.toFixed(1) + 's';
    if (mathBall.mathPhase === 'charge')
      return mathExpressionText(mathBall.mathExpression) + ' · ' +
        mathBall.mathT.toFixed(1) + 's';
  } else if (role === 'dynmath') {
    var dynMathState = balls[p];
    if (dynMathState.dynmathPhase === 'cooldown') return '算式炸弹冷却 ' + dynMathState.dynmathT.toFixed(1) + 's';
    if (dynMathState.dynmathPhase === 'charge') {
      var dynMathInfo = mathExpressionText(dynMathState.dynmathExpression) + ' · 蓄力 ' +
        dynMathState.dynmathT.toFixed(1) + 's';
      // V2：伤害固定，算式只决定爆炸半径，蓄力期间就把半径预告出来
      if (r.dynMathRadiusBase != null && dynMathState.dynmathExpression) {
        dynMathInfo += ' · ' + Math.round(dynMathDamageOf(r, 0)) + ' 伤 / 半径 ' +
          Math.round(dynMathRadiusOf(r, dynMathState.dynmathExpression.result)) + 'px';
      }
      return dynMathInfo;
    }
  } else if (role === 'physicist') {
    var physState = balls[p];
    if (physState.physPhase === 'active') {
      return physKindName(physState.physKind) + ' 剩余 ' + physState.physT.toFixed(1) + 's';
    }
    return '场域冷却 ' + Math.max(0, physState.physT).toFixed(1) + 's';
  } else if (role === 'virus') {
    var virusBall = balls[p];
    if (cd[p] > 0) return '放罐冷却 ' + cd[p].toFixed(1) + 's · 场上 ' + virusJars.length + ' 罐';
    return '病毒罐就绪 · 已触 ' + (virusBall.virusHits || 0) + ' 次';
  } else if (role === 'splitter') {
    var spBall = balls[p];
    var regenState = (spBall.splitNoRegenT > 0)
      ? '禁疗 ' + spBall.splitNoRegenT.toFixed(1) + 's'
      : '回血 ' + Math.max(0, spBall.splitRegenT).toFixed(1) + 's';
    var full = hp[p] >= r.maxHp;
    return regenState + ' · 分裂 ' + Math.max(0, bossSplitT).toFixed(1) + 's' + (full ? '(满)' : '');
  } else if (role === 'guard') {
    var guardBall = balls[p];
    var myLines = 0;
    for (var gl = 0; gl < guardLines.length; gl++) {
      if (guardLines[gl].team === teamOf(p)) myLines++;
    }
    return (guardBall.guardStage === 'first' ? '拉线中·待第二端' : '待碰墙拉线') +
      ' · 警戒线 ' + myLines + ' 条';
  }
  return '';
}

function flashHUD(side) {
  var el = document.querySelectorAll('.player')[teamOf(side)];
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}

/* ============ 面板控制 ============ */
var overlay = document.getElementById('overlay');
var ctrlBar = document.getElementById('ctrlBar');
var ctrlBtn = document.getElementById('ctrlBtn');

function hideRolePanels(hide) {
  var el = document.getElementById('rolePanels');
  if (!el) return;
  el.classList.toggle('hide', hide);
}

function syncCtrlBtn() {
  if (running) {
    ctrlBtn.textContent = '终止对局';
    ctrlBtn.className = 'stop';
  } else {
    ctrlBtn.textContent = '开始';
    ctrlBtn.className = 'start';
  }
}

/* ============ 开始 / 终止 / 结束 ============ */
function startMatch() {
  resetMatch();
  overlay.classList.add('hidden');
  hideRolePanels(true);
  ctrlBar.classList.remove('hidden');
  running = true;
  finished = false;
  lastTime = 0;
  syncCtrlBtn();
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

function terminateMatch() {
  running = false;
  finished = false;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  resetMatch();
  syncTopNames();
  updateHUD();
  render();
  hideRolePanels(false);
  syncCtrlBtn();
}

function toggleMatch() {
  if (toggleMatch.busy) return;
  toggleMatch.busy = true;
  if (running) terminateMatch();
  else startMatch();
  setTimeout(function () { toggleMatch.busy = false; }, 120);
}

function endMatch(winningTeam) {
  running = false;
  if (rafId) cancelAnimationFrame(rafId);
  trains = [];
  finished = true;
  syncCtrlBtn();
  var winner = winningTeam === 0 ? '蓝方获胜！' :
    winningTeam === 1 ? '粉方获胜！' : '平局！';
  if (bossMode) winner = winningTeam === 0 ? '蓝方击败 BOSS！' : 'BOSS 获胜！';
  overlay.querySelector('.ov-title').textContent = winner;
  var summaries = [];
  // BOSS 队可能有几十个分裂体，汇总成一条，避免结算文字刷屏
  var bossTeamAlive = 0, bossTeamTotal = 0;
  for (var i = 0; i < balls.length; i++) {
    if (bossMode && teamOf(i) === 1) {
      bossTeamTotal++;
      if (hp[i] > 0) bossTeamAlive++;
      continue;
    }
    var prefix = '';
    if (bossMode) prefix = i === 2 ? '蓝队员2 ' : '蓝队员1 ';
    else if (teamMode) prefix = (teamOf(i) === 0 ? '蓝' : '粉') + '队员' + (Math.floor(i / 2) + 1) + ' ';
    summaries.push(prefix + ROLES[selected[i]].name + ' 剩余 ' + Math.ceil(hp[i]));
  }
  if (bossMode && bossTeamTotal > 0) {
    var bossName = ROLES[selected[1]].name;
    summaries.push('BOSS ' + bossName + ' 存活 ' + bossTeamAlive + '/' + bossTeamTotal + ' 体');
  }
  overlay.querySelector('.ov-sub').textContent = summaries.join(' · ');
  document.getElementById('sideConfirmBtn').textContent = '再来一局';
  hideRolePanels(false);
  overlay.classList.remove('hidden');
  syncCtrlBtn();
  ctrlBar.classList.remove('hidden');
  render();
}

ctrlBtn.addEventListener('click', toggleMatch);

var modeBtn = document.getElementById('modeBtn');
var bossBtn = document.getElementById('bossBtn');

// 统一刷新模式相关的 UI（按钮态、身份面板布局）
function syncModeUI() {
  modeBtn.classList.toggle('active', teamMode);
  modeBtn.setAttribute('aria-pressed', String(teamMode));
  if (bossBtn) {
    bossBtn.classList.toggle('active', bossMode);
    bossBtn.setAttribute('aria-pressed', String(bossMode));
  }
  var panels = document.getElementById('rolePanels');
  panels.classList.toggle('team-mode', teamMode || bossMode);
  panels.classList.toggle('boss-mode', bossMode);
  // 右列标题：普通模式是「粉方」，BOSS 战改成「BOSS」
  var sideLabel = document.getElementById('sideLabel1');
  if (sideLabel) sideLabel.textContent = bossMode ? 'BOSS' : '粉方';
  if (bossMode) syncBossList();
}

// 退出 BOSS 战：恢复粉方原本选的角色
function exitBossMode() {
  if (!bossMode) return;
  bossMode = false;
  if (BOSS_ROLE_INDEX >= 0) selected[1] = savedSelected1;
  syncModeUI();
}

// 三个模式互斥：1v1 / 2v2 / BOSS 战
function setMode(mode) {
  if (running || finished || delayTimer) return;
  if (mode === 'boss') {
    if (bossMode) { exitBossMode(); }
    else {
      if (!teamMode) savedSelected1 = selected[1];
      else savedSelected1 = 0;
      teamMode = false;
      bossMode = true;
      // 用 BOSS 列表里选中的那只，没选过就用第一只
      selected[1] = selectedBoss >= 0 ? selectedBoss : BOSS_ROLE_INDEX;
    }
  } else if (mode === '2v2') {
    if (teamMode) { teamMode = false; }
    else {
      if (bossMode) exitBossMode();
      // 医学检查：1v1 不能带医者
      if (ROLES[selected[0]].role === 'medic' || ROLES[selected[1]].role === 'medic') return;
      teamMode = true;
    }
  }
  syncModeUI();
  resetMatch();
  syncTopNames();
  syncRolePickButtons();
  syncModeButton();
  updateHUD();
  render();
}

modeBtn.addEventListener('click', function () { setMode('2v2'); });
if (bossBtn) bossBtn.addEventListener('click', function () { setMode('boss'); });

/* ============ 延时 5 秒开始 ============ */
var delayBtn = document.getElementById('delayBtn');
var delayTimer = null;
delayBtn.addEventListener('click', function () {
  if (delayTimer || running) return;          // 已在倒计时 / 对局进行中，忽略
  var n = 5;
  delayBtn.textContent = '准备中 ' + n;
  delayBtn.disabled = true;
  modeBtn.disabled = true;
  if (bossBtn) bossBtn.disabled = true;
  delayTimer = setInterval(function () {
    n--;
    if (n <= 0) {
      clearInterval(delayTimer);
      delayTimer = null;
      delayBtn.textContent = '延时 5 秒开始';
      delayBtn.disabled = false;
      if (bossBtn) bossBtn.disabled = false;
      syncModeButton();
      startMatch();                            // 到点开赛
    } else {
      delayBtn.textContent = '准备中 ' + n;
    }
  }, 1000);
});
document.getElementById('sideConfirmBtn').addEventListener('click', function () {
  overlay.classList.add('hidden');
  terminateMatch();
});

/* ============ 启动：先渲染一次，再用 setInterval 持续驱动 ============ */
// 找出第一个 BOSS 专属角色的下标（bossOnly: true），BOSS 战里把它塞进 selected[1]
for (var bi = 0; bi < ROLES.length; bi++) {
  if (ROLES[bi].bossOnly) { BOSS_ROLE_INDEX = bi; break; }
}
selectedBoss = BOSS_ROLE_INDEX;
buildRoleList(0);
buildRoleList(1);
buildRoleList(2);
buildRoleList(3);
buildBossList();
syncModeUI();
syncTopNames();
resetMatch();
syncRolePickButtons();
syncModeButton();
syncCtrlBtn();
ctrlBar.classList.remove('hidden');
render();

setInterval(function () {
  try {
    globalTime += 1 / 60;
    update(1 / 60);
    render();
  } catch (e) {
    /* 静默吞错，避免循环自爆 */
  }
}, 16);
</script>
</body>
</html>
