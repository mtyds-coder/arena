<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>小球竞技场 v1.3.2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #070912;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e8ecf5;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 0 24px;
    overflow-x: hidden;
  }
  h1 {
    font-size: 20px; letter-spacing: 4px; margin-top: 6px;
    color: #4fc3ff; text-shadow: 0 0 18px rgba(79,195,255,.5);
  }

  /* ===== 顶部双方 ===== */
  #topbar {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: min(94vw, 640px); margin-top: 12px;
  }
  .player {
    flex: 1; display: flex; flex-direction: column; gap: 6px;
    padding: 8px 12px; border-radius: 12px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
  }
  .player .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pname { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hpNum { font-size: 12px; font-variant-numeric: tabular-nums; color: #c7cee0; white-space: nowrap; }
  #topbar.team-mode .teamHpTotal { display: none; }
  .teamHpRows { display: none; flex-direction: column; gap: 6px; }
  #topbar.team-mode .teamHpRows { display: flex; }
  .ballHpRow { min-width: 0; }
  .ballHpHead { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 3px; }
  .ballHpName { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 700; }
  .ballHpNum { flex: 0 0 auto; font-size: 11px; font-variant-numeric: tabular-nums; color: #c7cee0; white-space: nowrap; }
  .hpWrap { height: 8px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
  .hp-fill { height: 100%; width: 100%; border-radius: 4px; transition: width .25s linear, background .2s; }
  .vs { font-size: 13px; font-weight: 800; color: #8a93a6; flex: 0 0 auto; }

  /* ===== 战场（身份列表已移到下方，战场不再被覆盖）===== */
  #wrap {
    margin-top: 14px; position: relative;
    width: min(92vw, 600px); aspect-ratio: 1 / 1;
  }
  canvas {
    width: 100%; height: 100%; display: block; border-radius: 16px;
    background: #0b1020;
    box-shadow: 0 0 0 2px rgba(255,255,255,.08), 0 0 40px rgba(79,195,255,.12);
  }

  /* ===== 身份列表：一行横向列表，战场下方 ===== */
  #rolePanels {
    width: min(94vw, 640px);
    margin-top: 14px;
    background: rgba(13,17,32,.72);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px;
    padding: 6px;
    display: flex; flex-direction: column; gap: 2px;
    transition: opacity .2s, transform .2s;
  }
  #rolePanels.hide { opacity: 0; pointer-events: none; }
  #rolePanels.hide.left  { transform: translateY(10px); }
  #rolePanels.hide.right { transform: translateY(10px); }
  .rp-head {
    font-size: 11px; color: #8a93a6; letter-spacing: 1px;
    padding: 5px 8px 2px;
  }
  .rp-body {
    display: flex; gap: 14px; padding: 4px 6px 6px;
  }
  .rp-col { flex: 1 1 50%; display: flex; flex-direction: column; gap: 6px; }
  .rp-side {
    font-size: 12px; letter-spacing: .14em; text-align: center;
    padding: 3px 0; border-radius: 7px;
    background: rgba(255,255,255,.06);
  }
  .rp-side0 { color: #7fd4ff; }
  .rp-side1 { color: #ff9ec7; }
  .role-list {
    display: flex; flex-direction: column; gap: 6px;
  }
  .rp-pick { display: flex; flex-direction: column; gap: 4px; }
  .rp-pick-title { display: none; color: #8a93a6; font-size: 10px; padding-left: 4px; }
  #rolePanels.team-mode .rp-pick-title { display: block; }
  .rp-pick.extra { display: none; }
  #rolePanels.team-mode .rp-pick.extra { display: flex; }
  .role-btn {
    flex: 1 1 auto;
    width: 100%;
    box-sizing: border-box;
    text-align: left; cursor: pointer;
    padding: 8px 12px; border-radius: 10px;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.09);
    color: #c7cee0; font-size: 13px; font-weight: 600;
    transition: transform .1s, background .15s, border-color .15s;
    display: flex; align-items: center; gap: 9px;
  }
  .role-btn:active { transform: scale(.97); }
  .role-btn .rdot {
    flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%;
    background: currentColor; opacity: .55;
    box-shadow: 0 0 8px currentColor;
  }
  .role-btn .rname { white-space: nowrap; }

  .role-btn { display: flex; align-items: center; gap: 8px; }
  .role-btn .rname { font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .role-btn .rdesc {
    font-size: 10px; color: #9aa7b4; line-height: 1.25;
    text-align: left; flex: 1 1 auto;
  }
  .role-btn.selected {
    background: rgba(255,255,255,.11);
    border-color: currentColor;
    box-shadow: inset 3px 0 0 currentColor, 0 0 14px -4px currentColor;
  }
  .role-btn.selected .rdot { opacity: 1; }
  .role-btn[disabled] {
    opacity: .35; cursor: not-allowed;
  }

  /* ===== 底部按钮 ===== */
  #ctrlBar { margin-top: 16px; }
  #ctrlBtn {
    cursor: pointer; min-width: 160px; padding: 12px 36px;
    font-size: 16px; font-weight: 800; letter-spacing: 2px;
    border-radius: 30px; border: none; color: #070912;
    background: linear-gradient(90deg, #4fc3ff, #2dd4bf);
    box-shadow: 0 6px 24px rgba(79,195,255,.35);
    transition: transform .1s, opacity .2s;
  }
  #ctrlBtn:active { transform: scale(.94); }
  #ctrlBtn.start { background: linear-gradient(90deg, #4fc3ff, #2dd4bf); }
  #ctrlBtn.stop  { background: linear-gradient(90deg, #ff6b9d, #ffb84f); }
  #delayBtn {
    margin-left: 12px;
    cursor: pointer; min-width: 160px; padding: 12px 36px;
    font-size: 16px; font-weight: 800; letter-spacing: 2px;
    border-radius: 30px; border: none; color: #070912;
    background: linear-gradient(90deg, #b388ff, #7c4dff);
    box-shadow: 0 6px 24px rgba(179,136,255,.35);
    transition: transform .1s, opacity .2s;
  }
  #delayBtn:active { transform: scale(.94); }
  #delayBtn:disabled { opacity: .5; cursor: not-allowed; }
  #modeBtn {
    margin-left: 12px;
    cursor: pointer; min-width: 92px; padding: 12px 20px;
    font-size: 16px; font-weight: 800; letter-spacing: 1px;
    border-radius: 30px; border: 1px solid rgba(179,136,255,.7);
    color: #e8ecf5; background: rgba(179,136,255,.14);
    transition: transform .1s, background .15s, opacity .2s;
  }
  #modeBtn:active { transform: scale(.94); }
  #modeBtn.active { color: #070912; background: linear-gradient(90deg, #b388ff, #7c4dff); }
  #modeBtn:disabled { opacity: .5; cursor: not-allowed; }
  #bossBtn {
    margin-left: 12px;
    cursor: pointer; min-width: 96px; padding: 12px 20px;
    font-size: 16px; font-weight: 800; letter-spacing: 1px;
    border-radius: 30px; border: 1px solid rgba(255,77,109,.75);
    color: #ffd7de; background: rgba(255,77,109,.14);
    transition: transform .1s, background .15s, opacity .2s;
  }
  #bossBtn:active { transform: scale(.94); }
  #bossBtn.active { color: #fff; background: linear-gradient(90deg, #ff4d6d, #c1121f); border-color: rgba(255,140,160,.9); box-shadow: 0 6px 24px rgba(255,77,109,.4); }
  #bossBtn:disabled { opacity: .5; cursor: not-allowed; }

  /* boss 战：蓝方展开两个队员槽；粉方那一列改成 BOSS 选择列表 */
  .rp-boss { display: none; flex-direction: column; gap: 6px; }
  #rolePanels.boss-mode .rp-pick.extra { display: flex; }
  #rolePanels.boss-mode .rp-pick-title { display: block; }
  #rolePanels.boss-mode .rp-col:last-child .rp-pick { display: none; }
  #rolePanels.boss-mode .rp-col:last-child .rp-boss { display: flex; }
  #rolePanels.boss-mode .rp-side1 { color: #ff8fa3; }

  /* ===== 结算面板 ===== */
  #overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: rgba(3,5,12,.72); backdrop-filter: blur(6px);
  }
  #overlay.hidden { display: none; }
  .ov-card {
    text-align: center; padding: 28px 40px; border-radius: 20px;
    background: rgba(13,17,32,.95); border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .ov-title { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
  .ov-sub { font-size: 14px; color: #8a93a6; margin-bottom: 20px; }
  #sideConfirmBtn {
    cursor: pointer; padding: 11px 34px; font-size: 15px; font-weight: 700;
    border-radius: 26px; border: none; color: #070912;
    background: linear-gradient(90deg, #4fc3ff, #ff5c8a);
  }
  .skill {
    font-size: 11px; color: #8a93a6; margin-top: 2px;
    letter-spacing: .5px; min-height: 15px;
  }
  .player.left .skill { text-align: left; }
  .player.right .skill { text-align: right; }
</style>
</head>
<body>
  <h1>小 球 竞 技 场</h1>

  <div id="topbar">
    <div class="player left">
      <div class="row">
        <span class="pname" id="pname0">蓝方</span>
        <span class="teamHpTotal"><span class="hpNum" id="hpNum0">100 / 100</span></span>
      </div>
      <div class="teamHpTotal hpWrap"><div class="hp-fill" id="hp0" style="background:#4fc3ff"></div></div>
      <div class="teamHpRows" id="teamHpRows0">
        <div class="ballHpRow" id="ballHpRow0"><div class="ballHpHead"><span class="ballHpName" id="ballHpName0"></span><span class="ballHpNum" id="ballHpNum0"></span></div><div class="hpWrap"><div class="hp-fill" id="ballHp0"></div></div></div>
        <div class="ballHpRow" id="ballHpRow2"><div class="ballHpHead"><span class="ballHpName" id="ballHpName2"></span><span class="ballHpNum" id="ballHpNum2"></span></div><div class="hpWrap"><div class="hp-fill" id="ballHp2"></div></div></div>
      </div>
      <div class="skill" id="skill0">散射齐射</div>
    </div>
    <span class="vs">VS</span>
    <div class="player right">
      <div class="row">
        <span class="pname" id="pname1">粉方</span>
        <span class="teamHpTotal"><span class="hpNum" id="hpNum1">100 / 100</span></span>
      </div>
      <div class="teamHpTotal hpWrap"><div class="hp-fill" id="hp1" style="background:#ff6b9d"></div></div>
      <div class="teamHpRows" id="teamHpRows1">
        <div class="ballHpRow" id="ballHpRow1"><div class="ballHpHead"><span class="ballHpName" id="ballHpName1"></span><span class="ballHpNum" id="ballHpNum1"></span></div><div class="hpWrap"><div class="hp-fill" id="ballHp1"></div></div></div>
        <div class="ballHpRow" id="ballHpRow3"><div class="ballHpHead"><span class="ballHpName" id="ballHpName3"></span><span class="ballHpNum" id="ballHpNum3"></span></div><div class="hpWrap"><div class="hp-fill" id="ballHp3"></div></div></div>
      </div>
      <div class="skill" id="skill1">散射齐射</div>
    </div>
  </div>

  <div id="wrap">
    <canvas id="cv" width="600" height="600"></canvas>
  </div>

  <div id="rolePanels">
    <div class="rp-head">选择身份</div>
    <div class="rp-body">
      <div class="rp-col">
        <div class="rp-side rp-side0">蓝方</div>
        <div class="rp-pick">
          <div class="rp-pick-title">队员 1</div>
          <div class="role-list" id="roles0"></div>
        </div>
        <div class="rp-pick extra">
          <div class="rp-pick-title">队员 2</div>
          <div class="role-list" id="roles2"></div>
        </div>
      </div>
      <div class="rp-col">
        <div class="rp-side rp-side1" id="sideLabel1">粉方</div>
        <div class="rp-pick">
          <div class="rp-pick-title">队员 1</div>
          <div class="role-list" id="roles1"></div>
        </div>
        <div class="rp-pick extra">
          <div class="rp-pick-title">队员 2</div>
          <div class="role-list" id="roles3"></div>
        </div>
        <!-- BOSS 战专用：BOSS 选择列表（平时隐藏） -->
        <div class="rp-boss">
          <div class="rp-pick-title">BOSS</div>
          <div class="role-list" id="bossRoles"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="ctrlBar">
    <button id="ctrlBtn" class="start">开始</button>
    <button id="delayBtn" class="start">延时 5 秒开始</button>
    <button id="modeBtn" type="button" aria-pressed="false">2v2</button>
    <button id="bossBtn" type="button" aria-pressed="false">BOSS战</button>
  </div>

  <div id="overlay" class="hidden">
    <div class="ov-card">
      <div class="ov-title">对局结束</div>
      <div class="ov-sub">一方已被击败</div>
      <button id="sideConfirmBtn">再来一局</button>
    </div>
  </div>

<script>
"use strict";
/* ============ 常量 ============ */
var W = 600, H = 600;
var ARENA = { x: 60, y: 60, size: 480, thickness: 4 };
var BALL_R = 16;
var BULLET_R = 5;
var MAX_HP = 100;
var BALL_SPEED = 3.4;
var BULLET_SPEED = 5;
var SKILL_CD = 1.4;
var ROLE_HOOK_SPIN = 5.0;   // 舰长旋转持续秒数
var ROLE_HOOK_COOLDOWN = 15.0; // 钩中结束后船锚冷却
var ROLE_HOOK_ORBIT_RADIUS = 121;  // 船锚待机旋转半径
var ROLE_HOOK_ORBIT_SPEED = 6.2;   // 船锚待机旋转速度（弧度/秒）
var ROLE_HOOK_COLLISION_RADIUS = BALL_R + 18;
var ROLE_HOOK_DMG_MIN = 5;  // 船锚钩中或碰墙伤害下限
var ROLE_HOOK_DMG_MAX = 10;  // 船锚钩中或碰墙伤害上限
var ROLE_HOOK_HITS = 5;     // 钩中期间最多碰墙次数
// 吸血舰长：舰长同款船锚，伤害更低但每次造成伤害都按比例回血
var ROLE_HOOKVAMP_DMG_MIN = 4;   // 钩中/碰墙伤害下限
var ROLE_HOOKVAMP_DMG_MAX = 8;   // 钩中/碰墙伤害上限
var ROLE_HOOKVAMP_LIFESTEAL = 1; // 吸血比例（1 = 造成多少回多少，上限为自身最大血量）
var ROLE_GUN_CD = 10.0;     // 霰弹枪手开火冷却
var ROLE_GUN_COUNT = 10;    // 一次同时射出的子弹数
var ROLE_GUN_DMG_MIN = 8;   // 每发伤害下限
var ROLE_GUN_DMG_MAX = 12;  // 每发伤害上限
var ROLE_GUN_SPREAD = 90 * Math.PI / 180;   // 扇形张角（扇形朝向随机方向）
var ROLE_GUNNER_CD = 5.0;  // 枪手发射冷却
var ROLE_GUNNER_RICO = 9999;  // 枪手子弹反弹次数上限（9999 视为无限反弹，不打到人就不消失）

var ROLE_COWBOY_CD = 10.0;       // 牛仔齐射冷却（秒）
var ROLE_COWBOY_SHOTS = 6;       // 牛仔每次发射的子弹数
var ROLE_COWBOY_PAUSE = 0.3;    // 牛仔齐射逐发间隔（秒）
var ROLE_COWBOY_RICO = 1;        // 牛仔子弹反弹次数上限
var ROLE_COWBOY_DMG_MIN = 5;     // 牛仔单发伤害下限
var ROLE_COWBOY_DMG_MAX = 12;    // 牛仔单发伤害上限
var ROLE_COWBOY_SPREAD = 0.7;    // 牛仔 6 发扇形总张角（弧度）
var ROLE_GUNNER_DMG_MIN = 5;
var ROLE_GUNNER_DMG_MAX = 12;
var ROLE_SHIELD_HP = 150;   // 盾兵血量上限
var ROLE_SHIELD_CD = 1.2;    // 盾兵重撞冷却
var ROLE_SHIELD_BUMP = 10;  // 盾兵贴脸伤害
var ROLE_DISPATCHER_CD = 20.0; // 调度员列车召唤冷却
var ROLE_TRAIN_SPEED = 4.5;   // 每帧移动像素
var ROLE_TRAIN_LENGTH = ARENA.size;
var ROLE_TRAIN_V2_LENGTH = ARENA.size - 48;
var ROLE_TRAIN_WIDTH = 32;
var ROLE_DYN_CD = 10.0;     // 爆破手投掷冷却（秒）
var ROLE_DYN_FUSE = 1.6;    // 炸药引信（秒）
var ROLE_DYN_DMG = 35;      // 炸药爆炸伤害
var ROLE_DYN_RADIUS = 120;  // 爆炸半径（像素）
var ROLE_DYN_SPEED = 5.2;   // 炸药飞行速度
var ROLE_VAMPIRE_DMG_MIN = 6;  // 吸血鬼单次贴身最低伤害
var ROLE_VAMPIRE_DMG_MAX = 16; // 吸血鬼单次贴身最高伤害
var ROLE_VAMPIRE_LOCK = 1.5;   // 吸血鬼吸血冷却（秒），乱弹后避免贴着连续暴击
var ROLE_GHOST_CD = 10.0;      // 幽灵技能冷却（秒）
var ROLE_GHOST_WARP = 5.0;     // 受击触发后的免伤持续时长（秒）
var ROLE_GHOST_RETURN = 1.5;   // 累计伤害返还比例
var ROLE_GHOST_RICO = 3;       // 返还子弹撞墙反弹次数
var ROLE_MEDIC_CD = 10.0;
var ROLE_MEDIC_CHARGE = 5.0;
var ROLE_MEDIC_HEAL = 1.5;
var ROLE_MEDIC_RICO = 3;
// 医者复活：队友阵亡后蓄力 30 秒，结束时半血复活（每局只能用一次）
var ROLE_MEDIC_REVIVE_CHARGE = 30.0;   // 复活蓄力时长（秒）
var ROLE_MEDIC_REVIVE_RATIO = 0.5;     // 复活后恢复的血量比例（最大血量的一半）
var ROLE_MATH_CD = 15.0;
var ROLE_MATH_CHARGE = 5.0;
var ROLE_MATH_RICO = 3;
var ROLE_MATH_POWER_CHANCE = 0.03;
var ROLE_MATH_POWER_LIMIT = 1000;
// 爆破数学家：数学家同款算式蓄力 + 爆破手同款炸药
var ROLE_DYNMATH_CD = 15.0;                        // 技能冷却（秒）
var ROLE_DYNMATH_CHARGE = 5.0;                     // 算式蓄力（秒）
var ROLE_DYNMATH_RADIUS = ROLE_DYN_RADIUS;         // 爆炸半径，与爆破手一致（120px）
var ROLE_DYNMATH_FUSE = ROLE_DYN_FUSE;             // 炸药引信，与爆破手一致（1.6 秒）
var ROLE_DYNMATH_SPEED = ROLE_DYN_SPEED;           // 炸药飞行速度，与爆破手一致
// 爆破数学家V2：伤害固定，爆炸半径由算式结果决定
var ROLE_DYNMATH2_DMG = 40;              // 固定伤害
var ROLE_DYNMATH2_RADIUS_BASE = 96;      // 半径基数（px）
var ROLE_DYNMATH2_RADIUS_SCALE = 0.2;    // 每 1 点算式结果增加的半径
var ROLE_DYNMATH2_RADIUS_MIN = 40;       // 半径下限（px）
var ROLE_DYNMATH2_RADIUS_MAX = 480;      // 半径上限（px，等于擂台边长）
// 物理学家：20 秒冷却随机触发三种场域之一，各持续 5 秒
var ROLE_PHYS_CD = 20.0;           // 技能冷却（秒）
var ROLE_PHYS_DURATION = 5.0;      // 每个场域持续时间（秒）
var ROLE_PHYS_FIELD_SIDE = 215;    // 技能1 电场方形边长（面积 ≈ 擂台 1/5）
var ROLE_PHYS_FIELD_DPS = 8;       // 技能1 电场每秒伤害
var ROLE_PHYS_FIELD_TICK = 0.5;    // 技能1 伤害结算间隔（秒）
var ROLE_PHYS_MAGNET_ACCEL = 0.45; // 技能1 电磁铁对子弹的吸引加速度（每帧）
var ROLE_PHYS_MAGNET_MAX_SPEED = 7; // 技能1 被吸子弹的速度上限
var ROLE_PHYS_GRAVITY_UNIT = 7;    // 技能2 每 7px 距离造成 1 伤害
var ROLE_PHYS_GRAVITY_PUSH = 4.6;  // 技能2 推向墙壁的速度
var ROLE_PHYS_LASER_DMG = 5;       // 技能3 每次穿过光线的伤害

/* ============ 工具 ============ */
function rand(a, b) { return a + Math.random() * (b - a); }
function shade(hex, amt) {
  var c = hex.replace('#', '');
  var r = parseInt(c.substr(0, 2), 16);
  var g = parseInt(c.substr(2, 2), 16);
  var b = parseInt(c.substr(4, 2), 16);
  r = Math.max(0, Math.min(255, r + r * amt));
  g = Math.max(0, Math.min(255, g + g * amt));
  b = Math.max(0, Math.min(255, b + b * amt));
  return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
}
function glowOf(hex) {
  var c = hex.replace('#', '');
  var r = parseInt(c.substr(0, 2), 16);
  var g = parseInt(c.substr(2, 2), 16);
  var bb = parseInt(c.substr(4, 2), 16);
  return 'rgba(' + r + ',' + g + ',' + bb + ',.5)';
}
function clampSpeed(b) {
  var sp = Math.hypot(b.vx, b.vy);
  if (sp > 0) {
    b.vx = b.vx / sp * BALL_SPEED;
    b.vy = b.vy / sp * BALL_SPEED;
  }
}
function activeBallCount() { return bossMode ? 3 : (teamMode ? 4 : 2); }
// BOSS 队的实际球数（分裂者会不断追加分裂体，所以以 balls.length 为准）
function ballCount() { return balls.length; }
function teamOf(index) {
  // BOSS 战：0/2 号是蓝队；1 号是 BOSS 本体，3 号往后都是分裂体，同属 BOSS 队
  if (bossMode) return (index === 0 || index === 2) ? 0 : 1;
  return teamMode ? index % 2 : index;
}
function teammateOf(index) {
  if (bossMode) {
    if (index === 0) return 2;
    if (index === 2) return 0;
    return -1;                       // BOSS 队不算“队友”（治疗弹不给分裂体）
  }
  return teamMode ? index + (index < 2 ? 2 : -2) : -1;
}
function findEnemy(owner) {
  var target = -1, closest = Infinity;
  for (var i = 0; i < balls.length; i++) {
    if (teamOf(i) === teamOf(owner) || hp[i] <= 0) continue;
    var distance = Math.hypot(balls[i].x - balls[owner].x, balls[i].y - balls[owner].y);
    if (distance < closest) { closest = distance; target = i; }
  }
  return target;
}
function isHookedBall(index) {
  var found = false;
  eachHook(function (h) {
    if (found) return;
    if (!h.released && h.hooked && h.target === index) found = true;
  });
  return found;
}
function teamHealth(team) {
  var current = 0, maximum = 0;
  for (var i = 0; i < balls.length; i++) {
    if (teamOf(i) !== team) continue;
    current += hp[i] || 0;
    maximum += ROLES[selected[i]].maxHp;
  }
  return { current: current, maximum: maximum };
}
function teamDefeated(team) {
  for (var i = 0; i < balls.length; i++) {
    if (teamOf(i) === team && hp[i] > 0) return false;
  }
  return true;
}
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function spawnTarget(side) {
  var cx = ARENA.x + ARENA.size / 2;
  var cy = ARENA.y + ARENA.size / 2;
  var team = teamOf(side);
  var teammateOffset = 0;
  if (bossMode) {
    teammateOffset = side === 2 ? -ARENA.size * 0.14 : 0;   // 蓝队 2 号站上一点
  } else if (teamMode) {
    teammateOffset = (Math.floor(side / 2) === 0 ? -1 : 1) * ARENA.size * 0.14;
  }
  var spread = (teamMode || bossMode) ? 0.04 : 0.16;
  return {
    x: cx + (team === 0 ? -1 : 1) * ARENA.size * 0.24,
    y: cy + teammateOffset + (Math.random() * 2 - 1) * ARENA.size * spread
  };
}
function mkBall(side) {
  var r = ROLES[selected[side]];
  var ball = { x: 0, y: 0, vx: 0, vy: 0, color: r.color, glow: glowOf(r.color),
    gradient: r.gradient || null };
  if (r.role === 'hook') ball.hookAngle = Math.random() * Math.PI * 2;
  if (r.role === 'ghost') {
    ball.ghostPhase = 'cooldown';
    ball.ghostT = ROLE_GHOST_CD;
  } else if (r.role === 'medic') {
    ball.medicPhase = 'cooldown';
    ball.medicT = ROLE_MEDIC_CD;
    ball.medicDamage = 0;
    ball.medicRevivePhase = 'ready';    // 复活技能：ready → charging → used（每局一次）
    ball.medicReviveT = 0;
    ball.medicReviveTarget = -1;
  } else if (r.role === 'mathematician') {
    ball.mathPhase = 'cooldown';
    ball.mathT = ROLE_MATH_CD;
    ball.mathExpression = null;
  } else if (r.role === 'dynmath') {
    ball.dynmathPhase = 'cooldown';
    ball.dynmathT = ROLE_DYNMATH_CD;
    ball.dynmathExpression = null;
  } else if (r.role === 'physicist') {
    ball.physPhase = 'cooldown';
    ball.physT = ROLE_PHYS_CD;
    ball.physKind = 0;
  } else if (r.role === 'virus') {
    ball.virusHits = 0;
  } else if (r.role === 'guard') {
    ball.guardStage = 'idle';
    ball.guardPoint = null;
    ball.guardWallLock = 0;
  } else if (r.role === 'splitter') {
    ball.splitRegenT = r.regenInterval;
    ball.splitNoRegenT = 0;
  }
  return ball;
}

/* ============ 身份列表 ============ */
function buildRoleList(slot) {
  var box = document.getElementById('roles' + slot);
  box.innerHTML = '';
  for (var idx = 0; idx < ROLES.length; idx++) {
    if (ROLES[idx].bossOnly) continue;          // BOSS 角色不出现在选择列表里
    (function (idx) {
      var r = ROLES[idx];
      var btn = document.createElement('button');
      btn.className = 'role-btn' + (selected[slot] === idx ? ' selected' : '');
      btn.setAttribute('data-idx', String(idx));
      btn.style.color = r.color;
      btn.innerHTML = '<span class="rdot"></span>'
                    + '<span class="rname">' + r.name + '</span>'
                    + '<span class="rdesc">' + r.desc + '</span>';
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (running || finished || (r.role === 'medic' && !teamMode && !bossMode)) return;
        selected[slot] = idx;
        if (balls[slot]) hp[slot] = ROLES[idx].maxHp;
        syncRolePickButtons();
        syncModeButton();
        syncTopNames();
        resetMatch();
        updateHUD();
        render();
      });
      box.appendChild(btn);
    })(idx);
  }
}
function syncRolePickButtons() {
  for (var slot = 0; slot < 4; slot++) {
    var btns = document.getElementById('roles' + slot).querySelectorAll('.role-btn');
    for (var i = 0; i < btns.length; i++) {
      var roleIdx = parseInt(btns[i].getAttribute('data-idx'), 10);
      if (isNaN(roleIdx)) roleIdx = i;
      btns[i].classList.toggle('selected', roleIdx === selected[slot]);
      btns[i].disabled = !teamMode && !bossMode && ROLES[roleIdx].role === 'medic';
    }
  }
  syncBossList();
}

/* ============ BOSS 列表（目前只有一个，仍然做成可选清单，方便以后扩充） ============ */
function bossRoleIndexes() {

function syncBossList() {

function syncModeButton() {

function syncTopNames() {

    var teamColor = team === 0 ? '#4fc3ff' : '#ff6b9d';

      balls[i].medicRevivePhase = 'ready';

      balls[i].dynmathT = ROLE_DYNMATH_CD;
      balls[i].dynmathExpression = null;

      balls[i].physPhase = 'cooldown';
      balls[i].physT = ROLE_PHYS_CD;
      balls[i].physKind = 0;
    } else if (ROLES[selected[i]].role === 'virus') {
      balls[i].virusHits = 0;

}

/* ============ 对局控制 ============ */
function resetMatch() {
  var count = activeBallCount();
  // 分裂者会往 selected 里追加分裂体的角色下标，开新局时收回 4 个槽位
  if (selected.length > 4) selected.length = 4;
  balls = [];
  hp = [];
  cd = [];
  hook = [];
  bumpLock = [];
  previewPositions = [];
  bossSplitT = bossSplitInterval();
  var cy = ARENA.y + ARENA.size / 2;
  for (var i = 0; i < count; i++) {
    var ball = mkBall(i);
    var team = teamOf(i);
    var startY = cy;
    if (bossMode) startY += i === 2 ? -ARENA.size * 0.14 : 0;
    else if (teamMode) startY += (Math.floor(i / 2) === 0 ? -1 : 1) * ARENA.size * 0.14;
    ball.spawnFrom = { x: team === 0 ? ARENA.x - BALL_R - 8 : ARENA.x + ARENA.size + BALL_R + 8, y: startY };
    var target = spawnTarget(i);
    ball.x = target.x; ball.y = target.y;
    balls.push(ball);
    hp.push(ROLES[selected[i]].maxHp);
    cd.push(ROLES[selected[i]].role === 'dispatcher' ? ROLE_DISPATCHER_CD : 0);
    hook.push(null);
    bumpLock.push(0);
    previewPositions.push(target);
  }
  for (var hookOwner = 0; hookOwner < count; hookOwner++) {
    if (ROLES[selected[hookOwner]].role === 'hook') fireHook(hookOwner);
  }
  spawnT = 0;
  dynamites = [];
  trains = [];
  physFields = [];
  virusJars = [];
  virusDots = [];
  guardLines = [];
  ballPrevPos = [];
  bullets = [];
  particles = [];
  floatTexts = [];
  finished = false;
  updateHUD();
}

/* ============ 技能 ============ */
// 通用伤害入口：被钩住期间无法受到角色技能以外的额外处理
function dealDamage(target, amount, srcColor, srcX, srcY, sourceIndex) {
  if (amount <= 0 || !balls[target] || hp[target] <= 0) return false;
  if (balls[target] && ROLES[selected[target]].role === 'ghost') {
    var ghost = balls[target];
    if (ghost.ghostPhase === 'warp') {
      amount *= 0.5;
      ghost.ghostDmg = (ghost.ghostDmg || 0) + amount;
    } else if (ghost.ghostPhase === 'ready') {
      ghost.ghostPhase = 'warp';
      ghost.ghostT = ROLE_GHOST_WARP;
      amount *= 0.5;
      ghost.ghostDmg = amount;
    }
  }
  var previousHp = hp[target];
  hp[target] = Math.max(0, hp[target] - amount);
  recordMedicDamage(sourceIndex, target, previousHp - hp[target]);
  spawnParticles(srcX, srcY, srcColor, 14);
  floatTexts.push({ x: balls[target].x, y: balls[target].y - 22, text: '-' + amount, life: 1, color: srcColor });
  flashHUD(target);
  updateHUD();
  if (teamDefeated(teamOf(target)) && !finished) endMatch(1 - teamOf(target));
  return true;
}

function recordMedicDamage(sourceIndex, targetIndex, damage) {
  if (!teamMode || sourceIndex == null || damage <= 0 ||
      teamOf(sourceIndex) === teamOf(targetIndex)) return;
  for (var i = 0; i < activeBallCount(); i++) {
    if (ROLES[selected[i]].role !== 'medic' ||
        teammateOf(i) !== sourceIndex || hp[i] <= 0) continue;
    var medic = balls[i];
    if (medic.medicPhase === 'ready') {
      medic.medicPhase = 'charge';
      medic.medicT = ROLE_MEDIC_CHARGE;
      medic.medicDamage = 0;
      floatTexts.push({ x: medic.x, y: medic.y - 28, text: '援护蓄力！', life: 1, color: medic.color });
    }
    if (medic.medicPhase === 'charge') medic.medicDamage += damage;
  }
}

function fireMedicBullet(owner) {
  var medic = balls[owner];
  var teammate = teammateOf(owner);
  var target = balls[teammate];
  var heal = medic.medicDamage * ROLE_MEDIC_HEAL;
  if (target && heal > 0) {
    var angle = Math.atan2(target.y - medic.y, target.x - medic.x);
    bullets.push({
      x: medic.x + Math.cos(angle) * (BALL_R + 4),
      y: medic.y + Math.sin(angle) * (BALL_R + 4),
      vx: Math.cos(angle) * BULLET_SPEED,
      vy: Math.sin(angle) * BULLET_SPEED,
      owner: owner,
      healTarget: teammate,
      kind: 'heal',
      color: '#67e8a5',
      heal: heal,
      rico: 0,
      ricoMax: ROLE_MEDIC_RICO
    });
  }
  medic.medicPhase = 'cooldown';
  medic.medicT = ROLE_MEDIC_CD;
  medic.medicDamage = 0;
}

// 医者复活：把阵亡的队友原位以半血复活
function reviveTeammate(medicIndex) {
  var medic = balls[medicIndex];
  if (!medic) return;
  var target = medic.medicReviveTarget != null && medic.medicReviveTarget >= 0
    ? medic.medicReviveTarget : teammateOf(medicIndex);
  if (target < 0 || !balls[target]) {
    medic.medicRevivePhase = 'used';
    return;
  }
  var mateRole = ROLES[selected[target]];
  var revived = mateRole ? mateRole.maxHp * ROLE_MEDIC_REVIVE_RATIO : MAX_HP * ROLE_MEDIC_REVIVE_RATIO;
  hp[target] = revived;
  // 原位复活：位置保持死亡点，速度重新随机，避免又贴着刚打死它的东西
  var ball = balls[target];
  var ang = Math.random() * Math.PI * 2;
  ball.vx = Math.cos(ang) * BALL_SPEED;
  ball.vy = Math.sin(ang) * BALL_SPEED;
  ball.x = Math.max(ARENA.x + BALL_R, Math.min(ARENA.x + ARENA.size - BALL_R, ball.x));
  ball.y = Math.max(ARENA.y + BALL_R, Math.min(ARENA.y + ARENA.size - BALL_R, ball.y));
  // 复活瞬间清掉针对它的延迟伤害/伤害锁，避免刚复活就被残留效果打死
  if (bumpLock[target] != null) bumpLock[target] = 0;
  medic.medicRevivePhase = 'used';
  medic.medicReviveTarget = -1;
  medic.medicReviveT = 0;
  spawnParticles(ball.x, ball.y, '#67e8a5', 22);
  floatTexts.push({
    x: ball.x, y: ball.y - BALL_R - 12,
    text: '复活！' + Math.round(revived) + ' 血',
    life: 1.6, color: '#67e8a5'
  });
  updateHUD();
}

function chooseMathOperator() {
  if (Math.random() < ROLE_MATH_POWER_CHANCE) return '**';
  return ['+', '-', '*', '/'][Math.floor(Math.random() * 4)];
}

function createMathExpression() {
  for (var attempt = 0; attempt < 100; attempt++) {
    var x1 = 1 + Math.floor(Math.random() * 10);
    var x2 = 1 + Math.floor(Math.random() * 10);
    var x3 = 1 + Math.floor(Math.random() * 10);
    var n1 = chooseMathOperator();
    var n2 = chooseMathOperator();
    var first;
    if (n1 === '+') first = x1 + x2;
    else if (n1 === '-') first = x1 - x2;
    else if (n1 === '*') first = x1 * x2;
    else if (n1 === '/') first = x1 / x2;
    else first = Math.max(-ROLE_MATH_POWER_LIMIT,
      Math.min(ROLE_MATH_POWER_LIMIT, Math.pow(x1, x2)));
    if (n2 === '/' && first === 0) continue;
    var result;
    if (n2 === '+') result = first + x3;
    else if (n2 === '-') result = first - x3;
    else if (n2 === '*') result = first * x3;
    else if (n2 === '/') result = first / x3;
    else result = Math.max(-ROLE_MATH_POWER_LIMIT,
      Math.min(ROLE_MATH_POWER_LIMIT, Math.pow(first, x3)));
    if (!Number.isFinite(result)) continue;
    return { x1: x1, x2: x2, x3: x3, n1: n1, n2: n2, result: result };
  }
  throw new Error('无法生成有效的数学家算式');
}

function formatMathNumber(value) {
  return Number.isInteger(value) ? String(value) : String(Number(value.toFixed(2)));
}

function mathExpressionText(expression) {
  if (!expression) return '';
  return '(' + expression.x1 + ' ' + expression.n1 + ' ' + expression.x2 + ') ' +
    expression.n2 + ' ' + expression.x3 + ' = ' + formatMathNumber(expression.result);
}

function fireMathBullet(owner) {
  var mathematician = balls[owner];
  var targetIndex = findEnemy(owner);
  if (targetIndex >= 0) {
    var target = balls[targetIndex];
    var angle = Math.atan2(target.y - mathematician.y, target.x - mathematician.x);
    bullets.push({
      x: mathematician.x + Math.cos(angle) * (BALL_R + 4),
      y: mathematician.y + Math.sin(angle) * (BALL_R + 4),
      vx: Math.cos(angle) * BULLET_SPEED,
      vy: Math.sin(angle) * BULLET_SPEED,
      owner: owner,
      color: mathematician.color,
      dmg: mathematician.mathExpression.result,
      rico: 0,
      ricoMax: ROLE_MATH_RICO
    });
  }
  floatTexts.push({
    x: mathematician.x, y: mathematician.y - 30,
    text: '算式结果 ' + formatMathNumber(mathematician.mathExpression.result),
    life: 1.2, color: mathematician.color
  });
  mathematician.mathPhase = 'cooldown';
  mathematician.mathT = ROLE_MATH_CD;
  mathematician.mathExpression = null;
}

// 爆破数学家系：蓄力结束后朝敌方掷出一枚“算式炸药”
// 角色表参数决定这一发的表现：
//   普通爆破数学家       → 伤害 = 算式结果，半径固定 120px，结果 ≤ 0 时不造成伤害
//   爆破数学家V2         → 伤害固定 40，半径 = 96 + 结果 × 0.2（限制 40~480px），结果只影响范围
// 引信/飞行速度两者都沿用爆破手。
function dynMathRadiusOf(role, result) {
  if (role && role.dynMathRadiusBase != null) {
    var raw = role.dynMathRadiusBase + result * role.dynMathRadiusScale;
    var minR = role.dynMathRadiusMin != null ? role.dynMathRadiusMin : 0;
    var maxR = role.dynMathRadiusMax != null ? role.dynMathRadiusMax : Infinity;
    return Math.max(minR, Math.min(maxR, raw));
  }
  return role && role.dynMathRadius != null ? role.dynMathRadius : ROLE_DYNMATH_RADIUS;
}

function dynMathDamageOf(role, result) {
  if (role && role.dynMathDamage != null) return role.dynMathDamage;
  return result;
}

function fireDynMathBomb(owner) {
  var role = ROLES[selected[owner]];
  var thrower = balls[owner];
  var expression = thrower.dynmathExpression;
  var result = expression ? expression.result : 0;
  var dmg = dynMathDamageOf(role, result);
  var radius = dynMathRadiusOf(role, result);
  var enemyIndex = findEnemy(owner);
  if (enemyIndex >= 0) {
    var enemy = balls[enemyIndex];
    var ang = Math.atan2(enemy.y - thrower.y, enemy.x - thrower.x) + rand(-0.35, 0.35);
    dynamites.push({
      owner: owner,
      x: thrower.x + Math.cos(ang) * (BALL_R + 6),
      y: thrower.y + Math.sin(ang) * (BALL_R + 6),
      vx: Math.cos(ang) * ROLE_DYNMATH_SPEED,
      vy: Math.sin(ang) * ROLE_DYNMATH_SPEED,
      fuse: ROLE_DYNMATH_FUSE,
      fuseMax: ROLE_DYNMATH_FUSE,
      r: 9,
      dmg: dmg > 0 ? dmg : 0,
      radius: radius,
      radiusFromFormula: role && role.dynMathRadiusBase != null,
      color: thrower.color,
      math: true
    });
  }
  floatTexts.push({
    x: thrower.x, y: thrower.y - 30,
    text: role && role.dynMathDamage != null
      ? formatMathNumber(dmg) + ' 伤 · 半径 ' + Math.round(radius) + 'px'
      : '算式炸弹 ' + formatMathNumber(dmg),
    life: 1.2, color: thrower.color
  });
  thrower.dynmathPhase = 'cooldown';
  thrower.dynmathT = ROLE_DYNMATH_CD;
  thrower.dynmathExpression = null;
}

// 霰弹枪手：冷却结束时同时射出 10 颗子弹
// 扇形整体朝向最近的敌方（90° 张角），每颗子弹在这个 90° 内「随机」偏转（不是均匀等距）
function fireGun(owner) {
  if (cd[owner] > 0) return;
  cd[owner] = ROLE_GUN_CD;
  var b = balls[owner];
  // 扇形中心：朝最近敌方；没有敌人时退回自身移动方向
  var targetIndex = findEnemy(owner);
  var centerAng;
  if (targetIndex >= 0) {
    var enemy = balls[targetIndex];
    centerAng = Math.atan2(enemy.y - b.y, enemy.x - b.x);
  } else {
    centerAng = Math.atan2(b.vy, b.vx);
    if (b.vx === 0 && b.vy === 0) centerAng = teamOf(owner) === 0 ? 0 : Math.PI;
  }
  var half = ROLE_GUN_SPREAD / 2;
  for (var i = 0; i < ROLE_GUN_COUNT; i++) {
    var ang = centerAng + (Math.random() * 2 - 1) * half;   // 90° 内随机撒
    var dmg = ROLE_GUN_DMG_MIN +
      Math.floor(Math.random() * (ROLE_GUN_DMG_MAX - ROLE_GUN_DMG_MIN + 1));
    bullets.push({
      x: b.x + Math.cos(ang) * (BALL_R + 4),
      y: b.y + Math.sin(ang) * (BALL_R + 4),
      vx: Math.cos(ang) * BULLET_SPEED,
      vy: Math.sin(ang) * BULLET_SPEED,
      owner: owner,
      color: b.color,
      dmg: dmg,
      life: 2.6
    });
  }
}

// 舰长：船锚常驻绕舰长 121px 旋转，碰到敌人即钩中
// hookCount > 1 时（BOSS 舰长³）同时生成多个船锚，按 360°/count 均分夹角
function makeHook(owner, angle) {
  return {
    owner: owner,
    target: null,
    ang: angle,
    omega: (teamOf(owner) === 0 ? 1 : -1) * ROLE_HOOK_ORBIT_SPEED,
    r: ROLE_HOOK_ORBIT_RADIUS,
    released: false,
    cd: 0,
    hooked: false,
    hits: 0,
    t: 0,
    hitTimer: 0,
    ax: null,
    ay: null
  };
}

function fireHook(owner) {
  var b = balls[owner];
  if (!b) return;
  if (hook[owner] && !hook[owner].released) return;
  if (hook[owner] && hook[owner].cd > 0) return;
  var ownerRole = ROLES[selected[owner]];
  var count = Math.max(1, (ownerRole && ownerRole.hookCount) || 1);
  var base = b.hookAngle != null ? b.hookAngle : Math.random() * Math.PI * 2;
  var primary = makeHook(owner, base);
  primary.extras = [];
  for (var k = 1; k < count; k++) {
    primary.extras.push(makeHook(owner, base + k * Math.PI * 2 / count));
  }
  hook[owner] = primary;
  b.hookAngle = base;
  floatTexts.push({
    x: b.x, y: b.y - 30,
    text: count > 1 ? ('船锚就绪 ×' + count) : '船锚就绪',
    life: 0.9, color: b.color
  });
}

// 把某个 owner 的所有船锚（主 + 额外）摊平成一个数组
function hooksOf(owner) {
  var list = [];
  var h = hook[owner];
  if (!h) return list;
  list.push(h);
  if (h.extras) {
    for (var i = 0; i < h.extras.length; i++) list.push(h.extras[i]);
  }
  return list;
}

// 遍历场上所有船锚
function eachHook(fn) {
  for (var o = 0; o < hook.length; o++) {
    var list = hooksOf(o);
    for (var i = 0; i < list.length; i++) fn(list[i], o);
  }
}

// 舰长系伤害区间：角色表可覆盖（吸血舰长 4~8，普通舰长 5~10）
function rollHookDamage(role) {
  var min = role && role.hookDmgMin != null ? role.hookDmgMin : ROLE_HOOK_DMG_MIN;
  var max = role && role.hookDmgMax != null ? role.hookDmgMax : ROLE_HOOK_DMG_MAX;
  if (max < min) max = min;
  return min + Math.floor(Math.random() * (max - min + 1));
}

// 吸血：按“实际造成的伤害”回复自身生命，不超过自身血量上限
// dealt 由调用方用「扣血前后差值」算出来，这样幽灵减伤等减免也会正确反映
function applyHookLifesteal(owner, dealt) {
  var role = ROLES[selected[owner]];
  if (!role || !role.hookLifesteal || !(dealt > 0)) return;
  var ownerBall = balls[owner];
  if (!ownerBall || hp[owner] <= 0) return;
  var before = hp[owner];
  var heal = dealt * role.hookLifesteal;
  hp[owner] = Math.min(role.maxHp, hp[owner] + heal);
  var restored = hp[owner] - before;
  if (restored <= 0.001) return;
  floatTexts.push({
    x: ownerBall.x, y: ownerBall.y - 24,
    text: '+' + formatMathNumber(Number(restored.toFixed(2))),
    life: 1, color: role.color
  });
  spawnParticles(ownerBall.x, ownerBall.y, role.color, 10);
  updateHUD();
}

// 盾兵：本体贴脸一次 10 伤
function fireShield(owner) {
  if (cd[owner] > 0) return;
  cd[owner] = ROLE_SHIELD_CD;
  var target = findEnemy(owner);
  if (target < 0) return;
  var b = balls[owner], tb = balls[target];
  var dist = Math.hypot(tb.x - b.x, tb.y - b.y);
  if (dist > 0 && dist < BALL_R * 2 + 8) {
    var nx = (tb.x - b.x) / dist;
    var ny = (tb.y - b.y) / dist;
    dealDamage(target, ROLE_SHIELD_BUMP, b.color, b.x, b.y, owner);
    tb.vx += nx * 1.8;
    tb.vy += ny * 1.8;
    b.vx *= 0.92;
    b.vy *= 0.92;
    clampSpeed(tb);
    clampSpeed(b);
  }
}

// 统一技能触发入口（由 AI 按身份调用）
function trySkill(owner) {
  var role = ROLES[selected[owner]].role;
  if (hook[owner] && !hook[owner].released) return; // 旋转期间本人不主动开别的
  if (role === 'gun') fireGun(owner);
  else if (role === 'hook') fireHook(owner);
  else if (role === 'shield') fireShield(owner);
  else if (role === 'dynamite') fireDynamite(owner);
}


/* ============ 爆破手：炸药 ============ */
// 爆破手：向随机方向掷出一枚炸药
function fireDynamite(owner) {
  var b = balls[owner];
  var enemyIndex = findEnemy(owner);
  if (enemyIndex < 0) return;
  var enemy = balls[enemyIndex];
  var ang = Math.atan2(enemy.y - b.y, enemy.x - b.x) + rand(-0.35, 0.35);
  var sp = ROLE_DYN_SPEED;
  dynamites.push({
    owner: owner,
    x: b.x + Math.cos(ang) * (BALL_R + 6),
    y: b.y + Math.sin(ang) * (BALL_R + 6),
    vx: Math.cos(ang) * sp,
    vy: Math.sin(ang) * sp,
    fuse: ROLE_DYN_FUSE,
    fuseMax: ROLE_DYN_FUSE,
    r: 9
  });
  cd[owner] = (ROLES[selected[owner]] && ROLES[selected[owner]].cd) || ROLE_DYN_CD;
}

// 炸药飞行、引信倒计时、爆炸
function updateDynamites(dt) {
  for (var i = dynamites.length - 1; i >= 0; i--) {
    var d = dynamites[i];
    d.x += d.vx;
    d.y += d.vy;
    d.fuse -= dt;
    var inArena = d.x > ARENA.x && d.x < ARENA.x + ARENA.size
                && d.y > ARENA.y && d.y < ARENA.y + ARENA.size;
    if (d.fuse > 0 && inArena) continue;
    // 引信到时或飞出场地 → 爆炸
    var dynRole = ROLES[selected[d.owner]];
    // 单发炸药可自带伤害/半径/配色（爆破数学家的算式炸药），否则回落到角色表与常量
    var dynDmg = d.dmg != null ? d.dmg : ((dynRole && dynRole.dynDmg) || ROLE_DYN_DMG);
    var dynRadius = d.radius != null ? d.radius : ROLE_DYN_RADIUS;
    var dynColor = d.color || balls[d.owner].color;
    for (var opp = 0; opp < balls.length; opp++) {
      if (teamOf(opp) === teamOf(d.owner) || hp[opp] <= 0) continue;
      var dist = Math.hypot(balls[opp].x - d.x, balls[opp].y - d.y);
      if (dynDmg > 0 && dist <= dynRadius) {
        dealDamage(opp, dynDmg, dynColor, d.x, d.y, d.owner);
      }
      if (finished) break;
    }
    // 爆炸视觉：环形粒子 + 伤害飘字
    for (var k = 0; k < 34; k++) {
      var a = (k / 34) * Math.PI * 2;
      particles.push({
        x: d.x, y: d.y,
        vx: Math.cos(a) * rand(2.2, 5.4),
        vy: Math.sin(a) * rand(2.2, 5.4),
        life: rand(0.4, 0.9), maxLife: 0.9,
        color: k % 3 === 0 ? '#fff3c4' : (k % 3 === 1 ? '#ffb347' : dynColor),
        size: rand(2, 5)
      });
    }
    floatTexts.push({
      x: d.x, y: d.y - 10,
      text: dynDmg > 0 ? formatMathNumber(dynDmg) : '0',
      life: 0.9, color: d.math ? dynColor : '#ff8a3d'
    });
    dynamites.splice(i, 1);
  }
}

function summonTrains(owner) {
  var ownerRole = ROLES[selected[owner]];
  var trainLength = ownerRole.trainLength || ROLE_TRAIN_LENGTH;
  var laneInset = ROLE_TRAIN_WIDTH / 2 + BALL_R;
  var verticalLane1 = rand(ARENA.x + laneInset, ARENA.x + ARENA.size / 2 - laneInset);
  var verticalLane2 = rand(ARENA.x + ARENA.size / 2 + laneInset, ARENA.x + ARENA.size - laneInset);
  var horizontalLane1 = rand(ARENA.y + laneInset, ARENA.y + ARENA.size / 2 - laneInset);
  var horizontalLane2 = rand(ARENA.y + ARENA.size / 2 + laneInset, ARENA.y + ARENA.size - laneInset);
  trains.push(
    {
      owner: owner, hit: new Array(balls.length).fill(false),
      width: ROLE_TRAIN_WIDTH, length: trainLength,
      axis: 'vertical', x: verticalLane1,
      y: ARENA.y - trainLength / 2,
      vy: ROLE_TRAIN_SPEED
    },
    {
      owner: owner, hit: new Array(balls.length).fill(false),
      width: ROLE_TRAIN_WIDTH, length: trainLength,
      axis: 'vertical', x: verticalLane2,
      y: ARENA.y - trainLength / 2,
      vy: ROLE_TRAIN_SPEED
    },
    {
      owner: owner, hit: new Array(balls.length).fill(false),
      width: ROLE_TRAIN_WIDTH, length: trainLength,
      axis: 'horizontal', x: ARENA.x - trainLength / 2,
      y: horizontalLane1,
      vx: ROLE_TRAIN_SPEED
    },
    {
      owner: owner, hit: new Array(balls.length).fill(false),
      width: ROLE_TRAIN_WIDTH, length: trainLength,
      axis: 'horizontal', x: ARENA.x - trainLength / 2,
      y: horizontalLane2,
      vx: ROLE_TRAIN_SPEED
    }
  );
  floatTexts.push({
    x: ARENA.x + ARENA.size / 2,
    y: ARENA.y + 30,
    text: '列车进站！',
    life: 1.2,
    color: ROLES[selected[owner]].color
  });
}

function updateTrains(dt) {
  var pixelsPerFrame = dt * 60;
  var left = ARENA.x, right = ARENA.x + ARENA.size;
  var top = ARENA.y, bottom = ARENA.y + ARENA.size;

  for (var i = trains.length - 1; i >= 0; i--) {
    var train = trains[i];
    train.x += (train.vx || 0) * pixelsPerFrame;
    train.y += (train.vy || 0) * pixelsPerFrame;

    if (train.axis === 'vertical' &&
        train.y - train.length / 2 > bottom) {
      trains.splice(i, 1);
      continue;
    }
    if (train.axis === 'horizontal' &&
        train.x - train.length / 2 > right) {
      trains.splice(i, 1);
      continue;
    }

    for (var ballIndex = 0; ballIndex < balls.length; ballIndex++) {
      if (hp[ballIndex] <= 0) continue;
      var ball = balls[ballIndex];
      var firstHit = !train.hit[ballIndex];
      var halfWidth = train.width / 2;
      var halfLength = train.length / 2;
      var closestX = Math.max(train.x - halfLength,
        Math.min(ball.x, train.x + halfLength));
      var closestY = Math.max(train.y - halfWidth,
        Math.min(ball.y, train.y + halfWidth));
      if (train.axis === 'vertical') {
        closestX = Math.max(train.x - halfWidth,
          Math.min(ball.x, train.x + halfWidth));
        closestY = Math.max(train.y - halfLength,
          Math.min(ball.y, train.y + halfLength));
      }

      var dx = ball.x - closestX;
      var dy = ball.y - closestY;
      var distance = Math.hypot(dx, dy);
      if (distance > BALL_R) {
        train.hit[ballIndex] = false;
        continue;
      }

      var nx, ny;
      if (distance > 0) {
        nx = dx / distance;
        ny = dy / distance;
      } else {
        var offsetX = ball.x - train.x;
        var offsetY = ball.y - train.y;
        var penetrationX = (train.axis === 'vertical' ? halfWidth : halfLength) - Math.abs(offsetX);
        var penetrationY = (train.axis === 'vertical' ? halfLength : halfWidth) - Math.abs(offsetY);
        if (penetrationX < penetrationY) {
          nx = offsetX < 0 ? -1 : 1;
          ny = 0;
        } else {
          nx = 0;
          ny = offsetY < 0 ? -1 : 1;
        }
      }

      var trainVx = train.vx || 0;
      var trainVy = train.vy || 0;
      var relativeVn = (ball.vx - trainVx) * nx + (ball.vy - trainVy) * ny;
      if (relativeVn < 0) {
        ball.vx -= 2 * relativeVn * nx;
        ball.vy -= 2 * relativeVn * ny;
      }
      if (distance > 0) {
        var pushOut = BALL_R - distance + 0.5;
        ball.x += nx * pushOut;
        ball.y += ny * pushOut;
      } else {
        if (nx !== 0) {
          ball.x = train.x + nx *
            ((train.axis === 'vertical' ? halfWidth : halfLength) + BALL_R + 0.5);
        } else {
          ball.y = train.y + ny *
            ((train.axis === 'vertical' ? halfLength : halfWidth) + BALL_R + 0.5);
        }
      }
      if (firstHit) {
        train.hit[ballIndex] = true;
        if (teamOf(ballIndex) !== teamOf(train.owner)) {
          var ownerRole = ROLES[selected[train.owner]];
          var damage = ownerRole.trainDmgMin +
            Math.floor(Math.random() * (ownerRole.trainDmgMax - ownerRole.trainDmgMin + 1));
          dealDamage(ballIndex, damage,
            ROLES[selected[train.owner]].color, ball.x, ball.y, train.owner);
          if (finished) return;
        }
        spawnParticles(ball.x, ball.y, ROLES[selected[train.owner]].color, 10);
        floatTexts.push({
          x: ball.x,
          y: ball.y - BALL_R - 8,
          text: teamOf(ballIndex) === teamOf(train.owner) ? '反弹' : '-' + damage,
          life: 0.8,
          color: ROLES[selected[train.owner]].color
        });
      }
    }
  }
}

/* ============ 物理学家：电场 / 引力场 / 光路 ============ */

// 射线与线段求交（用于激光在镜面上的反射）：返回沿射线的距离 t
function rayHitSegment(ox, oy, dx, dy, x1, y1, x2, y2) {
  var ex = x2 - x1, ey = y2 - y1;
  var denom = dx * ey - dy * ex;
  if (Math.abs(denom) < 1e-9) return null;
  var qx = x1 - ox, qy = y1 - oy;
  var t = (qx * ey - qy * ex) / denom;
  var u = (qx * dy - qy * dx) / denom;
  if (t <= 0.001 || u < 0 || u > 1) return null;
  return { t: t, x: ox + dx * t, y: oy + dy * t };
}

// 两条线段是否相交（判定小球这一帧有没有穿过光线）
function segmentsCross(ax, ay, bx, by, cx, cy, ex, ey) {
  var r1x = bx - ax, r1y = by - ay;
  var r2x = ex - cx, r2y = ey - cy;
  var den = r1x * r2y - r1y * r2x;
  if (Math.abs(den) < 1e-9) return false;
  var t = ((cx - ax) * r2y - (cy - ay) * r2x) / den;
  var u = ((cx - ax) * r1y - (cy - ay) * r1x) / den;
  return t >= 0 && t <= 1 && u >= 0 && u <= 1;
}

// 射线到擂台内壁的距离
function rayToArenaEdge(ox, oy, dx, dy) {
  var best = Infinity;
  if (dx > 1e-9) best = Math.min(best, (ARENA.x + ARENA.size - ox) / dx);
  if (dx < -1e-9) best = Math.min(best, (ARENA.x - ox) / dx);
  if (dy > 1e-9) best = Math.min(best, (ARENA.y + ARENA.size - oy) / dy);
  if (dy < -1e-9) best = Math.min(best, (ARENA.y - oy) / dy);
  return best;
}

// 随机四块双面平面镜
function makePhysMirrors() {
  var mirrors = [];
  for (var i = 0; i < ROLE_PHYS_MIRRORS; i++) {
    var ang = rand(0, Math.PI);
    var cx = rand(ARENA.x + ARENA.size * 0.2, ARENA.x + ARENA.size * 0.8);
    var cy = rand(ARENA.y + ARENA.size * 0.2, ARENA.y + ARENA.size * 0.8);
    var half = ROLE_PHYS_MIRROR_LEN / 2;
    mirrors.push({
      x1: cx - Math.cos(ang) * half, y1: cy - Math.sin(ang) * half,
      x2: cx + Math.cos(ang) * half, y2: cy + Math.sin(ang) * half
    });
  }
  return mirrors;
}

// 四角朝场地中心发射，遇镜面按镜面法线反射，生成整条光路
function tracePhysLasers(mirrors) {
  var corners = [
    { x: ARENA.x, y: ARENA.y },
    { x: ARENA.x + ARENA.size, y: ARENA.y },
    { x: ARENA.x + ARENA.size, y: ARENA.y + ARENA.size },
    { x: ARENA.x, y: ARENA.y + ARENA.size }
  ];
  var cx = ARENA.x + ARENA.size / 2, cy = ARENA.y + ARENA.size / 2;
  var segments = [];
  for (var c = 0; c < corners.length; c++) {
    var ox = corners[c].x, oy = corners[c].y;
    var dx = cx - ox, dy = cy - oy;
    var len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    for (var bounce = 0; bounce <= ROLE_PHYS_RAY_BOUNCES; bounce++) {
      var nearestT = rayToArenaEdge(ox, oy, dx, dy);
      var hit = null;
      for (var m = 0; m < mirrors.length; m++) {
        var r = rayHitSegment(ox, oy, dx, dy, mirrors[m].x1, mirrors[m].y1, mirrors[m].x2, mirrors[m].y2);
        if (r && r.t < nearestT) { nearestT = r.t; hit = { r: r, m: mirrors[m] }; }
      }
      segments.push({ x1: ox, y1: oy, x2: ox + dx * nearestT, y2: oy + dy * nearestT });
      if (!hit) break;
      var ex = hit.m.x2 - hit.m.x1, ey = hit.m.y2 - hit.m.y1;
      var el = Math.hypot(ex, ey) || 1;
      var nx = -ey / el, ny = ex / el;
      var dot = dx * nx + dy * ny;
      dx = dx - 2 * dot * nx;
      dy = dy - 2 * dot * ny;
      var nl = Math.hypot(dx, dy) || 1;
      dx /= nl; dy /= nl;
      ox = hit.r.x + dx * 0.5;
      oy = hit.r.y + dy * 0.5;
    }
  }
  return segments;
}

function gravityWallName(wall) {
  return wall === 'left' ? '左' : wall === 'right' ? '右' : wall === 'top' ? '上' : '下';
}

function physKindName(kind) {
  if (kind === 1) return '电场·电磁铁';
  if (kind === 2) return '引力场';
  if (kind === 3) return '光路·激光';
  return '场域';
}

function wallDistanceOf(ball, field) {
  if (field.dx > 0) return ARENA.x + ARENA.size - ball.x;
  if (field.dx < 0) return ball.x - ARENA.x;
  if (field.dy > 0) return ARENA.y + ARENA.size - ball.y;
  return ball.y - ARENA.y;
}

// 冷却结束：随机激活三种场域之一
function activatePhysField(owner) {
  var team = teamOf(owner);
  var ownerBall = balls[owner];
  var kind = 1 + Math.floor(Math.random() * 3);
  var field = {
    owner: owner, team: team, kind: kind,
    t: ROLE_PHYS_DURATION, tick: 0,
    color: ownerBall ? ownerBall.color : '#22d3ee'
  };
  if (kind === 1) {
    var side = ROLE_PHYS_FIELD_SIDE;
    field.side = side;
    field.x = rand(ARENA.x + 6, ARENA.x + ARENA.size - side - 6);
    field.y = rand(ARENA.y + 6, ARENA.y + ARENA.size - side - 6);
    field.cx = field.x + side / 2;
    field.cy = field.y + side / 2;
    floatTexts.push({ x: field.cx, y: field.y - 8, text: '电场·电磁铁', life: 1.3, color: field.color });
  } else if (kind === 2) {
    var dirs = [
      { dx: 1, dy: 0, wall: 'right' },
      { dx: -1, dy: 0, wall: 'left' },
      { dx: 0, dy: 1, wall: 'bottom' },
      { dx: 0, dy: -1, wall: 'top' }
    ];
    var pick = dirs[Math.floor(Math.random() * dirs.length)];
    field.dx = pick.dx; field.dy = pick.dy; field.wall = pick.wall;
    field.hitBook = {};
    field.distBook = {};
    for (var i = 0; i < balls.length; i++) {
      if (teamOf(i) === team || hp[i] <= 0) continue;
      field.distBook[i] = wallDistanceOf(balls[i], field);
    }
    floatTexts.push({
      x: ARENA.x + ARENA.size / 2, y: ARENA.y + ARENA.size / 2,
      text: '引力场·向' + gravityWallName(field.wall), life: 1.3, color: field.color
    });
  } else {
    field.mirrors = makePhysMirrors();
    field.segments = tracePhysLasers(field.mirrors);
    field.lastPos = {};
    for (var j = 0; j < balls.length; j++) {
      field.lastPos[j] = { x: balls[j].x, y: balls[j].y };
    }
    floatTexts.push({
      x: ARENA.x + ARENA.size / 2, y: ARENA.y + ARENA.size / 2,
      text: '光路·四角激光', life: 1.3, color: field.color
    });
  }
  physFields.push(field);
  return kind;
}

function updatePhysFields(dt) {
  for (var f = physFields.length - 1; f >= 0; f--) {
    var field = physFields[f];
    field.t -= dt;
    if (field.kind === 1) updateElectricField(field, dt);
    else if (field.kind === 2) updateGravityField(field, dt);
    else updateLaserField(field);
    if (finished) return;
    if (field.t <= 0) physFields.splice(f, 1);
  }
}

// 技能1：电场持续伤害 + 电磁铁吸走进入电场的所有子弹
function updateElectricField(field, dt) {
  var left = field.x, right = field.x + field.side;
  var top = field.y, bottom = field.y + field.side;
  field.tick += dt;
  var ticked = false;
  if (field.tick >= ROLE_PHYS_FIELD_TICK) {
    field.tick -= ROLE_PHYS_FIELD_TICK;
    ticked = true;
  }
  if (ticked) {
    for (var i = 0; i < balls.length; i++) {
      if (teamOf(i) === field.team || hp[i] <= 0) continue;
      var b = balls[i];
      if (b.x < left || b.x > right || b.y < top || b.y > bottom) continue;
      dealDamage(i, ROLE_PHYS_FIELD_DPS * ROLE_PHYS_FIELD_TICK,
        field.color, b.x, b.y, field.owner);
      if (finished) return;
    }
  }
  for (var q = bullets.length - 1; q >= 0; q--) {
    var bl = bullets[q];
    if (bl.x < left || bl.x > right || bl.y < top || bl.y > bottom) continue;
    var dx = field.cx - bl.x, dy = field.cy - bl.y;
    var d = Math.hypot(dx, dy) || 1;
    if (d < 10) {
      spawnParticles(bl.x, bl.y, field.color, 8);
      bullets.splice(q, 1);
      continue;
    }
    bl.vx += dx / d * ROLE_PHYS_MAGNET_ACCEL;
    bl.vy += dy / d * ROLE_PHYS_MAGNET_ACCEL;
    var sp = Math.hypot(bl.vx, bl.vy);
    if (sp > ROLE_PHYS_MAGNET_MAX_SPEED) {
      bl.vx = bl.vx / sp * ROLE_PHYS_MAGNET_MAX_SPEED;
      bl.vy = bl.vy / sp * ROLE_PHYS_MAGNET_MAX_SPEED;
    }
  }
}

// 技能2：把所有敌方压向指定墙壁，撞墙按起手距离结算伤害
function updateGravityField(field, dt) {
  for (var i = 0; i < balls.length; i++) {
    if (teamOf(i) === field.team || hp[i] <= 0) continue;
    var b = balls[i];
    b.vx = field.dx * ROLE_PHYS_GRAVITY_PUSH;
    b.vy = field.dy * ROLE_PHYS_GRAVITY_PUSH;
    if (field.hitBook[i]) continue;
    var atWall = false;
    if (field.dx > 0) atWall = b.x >= ARENA.x + ARENA.size - BALL_R - 1;
    else if (field.dx < 0) atWall = b.x <= ARENA.x + BALL_R + 1;
    else if (field.dy > 0) atWall = b.y >= ARENA.y + ARENA.size - BALL_R - 1;
    else atWall = b.y <= ARENA.y + BALL_R + 1;
    if (!atWall) continue;
    field.hitBook[i] = true;
    var dist = field.distBook[i] || 0;
    var dmg = Math.max(1, Math.floor(dist / ROLE_PHYS_GRAVITY_UNIT));
    dealDamage(i, dmg, field.color, b.x, b.y, field.owner);
    if (finished) return;
    spawnParticles(b.x, b.y, field.color, 16);
    floatTexts.push({ x: b.x, y: b.y - BALL_R - 10, text: '撞墙 -' + dmg, life: 0.9, color: field.color });
  }
}

// 技能3：每次穿过光线受 5 伤（一帧穿过几条就结算几次）
function updateLaserField(field) {
  for (var i = 0; i < balls.length; i++) {
    var last = field.lastPos[i];
    if (!last) { field.lastPos[i] = { x: balls[i].x, y: balls[i].y }; continue; }
    if (teamOf(i) === field.team || hp[i] <= 0) {
      last.x = balls[i].x; last.y = balls[i].y;
      continue;
    }
    var crossed = 0;
    for (var s = 0; s < field.segments.length; s++) {
      var seg = field.segments[s];
      if (segmentsCross(last.x, last.y, balls[i].x, balls[i].y, seg.x1, seg.y1, seg.x2, seg.y2)) crossed++;
    }
    if (crossed > 0) {
      dealDamage(i, ROLE_PHYS_LASER_DMG * crossed, field.color, balls[i].x, balls[i].y, field.owner);
      if (finished) return;
    }
    last.x = balls[i].x; last.y = balls[i].y;
  }
}

/* ============ 病毒：病毒罐 + 分段延迟伤害 ============ */

// 每 15 秒在场地随机位置丢下 2 个病毒罐
function spawnVirusJars(owner) {
  var team = teamOf(owner);
  var color = ROLES[selected[owner]].color;
  for (var n = 0; n < ROLE_VIRUS_JARS; n++) {
    var margin = ROLE_VIRUS_JAR_R + 10;
    var x = rand(ARENA.x + margin, ARENA.x + ARENA.size - margin);
    var y = rand(ARENA.y + margin, ARENA.y + ARENA.size - margin);
    virusJars.push({
      owner: owner, team: team,
      x: x, y: y, r: ROLE_VIRUS_JAR_R,
      color: color, hits: 0, cool: {},
      born: globalTime
    });
    spawnParticles(x, y, color, 8);
  }
  floatTexts.push({
    x: ARENA.x + ARENA.size / 2, y: ARENA.y + ARENA.size / 2,
    text: '投放病毒罐 ×' + ROLE_VIRUS_JARS, life: 1.2, color: color
  });
}

// 罐子触碰检测 + 三段延迟伤害结算
function updateVirus(dt) {
  for (var j = virusJars.length - 1; j >= 0; j--) {
    var jar = virusJars[j];
    for (var key in jar.cool) {
      if (jar.cool[key] > 0) jar.cool[key] = Math.max(0, jar.cool[key] - dt);
    }
    var touched = false;
    for (var i = 0; i < balls.length; i++) {
      if (hp[i] <= 0) continue;
      if (teamOf(i) === jar.team) continue;          // 只对敌方生效
      var b = balls[i];
      if (Math.hypot(b.x - jar.x, b.y - jar.y) > BALL_R + jar.r) continue;
      if (jar.cool[i] > 0) continue;
      jar.cool[i] = ROLE_VIRUS_JAR_TOUCH_CD;
      b.virusHits = (b.virusHits || 0) + 1;
      var x = b.virusHits;
      // 第 x 次碰到 → 分 3 次、每次间隔 1 秒，各造成 x 伤害
      virusDots.push({
        target: i, owner: jar.owner, dmg: x,
        ticks: ROLE_VIRUS_DMG_TICKS, next: 0
      });
      floatTexts.push({
        x: b.x, y: b.y - 26,
        text: '病毒 x' + x, life: 1, color: jar.color
      });
      spawnParticles(b.x, b.y, jar.color, 10);
      jar.hits++;
      touched = true;
      break;                                         // 一个罐子一帧只触发一次
    }
    if (touched && jar.hits >= ROLE_VIRUS_JAR_HITS) {
      spawnParticles(jar.x, jar.y, jar.color, 14);
      floatTexts.push({ x: jar.x, y: jar.y - 18, text: '罐子破碎', life: 0.9, color: jar.color });
      virusJars.splice(j, 1);
    }
  }
  // 延迟伤害队列：next <= 0 就结算一次，然后等 1 秒再结算下一次
  for (var d = virusDots.length - 1; d >= 0; d--) {
    var dot = virusDots[d];
    dot.next -= dt;
    while (dot.next <= 0 && dot.ticks > 0) {
      var targetBall = balls[dot.target];
      var ownerBall = balls[dot.owner];
      dealDamage(dot.target, dot.dmg,
        ownerBall ? ownerBall.color : '#a6e22e',
        targetBall ? targetBall.x : ARENA.x + ARENA.size / 2,
        targetBall ? targetBall.y : ARENA.y + ARENA.size / 2,
        dot.owner);
      if (finished) return;
      dot.ticks--;
      dot.next += ROLE_VIRUS_TICK_INTERVAL;
    }
    if (dot.ticks <= 0) virusDots.splice(d, 1);
  }
}

/* ============ 保安：警戒线 ============ */

// 撞墙回调：第一次落点开始拉线，第二次落点完成整条线
function handleGuardWallHit(index) {
  var b = balls[index];
  if (!b || hp[index] <= 0) return;
  if (b.guardWallLock > 0) return;
  b.guardWallLock = ROLE_GUARD_WALL_LOCK;
  var color = ROLES[selected[index]].color;
  if (b.guardStage === 'first' && b.guardPoint) {
    guardLines.push({
      owner: index, team: teamOf(index),
      x1: b.guardPoint.x, y1: b.guardPoint.y,
      x2: b.x, y2: b.y,
      color: color
    });
    b.guardStage = 'idle';
    b.guardPoint = null;
    floatTexts.push({ x: b.x, y: b.y - 20, text: '警戒线完成', life: 1, color: color });
  } else {
    b.guardStage = 'first';
    b.guardPoint = { x: b.x, y: b.y };
    floatTexts.push({ x: b.x, y: b.y - 20, text: '拉线…', life: 0.9, color: color });
  }
}

// 穿线判定：用“上一帧位置 → 当前帧位置”与每条警戒线求交
function updateGuardLines() {
  for (var i = 0; i < balls.length; i++) {
    var prev = ballPrevPos[i];
    if (!prev || hp[i] <= 0) continue;
    var b = balls[i];
    var crossed = 0, lineOwner = -1, lineColor = '#7c8cff';
    for (var l = 0; l < guardLines.length; l++) {
      var line = guardLines[l];
      if (line.team === teamOf(i)) continue;         // 只对敌方生效
      if (!segmentsCross(prev.x, prev.y, b.x, b.y, line.x1, line.y1, line.x2, line.y2)) continue;
      crossed++;
      if (lineOwner < 0) { lineOwner = line.owner; lineColor = line.color; }
    }
    if (crossed > 0 && lineOwner >= 0) {
      dealDamage(i, ROLE_GUARD_LINE_DMG * crossed, lineColor, b.x, b.y, lineOwner);
      if (finished) return;
      floatTexts.push({
        x: b.x, y: b.y - 24,
        text: '穿线 -' + (ROLE_GUARD_LINE_DMG * crossed), life: 0.9, color: lineColor
      });
    }
  }
}

// 记录每帧位置，供下一帧的穿线判定使用
function rememberBallPositions() {
  for (var i = 0; i < balls.length; i++) {
    var p = ballPrevPos[i];
    if (!p) ballPrevPos[i] = { x: balls[i].x, y: balls[i].y };
    else { p.x = balls[i].x; p.y = balls[i].y; }
  }
}

/* ============ BOSS 分裂者：回血 + 全场分裂判定 ============ */

function bossSplitInterval() {
  if (BOSS_ROLE_INDEX >= 0 && ROLES[BOSS_ROLE_INDEX] && ROLES[BOSS_ROLE_INDEX].splitInterval != null) {
    return ROLES[BOSS_ROLE_INDEX].splitInterval;
  }
  return ROLE_SPLIT_INTERVAL;
}

// 把一个分裂体一分为二：本体留一半血，新增一个同角色、同血量的分裂体
function splitBossBall(index) {
  var b = balls[index];
  var role = ROLES[selected[index]];
  if (!b || !role) return;
  var half = hp[index] / 2;
  hp[index] = half;
  var ang = Math.random() * Math.PI * 2;
  var off = BALL_R * 1.7;
  var nb = mkBall(index);                       // 同一角色下标 → 同一个 BOSS 角色
  nb.x = Math.max(ARENA.x + BALL_R, Math.min(ARENA.x + ARENA.size - BALL_R, b.x + Math.cos(ang) * off));
  nb.y = Math.max(ARENA.y + BALL_R, Math.min(ARENA.y + ARENA.size - BALL_R, b.y + Math.sin(ang) * off));
  nb.vx = Math.cos(ang + Math.PI) * BALL_SPEED;
  nb.vy = Math.sin(ang + Math.PI) * BALL_SPEED;
  nb.splitRegenT = role.regenInterval;
  nb.splitNoRegenT = role.noRegenAfterSplit;
  b.splitRegenT = role.regenInterval;
  b.splitNoRegenT = role.noRegenAfterSplit;
  // 关键：所有平行数组都必须按「新球的实际下标」写入。
  // selected 的长度不一定等于 balls.length（BOSS 战里 selected 有 4 槽、balls 只有 3 个），
  // 用 push 会让角色下标和球下标错位，分裂体就会读到别的角色（曾经读到 0 号炮手）。
  var newIndex = balls.length;
  balls.push(nb);
  hp[newIndex] = half;
  selected[newIndex] = selected[index];
  cd[newIndex] = 0;
  hook[newIndex] = null;
  bumpLock[newIndex] = 0;
  ballPrevPos[newIndex] = { x: nb.x, y: nb.y };
  previewPositions[newIndex] = { x: nb.x, y: nb.y };
  spawnParticles(b.x, b.y, role.color, 12);
  spawnParticles(nb.x, nb.y, role.color, 12);
  floatTexts.push({ x: nb.x, y: nb.y - BALL_R - 8, text: '分裂', life: 0.9, color: role.color });
}

// 全场每 15 秒做一次分裂判定（与满血球数量无关），另外每个分裂体各自回血
function updateSplitters(dt) {
  if (!bossMode) return;
  bossSplitT -= dt;
  if (bossSplitT <= 0) {
    bossSplitT = bossSplitInterval();
    var splitCount = 0;
    // 先快照一份要分裂的下标，避免遍历过程中数组变长
    var candidates = [];
    for (var i = 0; i < balls.length; i++) {
      if (teamOf(i) !== 1 || hp[i] <= 0) continue;
      var role = ROLES[selected[i]];
      if (!role || role.role !== 'splitter') continue;
      if (hp[i] + 0.001 < role.maxHp) continue;   // 必须满血才会分裂
      candidates.push(i);
    }
    for (var c = 0; c < candidates.length; c++) {
      if (balls.length >= ROLE_SPLIT_MAX_BALLS) break;
      splitBossBall(candidates[c]);
      splitCount++;
    }
    if (splitCount > 0) {
      floatTexts.push({
        x: ARENA.x + ARENA.size / 2, y: ARENA.y + ARENA.size * 0.35,
        text: '细胞分裂 ×' + splitCount, life: 1.3, color: '#7cf5c8'
      });
    }
  }
  // 每个分裂体独立回血；分裂后 5 秒内不回
  for (var j = 0; j < balls.length; j++) {
    if (hp[j] <= 0) continue;
    var r = ROLES[selected[j]];
    if (!r || r.role !== 'splitter') continue;
    var ball = balls[j];
    if (ball.splitNoRegenT > 0) ball.splitNoRegenT = Math.max(0, ball.splitNoRegenT - dt);
    ball.splitRegenT -= dt;
    if (ball.splitRegenT > 0) continue;
    ball.splitRegenT = r.regenInterval;
    if (ball.splitNoRegenT > 0) continue;
    if (hp[j] >= r.maxHp) continue;
    hp[j] = Math.min(r.maxHp, hp[j] + r.regenAmount);
    floatTexts.push({ x: ball.x, y: ball.y - BALL_R - 6, text: '+' + r.regenAmount, life: 0.8, color: r.color });
    updateHUD();
  }
}

// 盾兵贴脸伤害锁逐帧衰减
function decayLocks(dt) {
  for (var i = 0; i < bumpLock.length; i++) {
    if (bumpLock[i] > 0) bumpLock[i] = Math.max(0, bumpLock[i] - dt);
  }
}

/* ============ 特效 ============ */
function spawnParticles(x, y, color, n) {
  for (var i = 0; i < n; i++) {
    var a = rand(0, Math.PI * 2);
    var sp = rand(1, 4);
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1, color: color
    });
  }
}

/* ============ 更新逻辑 ============ */
function update(dt) {
  if (!running) {
    previewT += dt;
    // 待机位在 resetMatch() 里固定好，这里只叠加平滑的浮动，避免每帧归位导致抖动
    var ph = Math.sin(previewT * 2.2) * 6;
    for (var i = 0; i < balls.length; i++) {
      // 分裂体没有待机位，拿不到就原地不动（避免预览阶段读 undefined 报错）
      var pp = previewPositions[i];
      if (!pp) continue;
      balls[i].x = pp.x;
      balls[i].y = pp.y + (i % 2 === 0 ? ph : -ph);
    }
    return;
  }

  var left = ARENA.x + BALL_R;
  var right = ARENA.x + ARENA.size - BALL_R;
  var top = ARENA.y + BALL_R;
  var bottom = ARENA.y + ARENA.size - BALL_R;

  if (spawnT < 1) {
    spawnT = Math.min(1, spawnT + dt * 1.6);
    var k = easeOutCubic(spawnT);
    for (var i = 0; i < balls.length; i++) {
      var tg = previewPositions[i];
      if (!tg || !balls[i].spawnFrom) continue;   // 分裂体没有出场动画
      balls[i].x = balls[i].spawnFrom.x + (tg.x - balls[i].spawnFrom.x) * k;
      balls[i].y = balls[i].spawnFrom.y + (tg.y - balls[i].spawnFrom.y) * k;
    }
    if (spawnT >= 1) {
      for (var j = 0; j < balls.length; j++) {
        var tg2 = previewPositions[j];
        balls[j].x = tg2.x;
        balls[j].y = tg2.y;
        // 单位向量 * BALL_SPEED，保证合速度正好等于 BALL_SPEED，
        // 开局第一帧不被 clampSpeed 修正方向
        var sp = (teamOf(j) === 0 ? 0 : Math.PI) + (Math.random() - 0.5) * 0.6;
        balls[j].vx = Math.cos(sp) * BALL_SPEED;
        balls[j].vy = Math.sin(sp) * BALL_SPEED;
      }
    }
    updateDynamites(dt);
  if (finished) return;
  decayLocks(dt);
  collideBalls();
  return;
  }

  for (var m = 0; m < balls.length; m++) {
    if (hp[m] <= 0) continue;
    var b = balls[m];
    // 钩中目标的位置由钩子逻辑独占控制（锚点坐标即球心），
    // 这里一旦再叠加 vx/vy，锚体就会相对球心漂出——必须跳过。
    if (isHookedBall(m)) continue;
    b.x += b.vx;
    b.y += b.vy;
    var hitWall = false;
    if (b.x < left)  { b.x = left;  b.vx = Math.abs(b.vx);  hitWall = true; }
    if (b.x > right) { b.x = right; b.vx = -Math.abs(b.vx); hitWall = true; }
    if (b.y < top)    { b.y = top;    b.vy = Math.abs(b.vy); hitWall = true; }
    if (b.y > bottom) { b.y = bottom; b.vy = -Math.abs(b.vy); hitWall = true; }
    // 吸血鬼：撞墙后随机新方向，表现为"碰墙乱弹"，且不瞬移（用当前位置重算方向）
    if (hitWall && ROLES[selected[m]].role === 'vampire') {
      var va = Math.random() * Math.PI * 2;
      var spd = BALL_SPEED * (0.85 + Math.random() * 0.15);
      b.vx = Math.cos(va) * spd;
      b.vy = Math.sin(va) * spd;
    }
    // 保安：撞墙即落点（第一次开始拉线，第二次完成警戒线）
    if (hitWall && ROLES[selected[m]].role === 'guard') handleGuardWallHit(m);
    clampSpeed(b);
  }

  updateDynamites(dt);
  if (finished) return;
  decayLocks(dt);
  collideBalls();
  if (finished) return;

  for (var n = 0; n < balls.length; n++) {
    cd[n] = Math.max(0, cd[n] - dt);
    if (bumpLock[n] > 0) bumpLock[n] = Math.max(0, bumpLock[n] - dt);
    if (balls[n].guardWallLock > 0) balls[n].guardWallLock = Math.max(0, balls[n].guardWallLock - dt);
  }
  updateTrains(dt);
  if (finished) return;

  for (var p = 0; p < balls.length; p++) {
    if (hp[p] <= 0) continue;
    var role = ROLES[selected[p]].role;
    if (role === 'gun') {
      // 霰弹枪手：冷却到 0 就朝敌方扇形开火，开火后重置冷却
      if (cd[p] <= 0) fireGun(p);
    } else if (role === 'hook') {
      if (!hook[p]) fireHook(p);
    } else if (role === 'shield') {
      // 盾兵：贴脸时按冷却撞击，平时不主动开技能
      if (cd[p] <= 0) fireShield(p);
    } else if (role === 'vampire') {
      // 吸血鬼：乱弹不追踪。仅在撞墙/碰敌时才重随机（见 collideBalls / 边界反弹），
      // 不在每帧以概率触发，否则会表现为"中间抽一下瞬移"。
      clampSpeed(balls[p], BALL_SPEED);
    } else if (role === 'dynamite') {
      // 爆破手：冷却到 0 即向随机方向投掷一枚炸药
      if (cd[p] <= 0) fireDynamite(p);
    } else if (role === 'dispatcher') {
      if (cd[p] <= 0) {
        summonTrains(p);
        cd[p] = ROLE_DISPATCHER_CD;
      }
    } else if (role === 'cowboy') {
      var cb = balls[p];
      // 齐射进行中：逐发射出，期间自身持续停止移动
      if (cb.cowboyIdx != null && cb.cowboyIdx < ROLE_COWBOY_SHOTS) {
        cb.cowboyNext -= dt;
        if (cb.cowboyNext <= 0) {
          var cowboyTarget = findEnemy(p);
          if (cowboyTarget < 0) continue;
          var cdx = balls[cowboyTarget].x - cb.x, cdy = balls[cowboyTarget].y - cb.y;
          var cang = Math.atan2(cdy, cdx); // 每发重新瞄准
          var cdmg = ROLE_COWBOY_DMG_MIN + Math.floor(Math.random() * (ROLE_COWBOY_DMG_MAX - ROLE_COWBOY_DMG_MIN + 1));
          bullets.push({
            x: cb.x + Math.cos(cang) * (BALL_R + 4),
            y: cb.y + Math.sin(cang) * (BALL_R + 4),
            vx: Math.cos(cang) * BULLET_SPEED,
            vy: Math.sin(cang) * BULLET_SPEED,
            owner: p,
            color: cb.color,
            dmg: cdmg,
            rico: 0,
            ricoMax: ROLE_COWBOY_RICO
          });
          cb.cowboyIdx++;
          cb.cowboyNext += cb.cowboyPause;
        }
        cb.vx = 0; cb.vy = 0;
        continue;
      } else if (cb.cowboyIdx != null) {
        // 6 发全部射完，恢复乱弹
        cb.cowboyIdx = null; cb.cowboyNext = 0;
      }
      // 非齐射期间：持续乱弹，与其他 keep 型角色一致
      if (cb.cowboyIdx == null) {
        if (Math.random() < dt * 1.5) {
          var ra = Math.random() * Math.PI * 2;
          cb.vx = Math.cos(ra) * BALL_SPEED;
          cb.vy = Math.sin(ra) * BALL_SPEED;
        }
        clampSpeed(cb, BALL_SPEED);
      }
      // 冷却到 0：开始一轮齐射
      if (cd[p] <= 0) {
        cd[p] = ROLE_COWBOY_CD;
        cb.cowboyIdx = 0;
        cb.cowboyNext = 2.5;           // 首发延迟，使齐射中点对齐 10 秒周期
        cb.cowboyPause = 0.3;          // 每 0.3 秒一发
        cb.vx = 0; cb.vy = 0;
      }
    } else if (role === 'ghost') {
      var g = balls[p];
      var phase = g.ghostPhase || 'cooldown';
      var gt = g.ghostT != null ? g.ghostT : 0;
      if (phase === 'cooldown') {
        gt = Math.max(0, gt - dt);
        if (gt <= 0) phase = 'ready';
      } else if (phase === 'warp') {
        gt -= dt;
        if (gt <= 0) {
          var gd = Math.max(0, g.ghostDmg || 0) * ROLE_GHOST_RETURN;
          g.ghostDmg = 0;
          if (gd > 0) {
            var ghostTarget = findEnemy(p);
            if (ghostTarget < 0) break;
            var eg = balls[ghostTarget];
            var gdx = eg.x - g.x, gdy = eg.y - g.y;
            var gang = Math.atan2(gdy, gdx);
            bullets.push({
              x: g.x + Math.cos(gang) * (BALL_R + 4),
              y: g.y + Math.sin(gang) * (BALL_R + 4),
              vx: Math.cos(gang) * BULLET_SPEED,
              vy: Math.sin(gang) * BULLET_SPEED,
              owner: p,
              color: g.color,
              dmg: gd,
              rico: 0,
              ricoMax: ROLE_GHOST_RICO
            });
          }
          phase = 'cooldown';
          gt = ROLE_GHOST_CD;
        }
      }
      g.ghostPhase = phase; g.ghostT = gt;
      // 幽灵保持当前方向移动，仅在碰墙时反弹。
      if (phase !== 'warp') {
        clampSpeed(g, BALL_SPEED);
      }
    } else if (role === 'medic') {
      var medic = balls[p];
      // ===== 复活蓄力（每局一次）：队友阵亡 → 30 秒蓄力 → 半血复活 =====
      if (medic.medicRevivePhase === 'ready') {
        var reviveMate = teammateOf(p);
        if (reviveMate >= 0 && balls[reviveMate] && hp[reviveMate] <= 0) {
          medic.medicRevivePhase = 'charging';
          medic.medicReviveT = ROLE_MEDIC_REVIVE_CHARGE;
          medic.medicReviveTarget = reviveMate;
          floatTexts.push({
            x: medic.x, y: medic.y - 30,
            text: '开始复活蓄力 ' + ROLE_MEDIC_REVIVE_CHARGE + 's',
            life: 1.6, color: medic.color
          });
          updateHUD();
        }
      } else if (medic.medicRevivePhase === 'charging') {
        medic.medicReviveT -= dt;
        if (medic.medicReviveT <= 0) {
          reviveTeammate(p);
          if (finished) return;
        }
      }
      // 蓄力期间只能用复活，不能发治疗弹（治疗状态机整体冻结）
      if (medic.medicRevivePhase !== 'charging') {
        if (medic.medicPhase === 'cooldown') {
          medic.medicT = Math.max(0, medic.medicT - dt);
          if (medic.medicT <= 0) medic.medicPhase = 'ready';
        } else if (medic.medicPhase === 'charge') {
          medic.medicT -= dt;
          if (medic.medicT <= 0) fireMedicBullet(p);
        }
      }
    } else if (role === 'mathematician') {
      var mathematician = balls[p];
      if (mathematician.mathPhase === 'cooldown') {
        mathematician.mathT = Math.max(0, mathematician.mathT - dt);
        if (mathematician.mathT <= 0) {
          mathematician.mathPhase = 'charge';
          mathematician.mathT = ROLE_MATH_CHARGE;
          mathematician.mathExpression = createMathExpression();
        }
      } else if (mathematician.mathPhase === 'charge') {
        mathematician.mathT -= dt;
        if (mathematician.mathT <= 0) fireMathBullet(p);
      }
    } else if (role === 'dynmath') {
      // 爆破数学家：15 秒冷却 → 5 秒算式蓄力 → 掷出算式炸药
      var dynMathBall = balls[p];
      if (dynMathBall.dynmathPhase === 'cooldown') {
        dynMathBall.dynmathT = Math.max(0, dynMathBall.dynmathT - dt);
        if (dynMathBall.dynmathT <= 0) {
          dynMathBall.dynmathPhase = 'charge';
          dynMathBall.dynmathT = ROLE_DYNMATH_CHARGE;
          dynMathBall.dynmathExpression = createMathExpression();
          floatTexts.push({
            x: dynMathBall.x, y: dynMathBall.y - 30,
            text: mathExpressionText(dynMathBall.dynmathExpression),
            life: 1.4, color: dynMathBall.color
          });
        }
      } else if (dynMathBall.dynmathPhase === 'charge') {
        dynMathBall.dynmathT -= dt;
        if (dynMathBall.dynmathT <= 0) fireDynMathBomb(p);
      }
    } else if (role === 'gunner') {
      // 枪手：每 5 秒朝敌方发射一发可反弹子弹
      if (cd[p] <= 0) {
        var enemyIndex = findEnemy(p);
        if (enemyIndex < 0) continue;
        var enemy = balls[enemyIndex];
        var me = balls[p];
        var gdx = enemy.x - me.x, gdy = enemy.y - me.y;
        var gl = Math.hypot(gdx, gdy) || 1;
        var gdmg = ROLE_GUNNER_DMG_MIN + Math.floor(Math.random() * (ROLE_GUNNER_DMG_MAX - ROLE_GUNNER_DMG_MIN + 1));
        bullets.push({
          x: me.x + gdx / gl * (BALL_R + 4),
          y: me.y + gdy / gl * (BALL_R + 4),
          vx: gdx / gl * BULLET_SPEED,
          vy: gdy / gl * BULLET_SPEED,
          owner: p,
          color: me.color,
          dmg: gdmg,
          rico: 0,
          ricoMax: ROLE_GUNNER_RICO
        });
        cd[p] = ROLE_GUNNER_CD;
      }
    } else if (role === 'physicist') {
      // 物理学家：20 秒冷却结束后随机激活一种场域，场域自身持续 5 秒
      var physBall = balls[p];
      if (physBall.physPhase === 'active') {
        physBall.physT -= dt;
        if (physBall.physT <= 0) {
          physBall.physPhase = 'cooldown';
          physBall.physT = ROLE_PHYS_CD;
          physBall.physKind = 0;
        }
      } else if (physBall.physPhase === 'cooldown') {
        physBall.physT = Math.max(0, physBall.physT - dt);
        if (physBall.physT <= 0) {
          physBall.physKind = activatePhysField(p);
          physBall.physPhase = 'active';
          physBall.physT = ROLE_PHYS_DURATION;
        }
      }
    } else if (role === 'virus') {
      // 病毒：每 15 秒投放 2 个病毒罐（cd 由通用冷却驱动）
      if (cd[p] <= 0) {
        spawnVirusJars(p);
        cd[p] = ROLE_VIRUS_CD;
      }
    } else if (role === 'guard') {
      // 保安：无冷却，撞墙即在 handleGuardWallHit 里推进拉线状态，这里不需要做事
    }
  }

  for (var q = bullets.length - 1; q >= 0; q--) {
    var bl = bullets[q];
    bl.x += bl.vx;
    bl.y += bl.vy;
    if (bl.life != null) bl.life -= dt;
    // 撞墙反弹：反弹次数未耗尽则在场内反弹，耗尽才出界销毁
    var ricLim = bl.ricoMax != null ? bl.ricoMax : 0;
    if (bl.rico != null && bl.rico < ricLim) {
      var bL = ARENA.x + BULLET_R, bR = ARENA.x + ARENA.size - BULLET_R;
      var bT = ARENA.y + BULLET_R, bB = ARENA.y + ARENA.size - BULLET_R;
      if (bl.x < bL) { bl.x = bL; bl.vx = Math.abs(bl.vx); bl.rico++; }
      else if (bl.x > bR) { bl.x = bR; bl.vx = -Math.abs(bl.vx); bl.rico++; }
      if (bl.y < bT) { bl.y = bT; bl.vy = Math.abs(bl.vy); bl.rico++; }
      else if (bl.y > bB) { bl.y = bB; bl.vy = -Math.abs(bl.vy); bl.rico++; }
    }
    if (bl.rico != null && bl.rico >= ricLim) {
      // 反弹次数耗尽后按普通子弹处理出界
      if (bl.x < ARENA.x - BULLET_R || bl.x > ARENA.x + ARENA.size + BULLET_R ||
          bl.y < ARENA.y - BULLET_R || bl.y > ARENA.y + ARENA.size + BULLET_R) {
        bullets.splice(q, 1);
        continue;
      }
    }
    if (bl.life != null && bl.life <= 0) { bullets.splice(q, 1); continue; }
    if (bl.kind === 'heal') {
      var healTarget = balls[bl.healTarget];
      if (healTarget && hp[bl.healTarget] > 0 &&
          Math.hypot(bl.x - healTarget.x, bl.y - healTarget.y) < BALL_R + BULLET_R) {
        var oldHp = hp[bl.healTarget];
        hp[bl.healTarget] = Math.min(ROLES[selected[bl.healTarget]].maxHp,
          hp[bl.healTarget] + bl.heal);
        var restored = hp[bl.healTarget] - oldHp;
        if (restored > 0) {
          floatTexts.push({
            x: healTarget.x, y: healTarget.y - 22,
            text: '+' + formatMathNumber(restored), life: 1, color: '#67e8a5'
          });
          spawnParticles(healTarget.x, healTarget.y, '#67e8a5', 14);
          updateHUD();
        }
        bullets.splice(q, 1);
      }
      continue;
    }
    for (var targetIndex = 0; targetIndex < balls.length; targetIndex++) {
      if (teamOf(targetIndex) === teamOf(bl.owner) || hp[targetIndex] <= 0) continue;
      var target = balls[targetIndex];
      if (Math.hypot(bl.x - target.x, bl.y - target.y) < BALL_R + BULLET_R) {
        var dmg = bl.dmg != null ? bl.dmg : 12;
        dealDamage(targetIndex, dmg, bl.color, bl.x, bl.y, bl.owner);
        if (finished) return;
        target.vx += bl.vx * 0.12;
        target.vy += bl.vy * 0.12;
        bullets.splice(q, 1);
        break;
      }
    }
  }

  // 物理学家：电场伤害/吸弹、引力场推动、激光穿越判定
  // 放在子弹更新之后，激光才能用“这一帧的位移”判断是否穿过光线
  updatePhysFields(dt);
  if (finished) return;

  // 病毒：罐子触碰与三段延迟伤害
  updateVirus(dt);
  if (finished) return;

  // 保安：警戒线穿线判定（用上一帧位置 → 当前帧位置），然后刷新位置记录
  updateGuardLines();
  if (finished) return;
  rememberBallPositions();

  // BOSS 分裂者：回血与每 15 秒的全场分裂判定
  updateSplitters(dt);
  if (finished) return;

  for (var s = particles.length - 1; s >= 0; s--) {
    var pt = particles[s];
    pt.x += pt.vx; pt.y += pt.vy;
    pt.vx *= 0.94; pt.vy *= 0.94;
    pt.life -= dt * 2.5;
    if (pt.life <= 0) particles.splice(s, 1);
  }

  for (var f = floatTexts.length - 1; f >= 0; f--) {
    var ft = floatTexts[f];
    ft.y -= dt * 30;
    ft.life -= dt * 1.4;
    if (ft.life <= 0) floatTexts.splice(f, 1);
  }

  // ===== 舰长船锚：持续绕舰长旋转，钩住目标时排除普通球体碰撞 =====
  // BOSS 舰长³ 会有多个船锚，这里摊平成一张表逐个推进
  var allHooks = [];
  eachHook(function (hh) { allHooks.push(hh); });
  for (var hx = 0; hx < allHooks.length; hx++) {
    var h = allHooks[hx];
    if (!h) continue;
    var owner2 = balls[h.owner];
    if (!owner2 || hp[h.owner] <= 0) continue;
    if (h.released) {
      h.cd = Math.max(0, h.cd - dt);
      if (h.cd <= 0) {
        h.released = false;
        h.hooked = false;
        h.target = null;
        h.t = 0;
        h.hits = 0;
        h.ang = owner2.hookAngle != null ? owner2.hookAngle : h.ang;
        floatTexts.push({ x: owner2.x, y: owner2.y - 30, text: '船锚就绪', life: 0.9, color: owner2.color });
      } else {
        continue;
      }
    }
    h.ang += h.omega * dt;
    var anchorX = owner2.x + Math.cos(h.ang) * h.r;
    var anchorY = owner2.y + Math.sin(h.ang) * h.r;
    var leftEdge = ARENA.x + BALL_R;
    var rightEdge = ARENA.x + ARENA.size - BALL_R;
    var topEdge = ARENA.y + BALL_R;
    var bottomEdge = ARENA.y + ARENA.size - BALL_R;
    var hitWall = false;
    var hitLeft = anchorX < leftEdge;
    var hitRight = anchorX > rightEdge;
    var hitTop = anchorY < topEdge;
    var hitBottom = anchorY > bottomEdge;
    if (hitLeft || hitRight || hitTop || hitBottom) {
      var boundaryX = hitLeft ? leftEdge : rightEdge;
      var boundaryY = hitTop ? topEdge : bottomEdge;
      var resolved = false;
      var wallSide = null;
      if (hitLeft || hitRight) {
        var offsetX = boundaryX - owner2.x;
        var remainY = h.r * h.r - offsetX * offsetX;
        if (remainY >= 0) {
          var intersectionY = owner2.y +
            (Math.sin(h.ang) >= 0 ? 1 : -1) * Math.sqrt(remainY);
          if (intersectionY >= topEdge && intersectionY <= bottomEdge) {
            anchorX = boundaryX;
            anchorY = intersectionY;
            h.ang = Math.atan2(anchorY - owner2.y, anchorX - owner2.x);
            wallSide = hitLeft ? 'left' : 'right';
            resolved = true;
          }
        }
      }
      if (!resolved && (hitTop || hitBottom)) {
        var offsetY = boundaryY - owner2.y;
        var remainX = h.r * h.r - offsetY * offsetY;
        if (remainX >= 0) {
          var intersectionX = owner2.x +
            (Math.cos(h.ang) >= 0 ? 1 : -1) * Math.sqrt(remainX);
          if (intersectionX >= leftEdge && intersectionX <= rightEdge) {
            anchorX = intersectionX;
            anchorY = boundaryY;
            h.ang = Math.atan2(anchorY - owner2.y, anchorX - owner2.x);
            wallSide = hitTop ? 'top' : 'bottom';
            resolved = true;
          }
        }
      }
      if (!resolved) {
        anchorX = Math.max(leftEdge, Math.min(rightEdge, anchorX));
        anchorY = Math.max(topEdge, Math.min(bottomEdge, anchorY));
        h.ang = Math.atan2(anchorY - owner2.y, anchorX - owner2.x);
        wallSide = hitRight ? 'right' : hitLeft ? 'left' : hitBottom ? 'bottom' : 'top';
      }
      var direction = 0;
      if (wallSide === 'right') direction = Math.sign(Math.sin(h.ang));
