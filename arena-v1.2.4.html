/* ============ 工具 ============ */
function rand(a, b) { return a + Math.random() * (b - a); }
function shade(hex, amt) {
  var c = hex.replace('#', '');
  var r = parseInt(c.substr(0, 2), 16);
  var g = parseInt(c.substr(2, 2), 16);
  var b = parseInt(c.substr(4, 2), 16);
  r = Math.max(0, Math.min(255, r + r * amt));
  g = Math.max(0, Math.min(255, g + g * amt));
  b = Math.max(0, Math.min(255, b + b * amt));
  return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
}
function glowOf(hex) {
  var c = hex.replace('#', '');
  var r = parseInt(c.substr(0, 2), 16);
  var g = parseInt(c.substr(2, 2), 16);
  var bb = parseInt(c.substr(4, 2), 16);
  return 'rgba(' + r + ',' + g + ',' + bb + ',.5)';
}
function clampSpeed(b) {
  var sp = Math.hypot(b.vx, b.vy);
  if (sp > 0) {
    b.vx = b.vx / sp * BALL_SPEED;
    b.vy = b.vy / sp * BALL_SPEED;
  }
}
function activeBallCount() { return teamMode ? 4 : 2; }
function teamOf(index) { return teamMode ? index % 2 : index; }
function teammateOf(index) {
  return teamMode ? index + (index < 2 ? 2 : -2) : -1;
}
function findEnemy(owner) {
  var target = -1, closest = Infinity;
  for (var i = 0; i < balls.length; i++) {
    if (teamOf(i) === teamOf(owner) || hp[i] <= 0) continue;
    var distance = Math.hypot(balls[i].x - balls[owner].x, balls[i].y - balls[owner].y);
    if (distance < closest) { closest = distance; target = i; }
  }
  return target;
}
function isHookedBall(index) {
  for (var i = 0; i < hook.length; i++) {
    if (hook[i] && !hook[i].released && hook[i].hooked &&
        hook[i].target === index) return true;
  }
  return false;
}
function teamHealth(team) {
  var current = 0, maximum = 0;
  for (var i = 0; i < activeBallCount(); i++) {
    if (teamOf(i) !== team) continue;
    current += hp[i] || 0;
    maximum += ROLES[selected[i]].maxHp;
  }
  return { current: current, maximum: maximum };
}
function teamDefeated(team) {
  for (var i = 0; i < activeBallCount(); i++) {
    if (teamOf(i) === team && hp[i] > 0) return false;
  }
  return true;
}
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function spawnTarget(side) {
  var cx = ARENA.x + ARENA.size / 2;
  var cy = ARENA.y + ARENA.size / 2;
  var team = teamOf(side);
  var teammateOffset = teamMode ? (Math.floor(side / 2) === 0 ? -1 : 1) * ARENA.size * 0.14 : 0;
  return {
    x: cx + (team === 0 ? -1 : 1) * ARENA.size * 0.24,
    y: cy + teammateOffset + (Math.random() * 2 - 1) * ARENA.size * (teamMode ? 0.04 : 0.16)
  };
}
function mkBall(side) {
  var r = ROLES[selected[side]];
  var ball = { x: 0, y: 0, vx: 0, vy: 0, color: r.color, glow: glowOf(r.color) };
  if (r.role === 'hook') ball.hookAngle = Math.random() * Math.PI * 2;
  if (r.role === 'ghost') {
    ball.ghostPhase = 'cooldown';
    ball.ghostT = ROLE_GHOST_CD;
  } else if (r.role === 'medic') {
    ball.medicPhase = 'cooldown';
    ball.medicT = ROLE_MEDIC_CD;
    ball.medicDamage = 0;
  } else if (r.role === 'mathematician') {
    ball.mathPhase = 'cooldown';
    ball.mathT = ROLE_MATH_CD;
    ball.mathExpression = null;
  } else if (r.role === 'dynmath') {
    ball.dynmathPhase = 'cooldown';
    ball.dynmathT = ROLE_DYNMATH_CD;
    ball.dynmathExpression = null;
  }
  return ball;
}

/* ============ 身份列表 ============ */
function buildRoleList(slot) {
  var box = document.getElementById('roles' + slot);
  box.innerHTML = '';
  for (var idx = 0; idx < ROLES.length; idx++) {
    (function (idx) {
      var r = ROLES[idx];
      var btn = document.createElement('button');
      btn.className = 'role-btn' + (selected[slot] === idx ? ' selected' : '');
      btn.style.color = r.color;
      btn.innerHTML = '<span class="rdot"></span>'
                    + '<span class="rname">' + r.name + '</span>'
                    + '<span class="rdesc">' + r.desc + '</span>';
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (running || finished || (r.role === 'medic' && !teamMode)) return;
        selected[slot] = idx;
        if (balls[slot]) hp[slot] = ROLES[idx].maxHp;
        syncRolePickButtons();
        syncModeButton();
        syncTopNames();
        resetMatch();
        updateHUD();
        render();
      });
      box.appendChild(btn);
    })(idx);
  }
}
function syncRolePickButtons() {
  for (var slot = 0; slot < 4; slot++) {
    var btns = document.getElementById('roles' + slot).querySelectorAll('.role-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('selected', i === selected[slot]);
      btns[i].disabled = !teamMode && ROLES[i].role === 'medic';
    }
  }
}
function syncModeButton() {
  var restrictedRoleSelected =
    ROLES[selected[0]].role === 'medic' || ROLES[selected[1]].role === 'medic';
  modeBtn.disabled = restrictedRoleSelected;
  modeBtn.title = restrictedRoleSelected ?
    '1v1 不可使用医者，请先切换为其他角色' : '';
}
function syncTopNames() {
  for (var team = 0; team < 2; team++) {
    var roleColor = ROLES[selected[team]].color;
    var teamColor = team === 0 ? '#4fc3ff' : '#ff6b9d';
    var color = teamMode ? teamColor : roleColor;
    document.getElementById('pname' + team).textContent =
      teamMode ? (team === 0 ? '蓝方' : '粉方') : ROLES[selected[team]].name;
    document.getElementById('pname' + team).style.color = color;
    document.getElementById('hp' + team).style.background = color;
  }
  for (var i = 0; i < balls.length; i++) {
    var color = ROLES[selected[i]].color;
    balls[i].color = color;
    balls[i].glow = glowOf(color);
    if (ROLES[selected[i]].role === 'medic') {
      balls[i].medicPhase = 'cooldown';
      balls[i].medicT = ROLE_MEDIC_CD;
      balls[i].medicDamage = 0;
    } else if (ROLES[selected[i]].role === 'mathematician') {
      balls[i].mathPhase = 'cooldown';
      balls[i].mathT = ROLE_MATH_CD;
      balls[i].mathExpression = null;
    } else if (ROLES[selected[i]].role === 'dynmath') {
      balls[i].dynmathPhase = 'cooldown';
      balls[i].dynmathT = ROLE_DYNMATH_CD;
      balls[i].dynmathExpression = null;
    }
  }
}

/* ============ 对局控制 ============ */
function resetMatch() {
  var count = activeBallCount();
  balls = [];
  hp = [];
  cd = [];
  hook = [];
  gunBurst = [];
  bumpLock = [];
  previewPositions = [];
  var cy = ARENA.y + ARENA.size / 2;
  for (var i = 0; i < count; i++) {
    var ball = mkBall(i);
    var team = teamOf(i);
    var startY = cy + (teamMode ? (Math.floor(i / 2) === 0 ? -1 : 1) * ARENA.size * 0.14 : 0);
    ball.spawnFrom = { x: team === 0 ? ARENA.x - BALL_R - 8 : ARENA.x + ARENA.size + BALL_R + 8, y: startY };
    var target = spawnTarget(i);
    ball.x = target.x; ball.y = target.y;
    balls.push(ball);
    hp.push(ROLES[selected[i]].maxHp);
    cd.push(ROLES[selected[i]].role === 'dispatcher' ? ROLE_DISPATCHER_CD : 0);
    hook.push(null);
    gunBurst.push(null);
    bumpLock.push(0);
    previewPositions.push(target);
  }
  for (var hookOwner = 0; hookOwner < count; hookOwner++) {
    if (ROLES[selected[hookOwner]].role === 'hook') fireHook(hookOwner);
  }
  spawnT = 0;
  dynamites = [];
  trains = [];
  bullets = [];
  particles = [];
  floatTexts = [];
  finished = false;
  updateHUD();
}

/* ============ 技能 ============ */
// 通用伤害入口：被钩住期间无法受到角色技能以外的额外处理
function dealDamage(target, amount, srcColor, srcX, srcY, sourceIndex) {
  if (amount <= 0 || !balls[target] || hp[target] <= 0) return false;
  if (balls[target] && ROLES[selected[target]].role === 'ghost') {
    var ghost = balls[target];
    if (ghost.ghostPhase === 'warp') {
      amount *= 0.5;
      ghost.ghostDmg = (ghost.ghostDmg || 0) + amount;
    } else if (ghost.ghostPhase === 'ready') {
      ghost.ghostPhase = 'warp';
      ghost.ghostT = ROLE_GHOST_WARP;
      amount *= 0.5;
      ghost.ghostDmg = amount;
    }
  }
  var previousHp = hp[target];
  hp[target] = Math.max(0, hp[target] - amount);
  recordMedicDamage(sourceIndex, target, previousHp - hp[target]);
  spawnParticles(srcX, srcY, srcColor, 14);
  floatTexts.push({ x: balls[target].x, y: balls[target].y - 22, text: '-' + amount, life: 1, color: srcColor });
  flashHUD(target);
  updateHUD();
  if (teamDefeated(teamOf(target)) && !finished) endMatch(1 - teamOf(target));
  return true;
}

function recordMedicDamage(sourceIndex, targetIndex, damage) {
  if (!teamMode || sourceIndex == null || damage <= 0 ||
      teamOf(sourceIndex) === teamOf(targetIndex)) return;
  for (var i = 0; i < activeBallCount(); i++) {
    if (ROLES[selected[i]].role !== 'medic' ||
        teammateOf(i) !== sourceIndex || hp[i] <= 0) continue;
    var medic = balls[i];
    if (medic.medicPhase === 'ready') {
      medic.medicPhase = 'charge';
      medic.medicT = ROLE_MEDIC_CHARGE;
      medic.medicDamage = 0;
      floatTexts.push({ x: medic.x, y: medic.y - 28, text: '援护蓄力！', life: 1, color: medic.color });
    }
    if (medic.medicPhase === 'charge') medic.medicDamage += damage;
  }
}

function fireMedicBullet(owner) {
  var medic = balls[owner];
  var teammate = teammateOf(owner);
  var target = balls[teammate];
  var heal = medic.medicDamage * ROLE_MEDIC_HEAL;
  if (target && heal > 0) {
    var angle = Math.atan2(target.y - medic.y, target.x - medic.x);
    bullets.push({
      x: medic.x + Math.cos(angle) * (BALL_R + 4),
      y: medic.y + Math.sin(angle) * (BALL_R + 4),
      vx: Math.cos(angle) * BULLET_SPEED,
      vy: Math.sin(angle) * BULLET_SPEED,
      owner: owner,
      healTarget: teammate,
      kind: 'heal',
      color: '#67e8a5',
      heal: heal,
      rico: 0,
      ricoMax: ROLE_MEDIC_RICO
    });
  }
  medic.medicPhase = 'cooldown';
  medic.medicT = ROLE_MEDIC_CD;
  medic.medicDamage = 0;
}

function chooseMathOperator() {
  if (Math.random() < ROLE_MATH_POWER_CHANCE) return '**';
  return ['+', '-', '*', '/'][Math.floor(Math.random() * 4)];
}

function createMathExpression() {
  for (var attempt = 0; attempt < 100; attempt++) {
    var x1 = 1 + Math.floor(Math.random() * 10);
    var x2 = 1 + Math.floor(Math.random() * 10);
    var x3 = 1 + Math.floor(Math.random() * 10);
    var n1 = chooseMathOperator();
    var n2 = chooseMathOperator();
    var first;
    if (n1 === '+') first = x1 + x2;
    else if (n1 === '-') first = x1 - x2;
    else if (n1 === '*') first = x1 * x2;
    else if (n1 === '/') first = x1 / x2;
    else first = Math.max(-ROLE_MATH_POWER_LIMIT,
      Math.min(ROLE_MATH_POWER_LIMIT, Math.pow(x1, x2)));
    if (n2 === '/' && first === 0) continue;
    var result;
    if (n2 === '+') result = first + x3;
    else if (n2 === '-') result = first - x3;
    else if (n2 === '*') result = first * x3;
    else if (n2 === '/') result = first / x3;
    else result = Math.max(-ROLE_MATH_POWER_LIMIT,
      Math.min(ROLE_MATH_POWER_LIMIT, Math.pow(first, x3)));
    if (!Number.isFinite(result)) continue;
    return { x1: x1, x2: x2, x3: x3, n1: n1, n2: n2, result: result };
  }
  throw new Error('无法生成有效的数学家算式');
}

function formatMathNumber(value) {
  return Number.isInteger(value) ? String(value) : String(Number(value.toFixed(2)));
}

function mathExpressionText(expression) {
  if (!expression) return '';
  return '(' + expression.x1 + ' ' + expression.n1 + ' ' + expression.x2 + ') ' +
    expression.n2 + ' ' + expression.x3 + ' = ' + formatMathNumber(expression.result);
}

function fireMathBullet(owner) {
  var mathematician = balls[owner];
  var targetIndex = findEnemy(owner);
  if (targetIndex >= 0) {
    var target = balls[targetIndex];
    var angle = Math.atan2(target.y - mathematician.y, target.x - mathematician.x);
    bullets.push({
      x: mathematician.x + Math.cos(angle) * (BALL_R + 4),
      y: mathematician.y + Math.sin(angle) * (BALL_R + 4),
      vx: Math.cos(angle) * BULLET_SPEED,
      vy: Math.sin(angle) * BULLET_SPEED,
      owner: owner,
      color: mathematician.color,
      dmg: mathematician.mathExpression.result,
      rico: 0,
      ricoMax: ROLE_MATH_RICO
    });
  }
  floatTexts.push({
    x: mathematician.x, y: mathematician.y - 30,
    text: '算式结果 ' + formatMathNumber(mathematician.mathExpression.result),
    life: 1.2, color: mathematician.color
  });
  mathematician.mathPhase = 'cooldown';
  mathematician.mathT = ROLE_MATH_CD;
  mathematician.mathExpression = null;
}

// 爆破数学家系：蓄力结束后朝敌方掷出一枚“算式炸药”
// 角色表参数决定这一发的表现：
//   普通爆破数学家       → 伤害 = 算式结果，半径固定 120px，结果 ≤ 0 时不造成伤害
//   爆破数学家V2         → 伤害固定 40，半径 = 96 + 结果 × 0.2（限制 40~480px），结果只影响范围
// 引信/飞行速度两者都沿用爆破手。
function dynMathRadiusOf(role, result) {
  if (role && role.dynMathRadiusBase != null) {
    var raw = role.dynMathRadiusBase + result * role.dynMathRadiusScale;
    var minR = role.dynMathRadiusMin != null ? role.dynMathRadiusMin : 0;
    var maxR = role.dynMathRadiusMax != null ? role.dynMathRadiusMax : Infinity;
    return Math.max(minR, Math.min(maxR, raw));
  }
  return role && role.dynMathRadius != null ? role.dynMathRadius : ROLE_DYNMATH_RADIUS;
}

function dynMathDamageOf(role, result) {
  if (role && role.dynMathDamage != null) return role.dynMathDamage;
  return result;
}

function fireDynMathBomb(owner) {
  var role = ROLES[selected[owner]];
  var thrower = balls[owner];
  var expression = thrower.dynmathExpression;
  var result = expression ? expression.result : 0;
  var dmg = dynMathDamageOf(role, result);
  var radius = dynMathRadiusOf(role, result);
  var enemyIndex = findEnemy(owner);
  if (enemyIndex >= 0) {
    var enemy = balls[enemyIndex];
    var ang = Math.atan2(enemy.y - thrower.y, enemy.x - thrower.x) + rand(-0.35, 0.35);
    dynamites.push({
      owner: owner,
      x: thrower.x + Math.cos(ang) * (BALL_R + 6),
      y: thrower.y + Math.sin(ang) * (BALL_R + 6),
      vx: Math.cos(ang) * ROLE_DYNMATH_SPEED,
      vy: Math.sin(ang) * ROLE_DYNMATH_SPEED,
      fuse: ROLE_DYNMATH_FUSE,
      fuseMax: ROLE_DYNMATH_FUSE,
      r: 9,
      dmg: dmg > 0 ? dmg : 0,
      radius: radius,
      radiusFromFormula: role && role.dynMathRadiusBase != null,
      color: thrower.color,
      math: true
    });
  }
  floatTexts.push({
    x: thrower.x, y: thrower.y - 30,
    text: role && role.dynMathDamage != null
      ? formatMathNumber(dmg) + ' 伤 · 半径 ' + Math.round(radius) + 'px'
      : '算式炸弹 ' + formatMathNumber(dmg),
    life: 1.2, color: thrower.color
  });
  thrower.dynmathPhase = 'cooldown';
  thrower.dynmathT = ROLE_DYNMATH_CD;
  thrower.dynmathExpression = null;
}

// 炮手：向四周扇形齐射 8 枚
function fireGun(owner) {
  if (cd[owner] > 0) return;
  cd[owner] = ROLE_GUN_CD;
  var b = balls[owner];
  var dir = teamOf(owner) === 0 ? 1 : -1;
  var baseAng = Math.atan2(b.vy, b.vx);
  if (baseAng === 0 && b.vx === 0) baseAng = dir > 0 ? 0 : Math.PI;
  var start = baseAng - ROLE_GUN_SPREAD / 2;
  var step = ROLE_GUN_SPREAD / Math.max(1, ROLE_GUN_COUNT - 1);
  var fired = 0;
  for (var i = 0; i < ROLE_GUN_COUNT; i++) {
    var ang = start + step * i;
    bullets.push({
      x: b.x + Math.cos(ang) * (BALL_R + 4),
      y: b.y + Math.sin(ang) * (BALL_R + 4),
      vx: Math.cos(ang) * BULLET_SPEED,
      vy: Math.sin(ang) * BULLET_SPEED,
      owner: owner,
      color: b.color,
      dmg: ROLE_GUN_DMG,
      life: 2.6
    });
    fired++;
  }
  // 用齐射节奏呈现：记录已出膛数量，在 update 里逐发延迟实际激活
  gunBurst[owner] = { cd: 0, fired: 0, total: fired, ang0: start, step: step, baseAng: baseAng };
  // 上述 push 是一次全部入场的简版；改为逐发：先清空，由节奏补发
  bullets.splice(bullets.length - fired, fired);
  b.vx -= dir * 0.5;
}

// 舰长：船锚常驻绕舰长 121px 旋转，碰到敌人即钩中
function fireHook(owner) {
  var b = balls[owner];
  if (!b) return;
  if (hook[owner] && !hook[owner].released) return;
  if (hook[owner] && hook[owner].cd > 0) return;
  hook[owner] = {
    owner: owner,
    target: null,
    ang: (b.hookAngle != null ? b.hookAngle : Math.random() * Math.PI * 2),
    omega: (teamOf(owner) === 0 ? 1 : -1) * ROLE_HOOK_ORBIT_SPEED,
    r: ROLE_HOOK_ORBIT_RADIUS,
    released: false,
    cd: 0,
    hooked: false,
    hits: 0,
    t: 0,
    hitTimer: 0
  };
  b.hookAngle = hook[owner].ang;
  floatTexts.push({ x: b.x, y: b.y - 30, text: '船锚就绪', life: 0.9, color: b.color });
}

// 盾兵：本体贴脸一次 10 伤
function fireShield(owner) {
  if (cd[owner] > 0) return;
  cd[owner] = ROLE_SHIELD_CD;
  var target = findEnemy(owner);
  if (target < 0) return;
  var b = balls[owner], tb = balls[target];
  var dist = Math.hypot(tb.x - b.x, tb.y - b.y);
  if (dist > 0 && dist < BALL_R * 2 + 8) {
    var nx = (tb.x - b.x) / dist;
    var ny = (tb.y - b.y) / dist;
    dealDamage(target, ROLE_SHIELD_BUMP, b.color, b.x, b.y, owner);
    tb.vx += nx * 1.8;
    tb.vy += ny * 1.8;
    b.vx *= 0.92;
    b.vy *= 0.92;
    clampSpeed(tb);
    clampSpeed(b);
  }
}

// 统一技能触发入口（由 AI 按身份调用）
function trySkill(owner) {
  var role = ROLES[selected[owner]].role;
  if (hook[owner] && !hook[owner].released) return; // 旋转期间本人不主动开别的
  if (role === 'gun') fireGun(owner);
  else if (role === 'hook') fireHook(owner);
  else if (role === 'shield') fireShield(owner);
  else if (role === 'dynamite') fireDynamite(owner);
}


/* ============ 爆破手：炸药 ============ */
// 爆破手：向随机方向掷出一枚炸药
function fireDynamite(owner) {
  var b = balls[owner];
  var enemyIndex = findEnemy(owner);
  if (enemyIndex < 0) return;
  var enemy = balls[enemyIndex];
  var ang = Math.atan2(enemy.y - b.y, enemy.x - b.x) + rand(-0.35, 0.35);
  var sp = ROLE_DYN_SPEED;
  dynamites.push({
    owner: owner,
    x: b.x + Math.cos(ang) * (BALL_R + 6),
    y: b.y + Math.sin(ang) * (BALL_R + 6),
    vx: Math.cos(ang) * sp,
    vy: Math.sin(ang) * sp,
    fuse: ROLE_DYN_FUSE,
    fuseMax: ROLE_DYN_FUSE,
    r: 9
  });
  cd[owner] = (ROLES[selected[owner]] && ROLES[selected[owner]].cd) || ROLE_DYN_CD;
}

// 炸药飞行、引信倒计时、爆炸
function updateDynamites(dt) {
  for (var i = dynamites.length - 1; i >= 0; i--) {
    var d = dynamites[i];
    d.x += d.vx;
    d.y += d.vy;
    d.fuse -= dt;
    var inArena = d.x > ARENA.x && d.x < ARENA.x + ARENA.size
                && d.y > ARENA.y && d.y < ARENA.y + ARENA.size;
    if (d.fuse > 0 && inArena) continue;
    // 引信到时或飞出场地 → 爆炸
    var dynRole = ROLES[selected[d.owner]];
    // 单发炸药可自带伤害/半径/配色（爆破数学家的算式炸药），否则回落到角色表与常量
    var dynDmg = d.dmg != null ? d.dmg : ((dynRole && dynRole.dynDmg) || ROLE_DYN_DMG);
    var dynRadius = d.radius != null ? d.radius : ROLE_DYN_RADIUS;
    var dynColor = d.color || balls[d.owner].color;
    for (var opp = 0; opp < balls.length; opp++) {
      if (teamOf(opp) === teamOf(d.owner) || hp[opp] <= 0) continue;
      var dist = Math.hypot(balls[opp].x - d.x, balls[opp].y - d.y);
      if (dynDmg > 0 && dist <= dynRadius) {
        dealDamage(opp, dynDmg, dynColor, d.x, d.y, d.owner);
      }
      if (finished) break;
    }
    // 爆炸视觉：环形粒子 + 伤害飘字
    for (var k = 0; k < 34; k++) {
      var a = (k / 34) * Math.PI * 2;
      particles.push({
        x: d.x, y: d.y,
        vx: Math.cos(a) * rand(2.2, 5.4),
        vy: Math.sin(a) * rand(2.2, 5.4),
        life: rand(0.4, 0.9), maxLife: 0.9,
        color: k % 3 === 0 ? '#fff3c4' : (k % 3 === 1 ? '#ffb347' : dynColor),
        size: rand(2, 5)
      });
    }
    floatTexts.push({
      x: d.x, y: d.y - 10,
      text: dynDmg > 0 ? formatMathNumber(dynDmg) : '0',
      life: 0.9, color: d.math ? dynColor : '#ff8a3d'
    });
    dynamites.splice(i, 1);
  }
}

function summonTrains(owner) {
  var ownerRole = ROLES[selected[owner]];
  var trainLength = ownerRole.trainLength || ROLE_TRAIN_LENGTH;
  var laneInset = ROLE_TRAIN_WIDTH / 2 + BALL_R;
  var verticalLane1 = rand(ARENA.x + laneInset, ARENA.x + ARENA.size / 2 - laneInset);
  var verticalLane2 = rand(ARENA.x + ARENA.size / 2 + laneInset, ARENA.x + ARENA.size - laneInset);
  var horizontalLane1 = rand(ARENA.y + laneInset, ARENA.y + ARENA.size / 2 - laneInset);
  var horizontalLane2 = rand(ARENA.y + ARENA.size / 2 + laneInset, ARENA.y + ARENA.size - laneInset);
  trains.push(
    {
      owner: owner, hit: new Array(balls.length).fill(false),
      width: ROLE_TRAIN_WIDTH, length: trainLength,
      axis: 'vertical', x: verticalLane1,
      y: ARENA.y - trainLength / 2,
      vy: ROLE_TRAIN_SPEED
    },
    {
      owner: owner, hit: new Array(balls.length).fill(false),
      width: ROLE_TRAIN_WIDTH, length: trainLength,
      axis: 'vertical', x: verticalLane2,
      y: ARENA.y - trainLength / 2,
      vy: ROLE_TRAIN_SPEED
    },
    {
      owner: owner, hit: new Array(balls.length).fill(false),
      width: ROLE_TRAIN_WIDTH, length: trainLength,
      axis: 'horizontal', x: ARENA.x - trainLength / 2,
      y: horizontalLane1,
      vx: ROLE_TRAIN_SPEED
    },
    {
      owner: owner, hit: new Array(balls.length).fill(false),
      width: ROLE_TRAIN_WIDTH, length: trainLength,
      axis: 'horizontal', x: ARENA.x - trainLength / 2,
      y: horizontalLane2,
      vx: ROLE_TRAIN_SPEED
    }
  );
  floatTexts.push({
    x: ARENA.x + ARENA.size / 2,
    y: ARENA.y + 30,
    text: '列车进站！',
    life: 1.2,
    color: ROLES[selected[owner]].color
  });
}

function updateTrains(dt) {
  var pixelsPerFrame = dt * 60;
  var left = ARENA.x, right = ARENA.x + ARENA.size;
  var top = ARENA.y, bottom = ARENA.y + ARENA.size;

  for (var i = trains.length - 1; i >= 0; i--) {
    var train = trains[i];
    train.x += (train.vx || 0) * pixelsPerFrame;
    train.y += (train.vy || 0) * pixelsPerFrame;

    if (train.axis === 'vertical' &&
        train.y - train.length / 2 > bottom) {
      trains.splice(i, 1);
      continue;
    }
    if (train.axis === 'horizontal' &&
        train.x - train.length / 2 > right) {
      trains.splice(i, 1);
      continue;
    }

    for (var ballIndex = 0; ballIndex < balls.length; ballIndex++) {
      if (hp[ballIndex] <= 0) continue;
      var ball = balls[ballIndex];
      var firstHit = !train.hit[ballIndex];
      var halfWidth = train.width / 2;
      var halfLength = train.length / 2;
      var closestX = Math.max(train.x - halfLength,
        Math.min(ball.x, train.x + halfLength));
      var closestY = Math.max(train.y - halfWidth,
        Math.min(ball.y, train.y + halfWidth));
      if (train.axis === 'vertical') {
        closestX = Math.max(train.x - halfWidth,
          Math.min(ball.x, train.x + halfWidth));
        closestY = Math.max(train.y - halfLength,
          Math.min(ball.y, train.y + halfLength));
      }

      var dx = ball.x - closestX;
      var dy = ball.y - closestY;
      var distance = Math.hypot(dx, dy);
      if (distance > BALL_R) {
        train.hit[ballIndex] = false;
        continue;
      }

      var nx, ny;
      if (distance > 0) {
        nx = dx / distance;
        ny = dy / distance;
      } else {
        var offsetX = ball.x - train.x;
        var offsetY = ball.y - train.y;
        var penetrationX = (train.axis === 'vertical' ? halfWidth : halfLength) - Math.abs(offsetX);
        var penetrationY = (train.axis === 'vertical' ? halfLength : halfWidth) - Math.abs(offsetY);
        if (penetrationX < penetrationY) {
          nx = offsetX < 0 ? -1 : 1;
          ny = 0;
        } else {
          nx = 0;
          ny = offsetY < 0 ? -1 : 1;
        }
      }

      var trainVx = train.vx || 0;
      var trainVy = train.vy || 0;
      var relativeVn = (ball.vx - trainVx) * nx + (ball.vy - trainVy) * ny;
      if (relativeVn < 0) {
        ball.vx -= 2 * relativeVn * nx;
        ball.vy -= 2 * relativeVn * ny;
      }
      if (distance > 0) {
        var pushOut = BALL_R - distance + 0.5;
        ball.x += nx * pushOut;
        ball.y += ny * pushOut;
      } else {
        if (nx !== 0) {
          ball.x = train.x + nx *
            ((train.axis === 'vertical' ? halfWidth : halfLength) + BALL_R + 0.5);
        } else {
          ball.y = train.y + ny *
            ((train.axis === 'vertical' ? halfLength : halfWidth) + BALL_R + 0.5);
        }
      }
      if (firstHit) {
        train.hit[ballIndex] = true;
        if (teamOf(ballIndex) !== teamOf(train.owner)) {
          var ownerRole = ROLES[selected[train.owner]];
          var damage = ownerRole.trainDmgMin +
            Math.floor(Math.random() * (ownerRole.trainDmgMax - ownerRole.trainDmgMin + 1));
          dealDamage(ballIndex, damage,
            ROLES[selected[train.owner]].color, ball.x, ball.y, train.owner);
          if (finished) return;
        }
        spawnParticles(ball.x, ball.y, ROLES[selected[train.owner]].color, 10);
        floatTexts.push({
          x: ball.x,
          y: ball.y - BALL_R - 8,
          text: teamOf(ballIndex) === teamOf(train.owner) ? '反弹' : '-' + damage,
          life: 0.8,
          color: ROLES[selected[train.owner]].color
        });
      }
    }
  }
}

// 盾兵贴脸伤害锁逐帧衰减
function decayLocks(dt) {
  for (var i = 0; i < bumpLock.length; i++) {
    if (bumpLock[i] > 0) bumpLock[i] = Math.max(0, bumpLock[i] - dt);
  }
}

/* ============ 特效 ============ */
function spawnParticles(x, y, color, n) {
  for (var i = 0; i < n; i++) {
    var a = rand(0, Math.PI * 2);
    var sp = rand(1, 4);
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1, color: color
    });
  }
}

/* ============ 更新逻辑 ============ */
function update(dt) {
  if (!running) {
    previewT += dt;
    // 待机位在 resetMatch() 里固定好，这里只叠加平滑的浮动，避免每帧归位导致抖动
    var ph = Math.sin(previewT * 2.2) * 6;
    for (var i = 0; i < balls.length; i++) {
      balls[i].x = previewPositions[i].x;
      balls[i].y = previewPositions[i].y + (i % 2 === 0 ? ph : -ph);
    }
    return;
  }

  var left = ARENA.x + BALL_R;
  var right = ARENA.x + ARENA.size - BALL_R;
  var top = ARENA.y + BALL_R;
  var bottom = ARENA.y + ARENA.size - BALL_R;

  if (spawnT < 1) {
    spawnT = Math.min(1, spawnT + dt * 1.6);
    var k = easeOutCubic(spawnT);
    for (var i = 0; i < balls.length; i++) {
      var tg = previewPositions[i];
      balls[i].x = balls[i].spawnFrom.x + (tg.x - balls[i].spawnFrom.x) * k;
      balls[i].y = balls[i].spawnFrom.y + (tg.y - balls[i].spawnFrom.y) * k;
    }
    if (spawnT >= 1) {
      for (var j = 0; j < balls.length; j++) {
        var tg2 = previewPositions[j];
        balls[j].x = tg2.x;
        balls[j].y = tg2.y;
        // 单位向量 * BALL_SPEED，保证合速度正好等于 BALL_SPEED，
        // 开局第一帧不被 clampSpeed 修正方向
        var sp = (teamOf(j) === 0 ? 0 : Math.PI) + (Math.random() - 0.5) * 0.6;
        balls[j].vx = Math.cos(sp) * BALL_SPEED;
        balls[j].vy = Math.sin(sp) * BALL_SPEED;
      }
    }
    updateDynamites(dt);
  if (finished) return;
  decayLocks(dt);
  collideBalls();
  return;
  }

  for (var m = 0; m < balls.length; m++) {
    if (hp[m] <= 0) continue;
    var b = balls[m];
    // 钩中目标的位置由钩子逻辑独占控制（锚点坐标即球心），
    // 这里一旦再叠加 vx/vy，锚体就会相对球心漂出——必须跳过。
    if (isHookedBall(m)) continue;
    b.x += b.vx;
    b.y += b.vy;
    var hitWall = false;
    if (b.x < left)  { b.x = left;  b.vx = Math.abs(b.vx);  hitWall = true; }
    if (b.x > right) { b.x = right; b.vx = -Math.abs(b.vx); hitWall = true; }
    if (b.y < top)    { b.y = top;    b.vy = Math.abs(b.vy); hitWall = true; }
    if (b.y > bottom) { b.y = bottom; b.vy = -Math.abs(b.vy); hitWall = true; }
    // 吸血鬼：撞墙后随机新方向，表现为"碰墙乱弹"，且不瞬移（用当前位置重算方向）
    if (hitWall && ROLES[selected[m]].role === 'vampire') {
      var va = Math.random() * Math.PI * 2;
      var spd = BALL_SPEED * (0.85 + Math.random() * 0.15);
      b.vx = Math.cos(va) * spd;
      b.vy = Math.sin(va) * spd;
    }
    clampSpeed(b);
  }

  updateDynamites(dt);
  if (finished) return;
  decayLocks(dt);
  collideBalls();
  if (finished) return;

  for (var n = 0; n < balls.length; n++) {
    cd[n] = Math.max(0, cd[n] - dt);
    if (bumpLock[n] > 0) bumpLock[n] = Math.max(0, bumpLock[n] - dt);
  }
  updateTrains(dt);
  if (finished) return;

  for (var p = 0; p < balls.length; p++) {
    if (hp[p] <= 0) continue;
    var role = ROLES[selected[p]].role;
    if (role === 'gun') {
      // 炮手：冷却到 0 就齐射，开火后重置冷却
      if (cd[p] <= 0) fireGun(p);
    } else if (role === 'hook') {
      if (!hook[p]) fireHook(p);
    } else if (role === 'shield') {
      // 盾兵：贴脸时按冷却撞击，平时不主动开技能
      if (cd[p] <= 0) fireShield(p);
    } else if (role === 'vampire') {
      // 吸血鬼：乱弹不追踪。仅在撞墙/碰敌时才重随机（见 collideBalls / 边界反弹），
      // 不在每帧以概率触发，否则会表现为"中间抽一下瞬移"。
      clampSpeed(balls[p], BALL_SPEED);
    } else if (role === 'dynamite') {
      // 爆破手：冷却到 0 即向随机方向投掷一枚炸药
      if (cd[p] <= 0) fireDynamite(p);
    } else if (role === 'dispatcher') {
      if (cd[p] <= 0) {
        summonTrains(p);
        cd[p] = ROLE_DISPATCHER_CD;
      }
    } else if (role === 'cowboy') {
      var cb = balls[p];
      // 齐射进行中：逐发射出，期间自身持续停止移动
      if (cb.cowboyIdx != null && cb.cowboyIdx < ROLE_COWBOY_SHOTS) {
        cb.cowboyNext -= dt;
        if (cb.cowboyNext <= 0) {
          var cowboyTarget = findEnemy(p);
          if (cowboyTarget < 0) continue;
          var cdx = balls[cowboyTarget].x - cb.x, cdy = balls[cowboyTarget].y - cb.y;
          var cang = Math.atan2(cdy, cdx); // 每发重新瞄准
          var cdmg = ROLE_COWBOY_DMG_MIN + Math.floor(Math.random() * (ROLE_COWBOY_DMG_MAX - ROLE_COWBOY_DMG_MIN + 1));
          bullets.push({
            x: cb.x + Math.cos(cang) * (BALL_R + 4),
            y: cb.y + Math.sin(cang) * (BALL_R + 4),
            vx: Math.cos(cang) * BULLET_SPEED,
            vy: Math.sin(cang) * BULLET_SPEED,
            owner: p,
            color: cb.color,
            dmg: cdmg,
            rico: 0,
            ricoMax: ROLE_COWBOY_RICO
          });
          cb.cowboyIdx++;
          cb.cowboyNext += cb.cowboyPause;
        }
        cb.vx = 0; cb.vy = 0;
        continue;
      } else if (cb.cowboyIdx != null) {
        // 6 发全部射完，恢复乱弹
        cb.cowboyIdx = null; cb.cowboyNext = 0;
      }
      // 非齐射期间：持续乱弹，与其他 keep 型角色一致
      if (cb.cowboyIdx == null) {
        if (Math.random() < dt * 1.5) {
          var ra = Math.random() * Math.PI * 2;
          cb.vx = Math.cos(ra) * BALL_SPEED;
          cb.vy = Math.sin(ra) * BALL_SPEED;
        }
        clampSpeed(cb, BALL_SPEED);
      }
      // 冷却到 0：开始一轮齐射
      if (cd[p] <= 0) {
        cd[p] = ROLE_COWBOY_CD;
        cb.cowboyIdx = 0;
        cb.cowboyNext = 2.5;           // 首发延迟，使齐射中点对齐 10 秒周期
        cb.cowboyPause = 0.3;          // 每 0.3 秒一发
        cb.vx = 0; cb.vy = 0;
      }
    } else if (role === 'ghost') {
      var g = balls[p];
      var phase = g.ghostPhase || 'cooldown';
      var gt = g.ghostT != null ? g.ghostT : 0;
      if (phase === 'cooldown') {
        gt = Math.max(0, gt - dt);
        if (gt <= 0) phase = 'ready';
      } else if (phase === 'warp') {
        gt -= dt;
        if (gt <= 0) {
          var gd = Math.max(0, g.ghostDmg || 0) * ROLE_GHOST_RETURN;
          g.ghostDmg = 0;
          if (gd > 0) {
            var ghostTarget = findEnemy(p);
            if (ghostTarget < 0) break;
            var eg = balls[ghostTarget];
            var gdx = eg.x - g.x, gdy = eg.y - g.y;
            var gang = Math.atan2(gdy, gdx);
            bullets.push({
              x: g.x + Math.cos(gang) * (BALL_R + 4),
              y: g.y + Math.sin(gang) * (BALL_R + 4),
              vx: Math.cos(gang) * BULLET_SPEED,
              vy: Math.sin(gang) * BULLET_SPEED,
              owner: p,
              color: g.color,
              dmg: gd,
              rico: 0,
              ricoMax: ROLE_GHOST_RICO
            });
          }
          phase = 'cooldown';
          gt = ROLE_GHOST_CD;
        }
      }
      g.ghostPhase = phase; g.ghostT = gt;
      // 幽灵保持当前方向移动，仅在碰墙时反弹。
      if (phase !== 'warp') {
        clampSpeed(g, BALL_SPEED);
      }
    } else if (role === 'medic') {
      var medic = balls[p];
      if (medic.medicPhase === 'cooldown') {
        medic.medicT = Math.max(0, medic.medicT - dt);
        if (medic.medicT <= 0) medic.medicPhase = 'ready';
      } else if (medic.medicPhase === 'charge') {
        medic.medicT -= dt;
        if (medic.medicT <= 0) fireMedicBullet(p);
      }
    } else if (role === 'mathematician') {
      var mathematician = balls[p];
      if (mathematician.mathPhase === 'cooldown') {
        mathematician.mathT = Math.max(0, mathematician.mathT - dt);
        if (mathematician.mathT <= 0) {
          mathematician.mathPhase = 'charge';
          mathematician.mathT = ROLE_MATH_CHARGE;
          mathematician.mathExpression = createMathExpression();
        }
      } else if (mathematician.mathPhase === 'charge') {
        mathematician.mathT -= dt;
        if (mathematician.mathT <= 0) fireMathBullet(p);
      }
    } else if (role === 'dynmath') {
      // 爆破数学家：15 秒冷却 → 5 秒算式蓄力 → 掷出算式炸药
      var dynMathBall = balls[p];
      if (dynMathBall.dynmathPhase === 'cooldown') {
        dynMathBall.dynmathT = Math.max(0, dynMathBall.dynmathT - dt);
        if (dynMathBall.dynmathT <= 0) {
          dynMathBall.dynmathPhase = 'charge';
          dynMathBall.dynmathT = ROLE_DYNMATH_CHARGE;
          dynMathBall.dynmathExpression = createMathExpression();
          floatTexts.push({
            x: dynMathBall.x, y: dynMathBall.y - 30,
            text: mathExpressionText(dynMathBall.dynmathExpression),
            life: 1.4, color: dynMathBall.color
          });
        }
      } else if (dynMathBall.dynmathPhase === 'charge') {
        dynMathBall.dynmathT -= dt;
        if (dynMathBall.dynmathT <= 0) fireDynMathBomb(p);
      }
    } else if (role === 'gunner') {
      // 枪手：每 5 秒朝敌方发射一发可反弹子弹
      if (cd[p] <= 0) {
        var enemyIndex = findEnemy(p);
        if (enemyIndex < 0) continue;
        var enemy = balls[enemyIndex];
        var me = balls[p];
        var gdx = enemy.x - me.x, gdy = enemy.y - me.y;
        var gl = Math.hypot(gdx, gdy) || 1;
        var gdmg = ROLE_GUNNER_DMG_MIN + Math.floor(Math.random() * (ROLE_GUNNER_DMG_MAX - ROLE_GUNNER_DMG_MIN + 1));
        bullets.push({
          x: me.x + gdx / gl * (BALL_R + 4),
          y: me.y + gdy / gl * (BALL_R + 4),
          vx: gdx / gl * BULLET_SPEED,
          vy: gdy / gl * BULLET_SPEED,
          owner: p,
          color: me.color,
          dmg: gdmg,
          rico: 0,
          ricoMax: ROLE_GUNNER_RICO
        });
        cd[p] = ROLE_GUNNER_CD;
      }
    }
  }

  // 炮手齐射逐发补发
  for (var g = 0; g < balls.length; g++) {
    var gb = gunBurst[g];
    if (!gb) continue;
    if (gb.fired >= gb.total) { gunBurst[g] = null; continue; }
    gb.cd -= dt;
    while (gb.cd <= 0 && gb.fired < gb.total) {
      var ang = gb.ang0 + gb.step * gb.fired;
      var b2 = balls[g];
      bullets.push({
        x: b2.x + Math.cos(ang) * (BALL_R + 4),
        y: b2.y + Math.sin(ang) * (BALL_R + 4),
        vx: Math.cos(ang) * BULLET_SPEED,
        vy: Math.sin(ang) * BULLET_SPEED,
        owner: g,
        color: b2.color,
        dmg: ROLE_GUN_DMG,
        life: 2.6
      });
      gb.fired++;
      gb.cd += ROLE_GUN_BURST;
    }
  }

  for (var q = bullets.length - 1; q >= 0; q--) {
    var bl = bullets[q];
    bl.x += bl.vx;
    bl.y += bl.vy;
    if (bl.life != null) bl.life -= dt;
    // 撞墙反弹：反弹次数未耗尽则在场内反弹，耗尽才出界销毁
    var ricLim = bl.ricoMax != null ? bl.ricoMax : 0;
    if (bl.rico != null && bl.rico < ricLim) {
      var bL = ARENA.x + BULLET_R, bR = ARENA.x + ARENA.size - BULLET_R;
      var bT = ARENA.y + BULLET_R, bB = ARENA.y + ARENA.size - BULLET_R;
      if (bl.x < bL) { bl.x = bL; bl.vx = Math.abs(bl.vx); bl.rico++; }
      else if (bl.x > bR) { bl.x = bR; bl.vx = -Math.abs(bl.vx); bl.rico++; }
      if (bl.y < bT) { bl.y = bT; bl.vy = Math.abs(bl.vy); bl.rico++; }
      else if (bl.y > bB) { bl.y = bB; bl.vy = -Math.abs(bl.vy); bl.rico++; }
    }
    if (bl.rico != null && bl.rico >= ricLim) {
      // 反弹次数耗尽后按普通子弹处理出界
      if (bl.x < ARENA.x - BULLET_R || bl.x > ARENA.x + ARENA.size + BULLET_R ||
          bl.y < ARENA.y - BULLET_R || bl.y > ARENA.y + ARENA.size + BULLET_R) {
        bullets.splice(q, 1);
        continue;
      }
    }
    if (bl.life != null && bl.life <= 0) { bullets.splice(q, 1); continue; }
    if (bl.kind === 'heal') {
      var healTarget = balls[bl.healTarget];
      if (healTarget && hp[bl.healTarget] > 0 &&
          Math.hypot(bl.x - healTarget.x, bl.y - healTarget.y) < BALL_R + BULLET_R) {
        var oldHp = hp[bl.healTarget];
        hp[bl.healTarget] = Math.min(ROLES[selected[bl.healTarget]].maxHp,
          hp[bl.healTarget] + bl.heal);
        var restored = hp[bl.healTarget] - oldHp;
        if (restored > 0) {
          floatTexts.push({
            x: healTarget.x, y: healTarget.y - 22,
            text: '+' + formatMathNumber(restored), life: 1, color: '#67e8a5'
          });
          spawnParticles(healTarget.x, healTarget.y, '#67e8a5', 14);
          updateHUD();
        }
        bullets.splice(q, 1);
      }
      continue;
    }
    for (var targetIndex = 0; targetIndex < balls.length; targetIndex++) {
      if (teamOf(targetIndex) === teamOf(bl.owner) || hp[targetIndex] <= 0) continue;
      var target = balls[targetIndex];
      if (Math.hypot(bl.x - target.x, bl.y - target.y) < BALL_R + BULLET_R) {
        var dmg = bl.dmg != null ? bl.dmg : 12;
        dealDamage(targetIndex, dmg, bl.color, bl.x, bl.y, bl.owner);
        if (finished) return;
        target.vx += bl.vx * 0.12;
        target.vy += bl.vy * 0.12;
        bullets.splice(q, 1);
        break;
      }
    }
  }

  for (var s = particles.length - 1; s >= 0; s--) {
    var pt = particles[s];
    pt.x += pt.vx; pt.y += pt.vy;
    pt.vx *= 0.94; pt.vy *= 0.94;
    pt.life -= dt * 2.5;
    if (pt.life <= 0) particles.splice(s, 1);
  }

  for (var f = floatTexts.length - 1; f >= 0; f--) {
    var ft = floatTexts[f];
    ft.y -= dt * 30;
    ft.life -= dt * 1.4;
    if (ft.life <= 0) floatTexts.splice(f, 1);
  }

  // ===== 舰长船锚：持续绕舰长旋转，钩住目标时排除普通球体碰撞 =====
  for (var hx = 0; hx < hook.length; hx++) {
    var h = hook[hx];
    if (!h) continue;
    var owner2 = balls[h.owner];
    if (!owner2 || hp[h.owner] <= 0) continue;
    if (h.released) {
      h.cd = Math.max(0, h.cd - dt);
      if (h.cd <= 0) {
        h.released = false;
        h.hooked = false;
        h.target = null;
        h.t = 0;
        h.hits = 0;
        h.ang = owner2.hookAngle != null ? owner2.hookAngle : h.ang;
        floatTexts.push({ x: owner2.x, y: owner2.y - 30, text: '船锚就绪', life: 0.9, color: owner2.color });
      } else {
        continue;
      }
    }
    h.ang += h.omega * dt;
    var anchorX = owner2.x + Math.cos(h.ang) * h.r;
    var anchorY = owner2.y + Math.sin(h.ang) * h.r;
    var leftEdge = ARENA.x + BALL_R;
    var rightEdge = ARENA.x + ARENA.size - BALL_R;
    var topEdge = ARENA.y + BALL_R;
    var bottomEdge = ARENA.y + ARENA.size - BALL_R;
    var hitWall = false;
    var hitLeft = anchorX < leftEdge;
    var hitRight = anchorX > rightEdge;
    var hitTop = anchorY < topEdge;
    var hitBottom = anchorY > bottomEdge;
    if (hitLeft || hitRight || hitTop || hitBottom) {
      var boundaryX = hitLeft ? leftEdge : rightEdge;
      var boundaryY = hitTop ? topEdge : bottomEdge;
      var resolved = false;
      var wallSide = null;
      if (hitLeft || hitRight) {
        var offsetX = boundaryX - owner2.x;
        var remainY = h.r * h.r - offsetX * offsetX;
        if (remainY >= 0) {
          var intersectionY = owner2.y +
            (Math.sin(h.ang) >= 0 ? 1 : -1) * Math.sqrt(remainY);
          if (intersectionY >= topEdge && intersectionY <= bottomEdge) {
            anchorX = boundaryX;
            anchorY = intersectionY;
            h.ang = Math.atan2(anchorY - owner2.y, anchorX - owner2.x);
            wallSide = hitLeft ? 'left' : 'right';
            resolved = true;
          }
        }
      }
      if (!resolved && (hitTop || hitBottom)) {
        var offsetY = boundaryY - owner2.y;
        var remainX = h.r * h.r - offsetY * offsetY;
        if (remainX >= 0) {
          var intersectionX = owner2.x +
            (Math.cos(h.ang) >= 0 ? 1 : -1) * Math.sqrt(remainX);
          if (intersectionX >= leftEdge && intersectionX <= rightEdge) {
            anchorX = intersectionX;
            anchorY = boundaryY;
            h.ang = Math.atan2(anchorY - owner2.y, anchorX - owner2.x);
            wallSide = hitTop ? 'top' : 'bottom';
            resolved = true;
          }
        }
      }
      if (!resolved) {
        anchorX = Math.max(leftEdge, Math.min(rightEdge, anchorX));
        anchorY = Math.max(topEdge, Math.min(bottomEdge, anchorY));
        h.ang = Math.atan2(anchorY - owner2.y, anchorX - owner2.x);
        wallSide = hitRight ? 'right' : hitLeft ? 'left' : hitBottom ? 'bottom' : 'top';
      }
      var direction = 0;
      if (wallSide === 'right') direction = Math.sign(Math.sin(h.ang));
      else if (wallSide === 'left') direction = -Math.sign(Math.sin(h.ang));
      else if (wallSide === 'top') direction = Math.sign(Math.cos(h.ang));
      else if (wallSide === 'bottom') direction = -Math.sign(Math.cos(h.ang));
      h.omega = (direction || -Math.sign(h.omega)) * Math.abs(h.omega);
      hitWall = true;
    }
    owner2.hookX = anchorX;
    owner2.hookY = anchorY;
    var justReleased = false;
    if (h.hooked && h.target != null && hp[h.target] > 0) {
      var target2 = balls[h.target];
      target2.x = anchorX;
      target2.y = anchorY;
      target2.vx = 0;
      target2.vy = 0;
      h.t += dt;
      if (hitWall) {
        var wallDmg = ROLE_HOOK_DMG_MIN +
          Math.floor(Math.random() * (ROLE_HOOK_DMG_MAX - ROLE_HOOK_DMG_MIN + 1));
        dealDamage(h.target, wallDmg, owner2.color, anchorX, anchorY, h.owner);
        spawnParticles(anchorX, anchorY, '#ffffff', 18);
        floatTexts.push({
          x: anchorX, y: anchorY - 30,
          text: '撞墙 -' + wallDmg, life: 0.9, color: '#ffffff'
        });
        h.hits++;
        if (finished) return;
      }
      if (h.hits >= ROLE_HOOK_HITS || h.t >= ROLE_HOOK_SPIN) {
        var releasedTarget = target2;
        h.released = true;
        h.cd = ROLE_HOOK_COOLDOWN;
        h.target = null;
        h.hooked = false;
        h.t = 0;
        justReleased = true;
        var releaseAng = Math.atan2(releasedTarget.y - owner2.y, releasedTarget.x - owner2.x);
        releasedTarget.vx = Math.cos(releaseAng) * BALL_SPEED * 0.8;
        releasedTarget.vy = Math.sin(releaseAng) * BALL_SPEED * 0.8;
        clampSpeed(releasedTarget);
        floatTexts.push({
          x: owner2.x, y: owner2.y - 30,
          text: (h.hits >= ROLE_HOOK_HITS ? '挣脱！' : '释放！') +
            '冷却 ' + ROLE_HOOK_COOLDOWN + 's',
          life: 1.2, color: owner2.color
        });
      }
    } else if (h.hooked) {
      h.target = null;
      h.hooked = false;
      h.t = 0;
    }
    if (!h.released && !h.hooked && !justReleased) {
      var enemyIndex = findEnemy(h.owner);
      if (enemyIndex >= 0) {
        var enemy = balls[enemyIndex];
        var dx = enemy.x - anchorX;
        var dy = enemy.y - anchorY;
        if (Math.hypot(dx, dy) <= ROLE_HOOK_COLLISION_RADIUS) {
          h.target = enemyIndex;
          h.hooked = true;
          h.t = 0;
          var dmg = ROLE_HOOK_DMG_MIN + Math.floor(Math.random() * (ROLE_HOOK_DMG_MAX - ROLE_HOOK_DMG_MIN + 1));
          dealDamage(enemyIndex, dmg, owner2.color, anchorX, anchorY, h.owner);
          if (finished) return;
          floatTexts.push({ x: enemy.x, y: enemy.y - 30, text: '钩中！', life: 1.1, color: owner2.color });
        }
      }
    }
    owner2.hookAngle = h.ang;
  }
}

function collideBalls() {
  for (var i = 0; i < balls.length; i++) {
    for (var j = i + 1; j < balls.length; j++) {
      if (hp[i] <= 0 || hp[j] <= 0) continue;
      if (isHookedBall(i) || isHookedBall(j)) continue;
      var a = balls[i], b = balls[j];
      var dx = b.x - a.x, dy = b.y - a.y;
      var d = Math.hypot(dx, dy);
      if (d === 0 || d > BALL_R * 2) continue;
      var overlap = (BALL_R * 2 - d) / 2;
      var nx = dx / d, ny = dy / d;
      a.x -= nx * overlap; a.y -= ny * overlap;
      b.x += nx * overlap; b.y += ny * overlap;
      var dvx = b.vx - a.vx, dvy = b.vy - a.vy;
      var sep = dvx * nx + dvy * ny;
      if (sep > 0) continue;
      a.vx += sep * nx; a.vy += sep * ny;
      b.vx -= sep * nx; b.vy -= sep * ny;
      clampSpeed(a);
      clampSpeed(b);
      spawnParticles(a.x + nx * BALL_R, a.y + ny * BALL_R, a.color, 6);
      spawnParticles(b.x - nx * BALL_R, b.y - ny * BALL_R, b.color, 6);

      if (teamOf(i) === teamOf(j)) continue;
      for (var attackerOffset = 0; attackerOffset < 2; attackerOffset++) {
        var attacker = attackerOffset === 0 ? i : j;
        var target = attackerOffset === 0 ? j : i;
        var attackerRole = ROLES[selected[attacker]].role;
        if (bumpLock[attacker] > 0) continue;
        if (attackerRole === 'shield') {
          dealDamage(target, ROLE_SHIELD_BUMP, balls[attacker].color,
            balls[attacker].x, balls[attacker].y, attacker);
          bumpLock[attacker] = 0.4;
        } else if (attackerRole === 'vampire') {
          var damage = ROLE_VAMPIRE_DMG_MIN +
            Math.floor(Math.random() * (ROLE_VAMPIRE_DMG_MAX - ROLE_VAMPIRE_DMG_MIN + 1));
          dealDamage(target, damage, balls[attacker].color,
            balls[attacker].x, balls[attacker].y, attacker);
          hp[attacker] = Math.min(ROLES[selected[attacker]].maxHp, hp[attacker] + damage);
          floatTexts.push({
            x: balls[attacker].x, y: balls[attacker].y - 22,
            text: '+' + damage, life: 1, color: '#ff2d6f'
          });
          spawnParticles(balls[attacker].x, balls[attacker].y, '#ff2d6f', 12);
          bumpLock[attacker] = ROLE_VAMPIRE_LOCK;
          var angle = Math.random() * Math.PI * 2;
          var speed = BALL_SPEED * (0.85 + Math.random() * 0.15);
          balls[attacker].vx = Math.cos(angle) * speed;
          balls[attacker].vy = Math.sin(angle) * speed;
        }
        if (finished) return;
      }
    }
  }
}

/* ============ 绘制 ============ */
function drawBackground() {
  ctx.fillStyle = '#0b1020';
  ctx.fillRect(0, 0, W, H);
  var cx = ARENA.x + ARENA.size / 2;
  var cy = ARENA.y + ARENA.size / 2;
  var g = ctx.createRadialGradient(cx, cy, 50, cx, cy, ARENA.size * 0.7);
  g.addColorStop(0, 'rgba(79,195,255,.06)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(ARENA.x, ARENA.y, ARENA.size, ARENA.size);
  ctx.strokeStyle = 'rgba(255,255,255,.045)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var x = ARENA.x; x <= ARENA.x + ARENA.size; x += 40) {
    ctx.moveTo(x, ARENA.y); ctx.lineTo(x, ARENA.y + ARENA.size);
  }
  for (var y = ARENA.y; y <= ARENA.y + ARENA.size; y += 40) {
    ctx.moveTo(ARENA.x, y); ctx.lineTo(ARENA.x + ARENA.size, y);
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.08)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx, ARENA.y + 10); ctx.lineTo(cx, ARENA.y + ARENA.size - 10);
  ctx.moveTo(ARENA.x + 10, cy); ctx.lineTo(ARENA.x + ARENA.size - 10, cy);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.12)';
  ctx.beginPath();
  ctx.arc(cx, cy, 30, 0, Math.PI * 2);
  ctx.stroke();
}

function drawArena() {
  ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(79,195,255,.5)';
  ctx.shadowBlur = 18;
  ctx.strokeStyle = 'rgba(120,180,255,.9)';
  ctx.lineWidth = ARENA.thickness;
  ctx.strokeRect(ARENA.x, ARENA.y, ARENA.size, ARENA.size);
  ctx.shadowBlur = 0;
}

function drawBall(b, index) {
  // 队徽按“队伍”判定，而不是按球对象身份：
  // 1v1 时 teamOf(0)=0、teamOf(1)=1；2v2 时 0/2 号是蓝方、1/3 号是粉方，
  // 这样两个同队小球外观一致，不会出现“蓝 2 号被当成粉方”的情况。
  var pos = index != null ? index : balls.indexOf(b);
  var isBlue = teamOf(pos) === 0;
  ctx.beginPath();
  ctx.arc(b.x, b.y, BALL_R + 8, 0, Math.PI * 2);
  var g = ctx.createRadialGradient(b.x, b.y, BALL_R, b.x, b.y, BALL_R + 8);
  g.addColorStop(0, b.glow);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
  var lg = ctx.createLinearGradient(b.x - BALL_R, b.y - BALL_R, b.x + BALL_R, b.y + BALL_R);
  lg.addColorStop(0, '#ffffff');
  lg.addColorStop(0.35, b.color);
  lg.addColorStop(1, shade(b.color, -0.35));
  ctx.fillStyle = lg;
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = isBlue ? 'rgba(255,255,255,.9)' : 'rgba(0,0,0,.35)';
  ctx.stroke();
  // 队徽：蓝方为三角，粉方为菱形，一眼区分
  ctx.beginPath();
  if (isBlue) {
    ctx.moveTo(b.x, b.y - 6);
    ctx.lineTo(b.x - 5.5, b.y + 3.5);
    ctx.lineTo(b.x + 5.5, b.y + 3.5);
  } else {
    ctx.moveTo(b.x, b.y - 6);
    ctx.lineTo(b.x + 6, b.y);
    ctx.lineTo(b.x, b.y + 6);
    ctx.lineTo(b.x - 6, b.y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.fill();
}


function drawDynamites() {
  for (var i = 0; i < dynamites.length; i++) {
    var d = dynamites[i];
    var t = 1 - d.fuse / d.fuseMax;   // 0 → 1，引信越短越亮
    // 爆炸范围预览圈：爆破手系与算式炸药共用，半径取该发炸药的爆炸半径（默认 120px）
    // 引信越短圈越亮；飞行中就能看出这一发会波及到哪
    var rangeRadius = d.radius != null ? d.radius : ROLE_DYN_RADIUS;
    var rangeColor = d.color ||
      (balls[d.owner] && balls[d.owner].color) || '#ff8a3d';
    ctx.beginPath();
    ctx.arc(d.x, d.y, rangeRadius, 0, Math.PI * 2);
    ctx.strokeStyle = rangeColor;
    ctx.globalAlpha = d.math ? (0.22 + 0.18 * t) : (0.13 + 0.17 * t);
    ctx.lineWidth = d.math ? 2 : 1.5;
    ctx.setLineDash([6, 8]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    // 半径由算式决定的版本（爆破数学家V2）：在圈底标出这一发的实际半径
    if (d.radiusFromFormula) {
      var radiusLabelY = Math.min(d.y + rangeRadius + 12, ARENA.y + ARENA.size - 4);
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = rangeColor;
      ctx.globalAlpha = 0.9;
      ctx.fillText(Math.round(rangeRadius) + 'px', d.x, radiusLabelY);
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }
    // 引信火花
    ctx.beginPath();
    ctx.arc(d.x, d.y - d.r - 4, 2.4, 0, Math.PI * 2);
    ctx.fillStyle = '#fff3c4';
    ctx.shadowColor = '#ffb347';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
    // 药体
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    var grd = ctx.createRadialGradient(d.x - 3, d.y - 3, 1, d.x, d.y, d.r);
    if (d.math) {
      grd.addColorStop(0, '#ffd9fb');
      grd.addColorStop(1, '#6b2a86');
    } else {
      grd.addColorStop(0, '#ffd28a');
      grd.addColorStop(1, '#c1440a');
    }
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = d.math ? '#3d1152' : '#7a2c06';
    ctx.stroke();
    // 算式炸药：药体上标出这一发将造成的伤害
    if (d.math) {
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(formatMathNumber(d.dmg || 0), d.x, d.y + 3.5);
      ctx.textAlign = 'left';
    }
    // 倒计时环（引信进度）
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r + 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * t);
    ctx.strokeStyle = t > 0.66 ? '#ff4d2e' : '#ffb347';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function drawTrains() {
  if (!trains.length) return;
  ctx.save();
  ctx.beginPath();
  ctx.rect(ARENA.x, ARENA.y, ARENA.size, ARENA.size);
  ctx.clip();

  for (var i = 0; i < trains.length; i++) {
    var train = trains[i];
    var color = ROLES[selected[train.owner]].color;
    ctx.save();
    ctx.translate(train.x, train.y);
    if (train.axis === 'vertical') ctx.rotate(Math.PI / 2);

    ctx.shadowColor = color;
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#20283b';
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(-train.length / 2, -train.width / 2, train.length, train.width, 7);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = color;
    ctx.fillRect(-train.length / 2 + 8, -train.width / 2 + 6, 20, train.width - 12);
    ctx.fillRect(train.length / 2 - 28, -train.width / 2 + 6, 20, train.width - 12);
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (var windowX = -train.length / 2 + 38;
         windowX < train.length / 2 - 34;
         windowX += 32) {
      ctx.fillRect(windowX, -train.width / 2 + 6, 22, train.width - 12);
    }

    ctx.fillStyle = '#161b29';
    for (var wheel = -2; wheel <= 2; wheel++) {
      ctx.beginPath();
      ctx.arc(wheel * 34, train.width / 2 - 1, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();
}

function drawBullets() {
  for (var i = 0; i < bullets.length; i++) {
    var bl = bullets[i];
    ctx.beginPath();
    ctx.arc(bl.x, bl.y, BULLET_R + 5, 0, Math.PI * 2);
    var g = ctx.createRadialGradient(bl.x, bl.y, 1, bl.x, bl.y, BULLET_R + 5);
    g.addColorStop(0, bl.color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(bl.x, bl.y, BULLET_R, 0, Math.PI * 2);
    ctx.fillStyle = bl.kind === 'heal' ? '#67e8a5' : '#fff';
    ctx.fill();
    if (bl.kind === 'heal') {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(bl.x - 3, bl.y);
      ctx.lineTo(bl.x + 3, bl.y);
      ctx.moveTo(bl.x, bl.y - 3);
      ctx.lineTo(bl.x, bl.y + 3);
      ctx.stroke();
    }
  }
}

function drawParticles() {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5 * p.life + 0.5, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloatTexts() {
  ctx.textAlign = 'center';
  ctx.font = 'bold 18px sans-serif';
  for (var i = 0; i < floatTexts.length; i++) {
    var f = floatTexts[i];
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

// 舰长同款技能可视化：球顶双环
// 外环 = 冷却 / 技能持续时长（灰底 + 主色填充，满环=刚释放）
// 内环 = 当前效果剩余时长（彩色高亮，带脉冲发光）
function drawSkillRing(b) {
  var p = balls.indexOf(b);
  if (p < 0) return;
  var role = ROLES[selected[p]].role;
  var cx = b.x, cy = b.y - BALL_R - 16;
  var coolFrac = 0, coolMax = 0, coolColor = '#4fc3ff', coolLabel = '';
  var actFrac = 0, actMax = 0, actColor = '#ffd54a', actLabel = '', actGlow = false;

  if (role === 'hook') {
    var h = hook[p];
    if (h && h.released && h.cd > 0) {
      coolFrac = h.cd / ROLE_HOOK_COOLDOWN; coolMax = ROLE_HOOK_COOLDOWN;
      coolColor = '#ff8a65'; coolLabel = h.cd.toFixed(1) + 's';
    } else if (h && !h.released && h.hooked) {
      coolFrac = h.t / ROLE_HOOK_SPIN; coolMax = ROLE_HOOK_SPIN;
      coolColor = '#1f9ea8'; coolLabel = h.t.toFixed(1) + 's';
    }
  } else if (role === 'gun') {
    if (cd[p] > 0) {
      coolFrac = cd[p] / ROLE_GUN_CD; coolMax = ROLE_GUN_CD;
      coolColor = '#ffb74d'; coolLabel = cd[p].toFixed(1) + 's';
    }
  } else if (role === 'dispatcher') {
    if (cd[p] > 0) {
      coolFrac = cd[p] / ROLE_DISPATCHER_CD; coolMax = ROLE_DISPATCHER_CD;
      coolColor = '#ffd166'; coolLabel = cd[p].toFixed(1) + 's';
    }
  } else if (role === 'dynamite') {
    if (cd[p] > 0) {
      coolMax = ROLES[selected[p]].cd || 10; coolFrac = cd[p] / coolMax;
      coolColor = '#ff7043'; coolLabel = cd[p].toFixed(1) + 's';
    }
  } else if (role === 'cowboy') {
    if (b.cowboyIdx != null && b.cowboyIdx < ROLE_COWBOY_SHOTS) {
      actMax = ROLE_COWBOY_PAUSE; actFrac = 1 - Math.max(0, b.cowboyNext) / actMax;
      actColor = '#ff7043'; actLabel = (b.cowboyIdx + 1) + '/' + ROLE_COWBOY_SHOTS; actGlow = true;
    }
    if (cd[p] > 0) {
      coolFrac = cd[p] / ROLE_COWBOY_CD; coolMax = ROLE_COWBOY_CD;
      coolColor = '#ff7043'; coolLabel = cd[p].toFixed(1) + 's';
    }
  } else if (role === 'gunner') {
    if (cd[p] > 0) {
      coolFrac = cd[p] / ROLE_GUNNER_CD; coolMax = ROLE_GUNNER_CD;
      coolColor = '#4fc3ff'; coolLabel = cd[p].toFixed(1) + 's';
    }
  } else if (role === 'ghost') {
    var gp = b.ghostPhase || 'cooldown', gt = b.ghostT || 0;
    if (gp === 'warp') {
      actMax = ROLE_GHOST_WARP; actFrac = gt / actMax;
      actColor = '#b388ff'; actLabel = gt.toFixed(1) + 's'; actGlow = true;
    }
    if (gp === 'cooldown') {
      coolMax = ROLE_GHOST_CD; coolFrac = gt / coolMax;
      coolColor = '#b388ff'; coolLabel = gt.toFixed(1) + 's';
    } else if (gp === 'ready') {
      coolMax = ROLE_GHOST_CD; coolFrac = 0;
      coolColor = '#9be7ff'; coolLabel = '受击';
    }
  } else if (role === 'medic') {
    if (b.medicPhase === 'cooldown') {
      coolMax = ROLE_MEDIC_CD; coolFrac = b.medicT / coolMax;
      coolColor = '#67e8a5'; coolLabel = b.medicT.toFixed(1) + 's';
    } else if (b.medicPhase === 'ready') {
      coolMax = ROLE_MEDIC_CD; coolColor = '#67e8a5'; coolLabel = '待触发';
    } else if (b.medicPhase === 'charge') {
      actMax = ROLE_MEDIC_CHARGE;
      actFrac = 1 - Math.max(0, b.medicT) / actMax;
      actColor = '#67e8a5'; actLabel = b.medicT.toFixed(1) + 's'; actGlow = true;
    }
  } else if (role === 'mathematician') {
    if (b.mathPhase === 'cooldown') {
      coolMax = ROLE_MATH_CD; coolFrac = b.mathT / coolMax;
      coolColor = '#f0d66d'; coolLabel = b.mathT.toFixed(1) + 's';
    } else if (b.mathPhase === 'charge') {
      actMax = ROLE_MATH_CHARGE;
      actFrac = 1 - Math.max(0, b.mathT) / actMax;
      actColor = '#f0d66d'; actLabel = b.mathT.toFixed(1) + 's'; actGlow = true;
    }
  } else if (role === 'dynmath') {
    if (b.dynmathPhase === 'cooldown') {
      coolMax = ROLE_DYNMATH_CD; coolFrac = b.dynmathT / coolMax;
      coolColor = ROLES[selected[p]].color; coolLabel = b.dynmathT.toFixed(1) + 's';
    } else if (b.dynmathPhase === 'charge') {
      actMax = ROLE_DYNMATH_CHARGE;
      actFrac = 1 - Math.max(0, b.dynmathT) / actMax;
      actColor = ROLES[selected[p]].color; actLabel = b.dynmathT.toFixed(1) + 's'; actGlow = true;
    }
  }
  if (!coolMax && !actMax) return;

  var R1 = 9, R2 = 6, lw1 = 2.6, lw2 = 2.4, start = -Math.PI / 2;

  if (coolMax) {
    ctx.beginPath();
    ctx.arc(cx, cy, R1, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.lineWidth = lw1;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, R1, start, start + Math.PI * 2 * Math.min(1, Math.max(0, coolFrac)));
    ctx.strokeStyle = coolColor;
    ctx.lineWidth = lw1;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.lineCap = 'butt';
  }
  if (actMax) {
    if (actGlow) {
      ctx.beginPath();
      ctx.arc(cx, cy, R2 - 3, 0, Math.PI * 2);
      ctx.fillStyle = actColor;
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(globalTime * 6);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.beginPath();
    ctx.arc(cx, cy, R2, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.lineWidth = lw2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, R2, start, start + Math.PI * 2 * Math.min(1, Math.max(0, actFrac)));
    ctx.strokeStyle = actColor;
    ctx.lineWidth = lw2;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.lineCap = 'butt';
  }
  if (coolLabel || actLabel) {
    ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = actLabel ? actColor : coolColor;
    ctx.fillText(actLabel || coolLabel, cx, cy + 3.2);
    ctx.textAlign = 'left';
  }
}

// 血量条下的技能文字标签：复刻 drawHUD 中 drawBar 的样式
function drawSkillLabel(b, x, y, main, sub) {
  if (main == null || main === '') return;
  ctx.save();
  ctx.font = 'bold 12px sans-serif';
  var w = ctx.measureText(String(main)).width + 12;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(13,16,24,.75)';
  ctx.beginPath();
  ctx.rect(x - w / 2 - 4, y - 12, w + 8, 16);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.2)';
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.fillText(main, x, y - 1);
  if (sub) {
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,.65)';
    ctx.fillText(sub, x + w / 2 + 6, y - 1);
  }
  ctx.restore();
}

// 根据角色与技能状态生成标签文字
function getSkillLabel(b) {
  var p = balls.indexOf(b);
  if (p < 0) return null;
  var role = ROLES[selected[p]].role, main = null, sub = null;
  if (role === 'hook') {
    var h = hook[p];
    if (h && h.released && h.cd > 0) { main = h.cd.toFixed(1) + 's'; sub = '船锚冷却'; }
    else if (h && !h.released && h.hooked) { main = h.t.toFixed(1) + 's'; sub = '被钩住'; }
    else if (h && !h.released) { main = '旋转中'; sub = '船锚'; }
  } else if (role === 'gun') {
    if (cd[p] > 0) { main = cd[p].toFixed(1) + 's'; sub = '点射'; }
    else { main = '就绪'; sub = '点射'; }
  } else if (role === 'gunner') {
    if (cd[p] > 0) { main = cd[p].toFixed(1) + 's'; sub = '点射'; }
    else { main = '就绪'; sub = '点射'; }
  } else if (role === 'dispatcher') {
    if (cd[p] > 0) { main = cd[p].toFixed(1) + 's'; sub = '列车调度'; }
    else { main = '就绪'; sub = '列车调度'; }
  } else if (role === 'dynamite') {
    if (cd[p] > 0) { main = cd[p].toFixed(1) + 's'; sub = '炸弹'; }
    else { main = '就绪'; sub = '炸弹'; }
  } else if (role === 'cowboy') {
    if (cd[p] > 0) { main = cd[p].toFixed(1) + 's'; sub = '齐射'; }
    else { main = '就绪'; sub = '齐射'; }
  } else if (role === 'cannon') {
    if (cd[p] > 0) { main = cd[p].toFixed(1) + 's'; sub = '蓄力'; }
    else { main = '就绪'; sub = '蓄力'; }
  } else if (role === 'ghost') {
    var gp = b.ghostPhase || 'cooldown', gt = b.ghostT || 0;
    if (gp === 'warp') { main = gt.toFixed(1) + 's'; sub = '减伤反击'; }
    else if (gp === 'ready') { main = '受击触发'; sub = '技能就绪'; }
    else { main = gt.toFixed(1) + 's'; sub = '技能冷却'; }
  } else if (role === 'medic') {
    if (b.medicPhase === 'cooldown') { main = b.medicT.toFixed(1) + 's'; sub = '援护冷却'; }
    else if (b.medicPhase === 'ready') { main = '等待队友'; sub = '造成伤害'; }
    else if (b.medicPhase === 'charge') {
      main = b.medicT.toFixed(1) + 's';
      sub = '治疗 ' + formatMathNumber(b.medicDamage * ROLE_MEDIC_HEAL);
    }
  } else if (role === 'mathematician') {
    if (b.mathPhase === 'cooldown') { main = b.mathT.toFixed(1) + 's'; sub = '算式冷却'; }
    else if (b.mathPhase === 'charge') {
      main = mathExpressionText(b.mathExpression);
      sub = '蓄力 ' + b.mathT.toFixed(1) + 's';
    }
  } else if (role === 'dynmath') {
    if (b.dynmathPhase === 'cooldown') { main = b.dynmathT.toFixed(1) + 's'; sub = '算式炸弹冷却'; }
    else if (b.dynmathPhase === 'charge') {
      main = mathExpressionText(b.dynmathExpression);
      sub = '蓄力 ' + b.dynmathT.toFixed(1) + 's';
    }
  }
  if (main) return { main: main, sub: sub };
  return null;
}

function render() {
  drawBackground();
  drawArena();
  drawTrains();
  for (var i = 0; i < balls.length; i++) {
    if (hp[i] > 0) drawBall(balls[i], i);
  }
  drawHooks();
  drawDynamites();
  drawBullets();
  for (var i = 0; i < balls.length; i++) {
    if (hp[i] > 0) drawSkillRing(balls[i]);
  }
  drawParticles();
  drawFloatTexts();
}

// 舰长船锚与钩索
// 船锚锚体：主环+外发光+四根辐条+方向箭头
// 可在舰长常驻轨道与钩中锚体两处共用，color 决定主环颜色
function drawAnchor(color) {
  var R = 13;
  // 外发光
  ctx.beginPath();
  ctx.arc(0, 0, R + 6, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(31,158,168,.35)';
  ctx.lineWidth = 4;
  ctx.stroke();
  // 锚体主环
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.strokeStyle = color || '#1f9ea8';
  ctx.lineWidth = 3.5;
  ctx.stroke();
  // 十字锚臂
  ctx.beginPath();
  ctx.moveTo(-R, 0); ctx.lineTo(R, 0);
  ctx.moveTo(0, -R); ctx.lineTo(0, R);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  // 锚尖小三角（指向旋转方向）
  ctx.beginPath();
  ctx.moveTo(R + 2, -3);
  ctx.lineTo(R + 9, 0);
  ctx.lineTo(R + 2, 3);
  ctx.closePath();
  ctx.fillStyle = '#ffd54a';
  ctx.fill();
}

function drawHooks() {
  for (var i = 0; i < hook.length; i++) {
    var h = hook[i];
    if (!h) continue;
    var owner = balls[h.owner];
    if (!owner || hp[h.owner] <= 0) continue;
    if (h.released) {
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('冷却 ' + h.cd.toFixed(1) + 's', owner.x, owner.y - BALL_R - 14);
      ctx.textAlign = 'left';
      continue;
    }
    var anchorX = owner.hookX != null ?
      owner.hookX : owner.x + Math.cos(h.ang) * h.r;
    var anchorY = owner.hookY != null ?
      owner.hookY : owner.y + Math.sin(h.ang) * h.r;
    if (h.hooked && h.target != null && hp[h.target] > 0) {
      ctx.beginPath();
      ctx.moveTo(owner.x, owner.y);
      ctx.lineTo(anchorX, anchorY);
      ctx.strokeStyle = 'rgba(255,255,255,.65)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff5b6e';
      ctx.fillText('被钩住', balls[h.target].x, balls[h.target].y - BALL_R - 14);
      ctx.textAlign = 'left';
    }
    ctx.save();
    ctx.translate(anchorX, anchorY);
    ctx.rotate(h.ang);
    drawAnchor(owner.color);
    ctx.restore();
  }
}

/* ============ 主循环 ============ */
function loop(ts) {
  if (!running) return;
  if (!lastTime) lastTime = ts;
  var dt = Math.min(0.05, (ts - lastTime) / 1000);
  lastTime = ts;
  globalTime += dt;
  update(dt);
  updateHUD();
  render();
  rafId = requestAnimationFrame(loop);
}

/* ============ HUD ============ */
function updateHUD() {
  document.getElementById('topbar').classList.toggle('team-mode', teamMode);
  for (var i = 0; i < 4; i++) {
    var row = document.getElementById('ballHpRow' + i);
    var isActive = i < activeBallCount();
    row.style.display = isActive ? 'block' : 'none';
    if (!isActive) continue;
    var role = ROLES[selected[i]];
    var maximum = role.maxHp;
    var current = Math.max(0, hp[i] || 0);
    var ratio = maximum > 0 ? current / maximum : 0;
    document.getElementById('ballHpName' + i).textContent =
      role.name + (teamMode ? ' · ' + (Math.floor(i / 2) + 1) + '号' : '');
    var number = document.getElementById('ballHpNum' + i);
    number.textContent = Math.ceil(current) + ' / ' + maximum;
    number.style.color = ratio <= 0.3 ? '#ff6b6b' : '#c7cee0';
    var fill = document.getElementById('ballHp' + i);
    fill.style.width = Math.max(0, ratio * 100) + '%';
    fill.style.background = role.color;
  }
  for (var team = 0; team < 2; team++) {
    var health = teamHealth(team);
    var ratio = health.maximum > 0 ? health.current / health.maximum : 0;
    document.getElementById('hp' + team).style.width = Math.max(0, ratio * 100) + '%';
    document.getElementById('hpNum' + team).textContent =
      Math.ceil(health.current) + ' / ' + health.maximum;
    document.getElementById('hpNum' + team).style.color =
      ratio <= 0.3 ? '#ff6b6b' : '#c7cee0';
    var skillTexts = [];
    for (var i = 0; i < balls.length; i++) {
      if (teamOf(i) !== team) continue;
      var role = ROLES[selected[i]];
      var state = skillStateText(i, role);
      skillTexts.push((teamMode ? (Math.floor(i / 2) + 1) + '号 ' : '') +
        (hp[i] <= 0 ? role.name + ' 已淘汰' :
          role.skillName + (state ? ' · ' + state : '')));
    }
    document.getElementById('skill' + team).textContent = skillTexts.join(' | ');
  }
}

// HP 进度条下方：各角色技能剩余时间文字
function skillStateText(p, r) {
  var role = r.role;
  if (role === 'hook') {
    if (hook[p] && hook[p].released && hook[p].cd > 0) return '船锚冷却 ' + hook[p].cd.toFixed(1) + 's';
    if (hook[p] && hook[p].hooked) return '钩中 ' + Math.max(0, ROLE_HOOK_SPIN - hook[p].t).toFixed(1) + 's';
    if (hook[p]) return '旋转中';
  } else if (role === 'gun') {
    if (cd[p] > 0) return '冷却 ' + cd[p].toFixed(1) + 's';
  } else if (role === 'gunner') {
    if (cd[p] > 0) return '冷却 ' + cd[p].toFixed(1) + 's';
  } else if (role === 'dispatcher') {
    if (cd[p] > 0) return '列车冷却 ' + cd[p].toFixed(1) + 's';
  } else if (role === 'dynamite') {
    if (cd[p] > 0) return '炸药冷却 ' + cd[p].toFixed(1) + 's';
  } else if (role === 'cowboy') {
    if (balls[p] && balls[p].cowboyIdx != null && balls[p].cowboyIdx < ROLE_COWBOY_SHOTS)
      return '齐射 ' + (balls[p].cowboyIdx + 1) + '/' + ROLE_COWBOY_SHOTS;
    if (cd[p] > 0) return '齐射冷却 ' + cd[p].toFixed(1) + 's';
  } else if (role === 'cannon') {
    if (cd[p] > 0) return '蓄力冷却 ' + cd[p].toFixed(1) + 's';
  } else if (role === 'vampire') {
    return 'HP ' + Math.ceil(hp[p]) + '/' + r.maxHp + ' · 吸血中';
  } else if (role === 'ghost') {
    var gp = balls[p] && balls[p].ghostPhase, gt = balls[p] ? balls[p].ghostT || 0 : 0;
    if (gp === 'warp') return '减伤反击 ' + gt.toFixed(1) + 's';
    if (gp === 'ready') return '受击触发技能';
    if (gp === 'cooldown') return '技能冷却 ' + gt.toFixed(1) + 's';
  } else if (role === 'medic') {
    var medic = balls[p];
    if (medic.medicPhase === 'cooldown') return '援护冷却 ' + medic.medicT.toFixed(1) + 's';
    if (medic.medicPhase === 'ready') return '等待队友造成伤害';
    if (medic.medicPhase === 'charge')
      return '治疗蓄力 ' + medic.medicT.toFixed(1) + 's · ' +
        formatMathNumber(medic.medicDamage * ROLE_MEDIC_HEAL);
  } else if (role === 'mathematician') {
    var mathBall = balls[p];
    if (mathBall.mathPhase === 'cooldown') return '算式冷却 ' + mathBall.mathT.toFixed(1) + 's';
    if (mathBall.mathPhase === 'charge')
      return mathExpressionText(mathBall.mathExpression) + ' · ' +
        mathBall.mathT.toFixed(1) + 's';
  } else if (role === 'dynmath') {
    var dynMathState = balls[p];
    if (dynMathState.dynmathPhase === 'cooldown') return '算式炸弹冷却 ' + dynMathState.dynmathT.toFixed(1) + 's';
    if (dynMathState.dynmathPhase === 'charge') {
      var dynMathInfo = mathExpressionText(dynMathState.dynmathExpression) + ' · 蓄力 ' +
        dynMathState.dynmathT.toFixed(1) + 's';
      // V2：伤害固定，算式只决定爆炸半径，蓄力期间就把半径预告出来
      if (r.dynMathRadiusBase != null && dynMathState.dynmathExpression) {
        dynMathInfo += ' · ' + Math.round(dynMathDamageOf(r, 0)) + ' 伤 / 半径 ' +
          Math.round(dynMathRadiusOf(r, dynMathState.dynmathExpression.result)) + 'px';
      }
      return dynMathInfo;
    }
  }
  return '';
}

function flashHUD(side) {
  var el = document.querySelectorAll('.player')[teamOf(side)];
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}

/* ============ 面板控制 ============ */
var overlay = document.getElementById('overlay');
var ctrlBar = document.getElementById('ctrlBar');
var ctrlBtn = document.getElementById('ctrlBtn');

function hideRolePanels(hide) {
  var el = document.getElementById('rolePanels');
  if (!el) return;
  el.classList.toggle('hide', hide);
}

function syncCtrlBtn() {
  if (running) {
    ctrlBtn.textContent = '终止对局';
    ctrlBtn.className = 'stop';
  } else {
    ctrlBtn.textContent = '开始';
    ctrlBtn.className = 'start';
  }
}

/* ============ 开始 / 终止 / 结束 ============ */
function startMatch() {
  resetMatch();
  overlay.classList.add('hidden');
  hideRolePanels(true);
  ctrlBar.classList.remove('hidden');
  running = true;
  finished = false;
  lastTime = 0;
  syncCtrlBtn();
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

function terminateMatch() {
  running = false;
  finished = false;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  resetMatch();
  syncTopNames();
  updateHUD();
  render();
  hideRolePanels(false);
  syncCtrlBtn();
}

function toggleMatch() {
  if (toggleMatch.busy) return;
  toggleMatch.busy = true;
  if (running) terminateMatch();
  else startMatch();
  setTimeout(function () { toggleMatch.busy = false; }, 120);
}

function endMatch(winningTeam) {
  running = false;
  if (rafId) cancelAnimationFrame(rafId);
  trains = [];
  finished = true;
  syncCtrlBtn();
  var winner = winningTeam === 0 ? '蓝方获胜！' :
    winningTeam === 1 ? '粉方获胜！' : '平局！';
  overlay.querySelector('.ov-title').textContent = winner;
  var summaries = [];
  for (var i = 0; i < balls.length; i++) {
    summaries.push((teamMode ? (teamOf(i) === 0 ? '蓝' : '粉') + '队员' +
      (Math.floor(i / 2) + 1) + ' ' : '') + ROLES[selected[i]].name +
      ' 剩余 ' + Math.ceil(hp[i]));
  }
  overlay.querySelector('.ov-sub').textContent = summaries.join(' · ');
  document.getElementById('sideConfirmBtn').textContent = '再来一局';
  hideRolePanels(false);
  overlay.classList.remove('hidden');
  syncCtrlBtn();
  ctrlBar.classList.remove('hidden');
  render();
}

ctrlBtn.addEventListener('click', toggleMatch);

var modeBtn = document.getElementById('modeBtn');
modeBtn.addEventListener('click', function () {
  if (running || finished || delayTimer ||
      (teamMode && (ROLES[selected[0]].role === 'medic' ||
        ROLES[selected[1]].role === 'medic'))) return;
  teamMode = !teamMode;
  modeBtn.classList.toggle('active', teamMode);
  modeBtn.setAttribute('aria-pressed', String(teamMode));
  document.getElementById('rolePanels').classList.toggle('team-mode', teamMode);
  resetMatch();
  syncTopNames();
  syncRolePickButtons();
  syncModeButton();
  updateHUD();
  render();
});

/* ============ 延时 5 秒开始 ============ */
var delayBtn = document.getElementById('delayBtn');
var delayTimer = null;
delayBtn.addEventListener('click', function () {
  if (delayTimer || running) return;          // 已在倒计时 / 对局进行中，忽略
  var n = 5;
  delayBtn.textContent = '准备中 ' + n;
  delayBtn.disabled = true;
  modeBtn.disabled = true;
  delayTimer = setInterval(function () {
    n--;
    if (n <= 0) {
      clearInterval(delayTimer);
      delayTimer = null;
      delayBtn.textContent = '延时 5 秒开始';
      delayBtn.disabled = false;
      syncModeButton();
      startMatch();                            // 到点开赛
    } else {
      delayBtn.textContent = '准备中 ' + n;
    }
  }, 1000);
});
document.getElementById('sideConfirmBtn').addEventListener('click', function () {
  overlay.classList.add('hidden');
  terminateMatch();
});

/* ============ 启动：先渲染一次，再用 setInterval 持续驱动 ============ */
buildRoleList(0);
buildRoleList(1);
buildRoleList(2);
buildRoleList(3);
syncTopNames();
resetMatch();
syncRolePickButtons();
syncModeButton();
syncCtrlBtn();
ctrlBar.classList.remove('hidden');
render();

setInterval(function () {
  try {
    globalTime += 1 / 60;
    update(1 / 60);
    render();
  } catch (e) {
    /* 静默吞错，避免循环自爆 */
  }
}, 16);
</script>
</body>
</html>
